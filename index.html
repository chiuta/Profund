"fr": "Quelle est la première chose que tu fais en te réveillant ?", "it": "Qual è la prima cosa che fai quando ti svegli?", "es": "¿Qué es lo primero que haces al despertarte?", "pt": "Qual é a primeira coisa que fazes quando acordas?", "de": "Was ist das Erste, was du nach dem Aufwachen tust?", "hu": "Mi az első dolog, amit felkeléskor csinálsz?"}, {"ro": "Ai un interes/o trăsătură la care nimeni nu s-ar aștepta de la tine?", "en": "Do you have an interest or trait that no one would expect from you?", "fr": "As-tu un intérêt ou un trait auquel personne ne s'attendrait de ta part ?", "it": "Hai un interesse o un tratto che nessuno si aspetterebbe da te?", "es": "¿Tienes algún interés o rasgo que nadie esperaría de ti?", "pt": "Tens algum interesse ou traço que ninguém esperaria de ti?", "de": "Hast du ein Interesse oder eine Eigenschaft, die niemand von dir erwarten würde?", "hu": "Van olyan érdeklődési köröd vagy tulajdonságod, amit senki sem várna tőled?"}, {"ro": "Dacă ai fi blocat(ă) un an pe o insulă, pe cine ai vrea să ai acolo cu tine?", "en": "If you were stuck on an island for a year, who would you want there with you?", "fr": "Si tu étais bloqué(e) un an sur une île, qui voudrais-tu avoir là avec toi ?", "it": "Se fossi bloccato/a su un'isola per un anno, chi vorresti avere con te?", "es": "Si te quedaras atrapado/a en una isla durante un año, ¿a quién querrías tener contigo?", "pt": "Se ficasses preso/a numa ilha durante um ano, quem gostarias de ter contigo?", "de": "Wenn du ein Jahr lang auf einer Insel festsäßest, wen würdest du gern bei dir haben?", "hu": "Ha egy évig egy szigeten ragadnál, kit szeretnél magad mellett tudni?"}, {"ro": "Casa ta cu toate lucrurile tale e în flăcări – ce două lucruri ai salva?", "en": "Your house with all your stuff is on fire – which two things would you save?", "fr": "Ta maison avec toutes tes affaires est en flammes – quelles deux choses sauverais-tu ?", "it": "La tua casa con tutte le tue cose va a fuoco: quali due cose salveresti?", "es": "Tu casa con todas tus cosas se está quemando: ¿qué dos cosas salvarías?", "pt": "A tua casa com todas as tuas coisas está a arder — que duas coisas salvarias?", "de": "Dein Haus mit all deinen Sachen brennt – welche zwei Dinge würdest du retten?", "hu": "Ég a házad az összes holmiddal – melyik két dolgot mentenéd ki?"}, {"ro": "Când ești foarte leneș(ă) și demotivat(ă), care e trucul tău ca să te împingi de la spate și să te apuci iar de treabă?", "en": "When you are really lazy and unmotivated, what is your trick to push yourself and start doing something again?", "fr": "Quand tu es très paresseux(se) et démotivé(e), quelle est ton astuce pour te pousser et te remettre au travail ?", "it": "Quando sei davvero pigro/a e senza motivazione, qual è il tuo trucco per darti una spinta e rimetterti a fare qualcosa?", "es": "Cuando estás muy perezoso/a y sin motivación, ¿cuál es tu truco para darte un empujón y volver a ponerte en marcha?", "pt": "Quando estás mesmo preguiçoso/a e sem motivação, qual é o teu truque para te dares um impulso e voltares a fazer alguma coisa?", "de": "Wenn du richtig faul und unmotiviert bist, was ist dein Trick, um dich aufzuraffen und wieder etwas anzufangen?", "hu": "Ha igazán lusta vagy és motiválatlan, mi a trükköd, hogy összeszedd magad, és újra belekezdj valamibe?"}, {"ro": "Dacă ai fi sigur(ă) că ți s-ar vinde cartea de 100.000 de ori – despre ce ai scrie?", "en": "If you were sure that your book would be sold 100,000 times – what would you write about?", "fr": "Si tu étais sûr(e) que ton livre se vendrait à 100 000 exemplaires – sur quoi écrirais-tu ?", "it": "Se fossi sicuro/a che il tuo libro venderà 100.000 copie, di cosa scriveresti?", "es": "Si tuvieras la certeza de que tu libro se vendería 100.000 veces, ¿sobre qué escribirías?", "pt": "Se tivesses a certeza de que o teu livro iria vender 100 000 exemplares — sobre o que escreverias?", "de": "Wenn du sicher wüsstest, dass sich dein Buch 100.000-mal verkaufen würde – worüber würdest du schreiben?", "hu": "Ha biztosan tudnád, hogy a könyved 100 000 példányban fogy – miről írnál?"}, {"ro": "Ce ai face dacă ai fi președinte?", "en": "What would you do if you were president?", "fr": "Que ferais-tu si tu étais président(e) ?", "it": "Cosa faresti se fossi presidente?", "es": "¿Qué harías si fueras presidente/a?", "pt": "O que farias se fosses presidente?", "de": "Was würdest du tun, wenn du Präsident(in) wärst?", "hu": "Mit tennél, ha te lennél az elnök?"}, {"ro": "Dacă ai putea schimba ceva la felul în care ai fost crescut(ă) – ce ar fi?", "en": "If you could change something about the way you were raised – what would it be?", "fr": "Si tu pouvais changer quelque chose à la façon dont tu as été élevé(e) – qu'est-ce que ce serait ?", "it": "Se potessi cambiare qualcosa del modo in cui sei stato/a educato/a, cosa sarebbe?", "es": "Si pudieras cambiar algo de la forma en que te criaron, ¿qué sería?", "pt": "Se pudesses mudar alguma coisa na forma como foste educado/a — o que seria?", "de": "Wenn du etwas an deiner Erziehung ändern könntest – was wäre das?", "hu": "Ha megváltoztathatnál valamit abban, ahogyan felneveltek – mi lenne az?"}, {"ro": "Dacă te-ai trezi mâine cu o nouă abilitate – care ar fi?", "en": "If you could wake up with a new skill tomorrow – what would it be?", "fr": "Si tu pouvais te réveiller demain avec une nouvelle compétence – laquelle serait-ce ?", "it": "Se domani potessi svegliarti con una nuova abilità, quale sarebbe?", "es": "Si mañana pudieras despertarte con una nueva habilidad, ¿cuál sería?", "pt": "Se amanhã pudesses acordar com uma nova competência — qual seria?", "de": "Wenn du morgen mit einer neuen Fähigkeit aufwachen könntest – welche wäre es?", "hu": "Ha holnap egy új képességgel ébredhetnél – mi lenne az?"}, {"ro": "Dacă ai muri diseară fără șansa de a mai vorbi cu cineva înainte – ce ai regreta că nu i-ai spus cuiva? De ce nu i-ai spus deja?", "en": "If you died this evening without the chance to speak to anyone first – what would you regret not having told someone? Why haven't you told them already?", "fr": "Si tu mourais ce soir sans avoir la chance de parler à quiconque avant – que regretterais-tu de ne pas avoir dit à quelqu'un ? Pourquoi ne le lui as-tu pas déjà dit ?", "it": "Se morissi stasera senza avere la possibilità di parlare prima con qualcuno, cosa rimpiangeresti di non aver detto a qualcuno? Perché non glielo hai già detto?", "es": "Si murieras esta noche sin poder hablar antes con nadie, ¿qué lamentarías no haberle dicho a alguien? ¿Por qué no se lo has dicho ya?", "pt": "Se morresses esta noite sem hipótese de falar antes com ninguém — o que lamentarias não ter dito a alguém? Porque é que ainda não o disseste?", "de": "Wenn du heute Abend sterben würdest, ohne vorher noch mit jemandem sprechen zu können – was würdest du bereuen, jemandem nicht gesagt zu haben? Warum hast du es ihm oder ihr nicht schon längst gesagt?", "hu": "Ha ma este meghalnál úgy, hogy előtte már senkivel sem beszélhetnél – mit bánnál, hogy nem mondtál el valakinek? Miért nem mondtad el már eddig?"}]}, {"title": {"ro": "Blocul 3 · profund", "en": "Block 3 · deep", "fr": "Bloc 3 · profond", "it": "Blocco 3 · profondo", "es": "Bloque 3 · profundo", "pt": "Bloco 3 · profundo", "de": "Block 3 · tiefgründig", "hu": "3. blokk · mély"}, "tag": {"ro": "profund", "en": "deep", "fr": "profond", "it": "profondo", "es": "profundo", "pt": "profundo", "de": "tiefgründig", "hu": "mély"}, "q": [{"ro": "Cine ești tu?", "en": "Who are you?", "fr": "Qui es-tu ?", "it": "Chi sei?", "es": "¿Quién eres?", "pt": "Quem és tu?", "de": "Wer bist du?", "hu": "Ki vagy te?"}, {"ro": "Ce mai faci… cu adevărat?", "en": "How are you… really?", "fr": "Comment vas-tu… vraiment ?", "it": "Come stai… davvero?", "es": "¿Cómo estás… de verdad?", "pt": "Como estás… mesmo?", "de": "Wie geht es dir… wirklich?", "hu": "Hogy vagy… igazából?"}, {"ro": "Ce vrei să realizezi în viață?", "en": "What do you want to achieve in life?", "fr": "Que veux-tu accomplir dans la vie ?", "it": "Cosa vuoi realizzare nella vita?", "es": "¿Qué quieres lograr en la vida?", "pt": "O que queres alcançar na vida?", "de": "Was willst du im Leben erreichen?", "hu": "Mit szeretnél elérni az életben?"}, {"ro": "Cum faci față anxietății?", "en": "How do you deal with anxiety?", "fr": "Comment gères-tu l'anxiété ?", "it": "Come affronti l'ansia?", "es": "¿Cómo afrontas la ansiedad?", "pt": "Como lidas com a ansiedade?", "de": "Wie gehst du mit Angst um?", "hu": "Hogyan birkózol meg a szorongással?"}, {"ro": "Povestește-ți viața în 4 minute, cât mai detaliat posibil.", "en": "Share your life story in 4 minutes, as detailed as possible.", "fr": "Raconte l'histoire de ta vie en 4 minutes, le plus en détail possible.", "it": "Racconta la storia della tua vita in 4 minuti, con più dettagli possibile.", "es": "Cuenta la historia de tu vida en 4 minutos, con el mayor detalle posible.", "pt": "Conta a história da tua vida em 4 minutos, o mais pormenorizada possível.", "de": "Erzähle deine Lebensgeschichte in 4 Minuten, so ausführlich wie möglich.", "hu": "Mesélj az élettörténetedről 4 percben, a lehető legrészletesebben."}, {"ro": "Care e cea mai mare realizare a ta?", "en": "What is your biggest achievement?", "fr": "Quelle est ta plus grande réussite ?", "it": "Qual è il tuo più grande traguardo?", "es": "¿Cuál es tu mayor logro?", "pt": "Qual é a tua maior conquista?", "de": "Was ist deine größte Leistung?", "hu": "Mi a legnagyobb eredményed?"}, {"ro": "Care e pasiunea ta?", "en": "What is your passion?", "fr": "Quelle est ta passion ?", "it": "Qual è la tua passione?", "es": "¿Cuál es tu pasión?", "pt": "Qual é a tua paixão?", "de": "Was ist deine Leidenschaft?", "hu": "Mi a szenvedélyed?"}, {"ro": "Pe o scară de la 1 la 10, cât de împlinit(ă) ești?", "en": "On a scale from 1 to 10, how content are you?", "fr": "Sur une échelle de 1 à 10, à quel point es-tu épanoui(e) ?", "it": "Su una scala da 1 a 10, quanto sei soddisfatto/a?", "es": "En una escala del 1 al 10, ¿cuán satisfecho/a estás?", "pt": "Numa escala de 1 a 10, quão satisfeito/a estás?", "de": "Wie zufrieden bist du auf einer Skala von 1 bis 10?", "hu": "Egy 1-től 10-ig terjedő skálán mennyire vagy elégedett?"}, {"ro": "Ce trăsătură de personalitate îți place la tine?", "en": "What personality trait do you like about yourself?", "fr": "Quel trait de personnalité aimes-tu chez toi ?", "it": "Quale tratto della tua personalità ti piace di te?", "es": "¿Qué rasgo de tu personalidad te gusta de ti?", "pt": "Que traço da tua personalidade gostas em ti?", "de": "Welche Persönlichkeitseigenschaft magst du an dir?", "hu": "Melyik személyiségjegyedet szereted magadban?"}, {"ro": "Ce trăsătură de caracter apreciezi cel mai mult la tine?", "en": "What character trait do you value most in yourself?", "fr": "Quel trait de caractère apprécies-tu le plus chez toi ?", "it": "Quale qualità del tuo carattere apprezzi di più in te?", "es": "¿Qué rasgo de carácter valoras más en ti?", "pt": "Que traço de carácter mais valorizas em ti?", "de": "Welche Charaktereigenschaft schätzt du an dir am meisten?", "hu": "Melyik jellemvonásodat becsülöd magadban a legtöbbre?"}]}, {"title": {"ro": "Blocul 4 · despre conceptul fără-troc", "en": "Block 4 · about the trade-free concept", "fr": "Bloc 4 · le concept sans-échange", "it": "Blocco 4 · il concetto trade-free", "es": "Bloque 4 · el concepto trade-free", "pt": "Bloco 4 · o conceito trade-free", "de": "Block 4 · das Trade-free-Konzept", "hu": "4. blokk · a trade-free koncepció"}, "tag": {"ro": "fără-troc", "en": "trade-free", "fr": "sans-échange", "it": "trade-free", "es": "trade-free", "pt": "trade-free", "de": "trade-free", "hu": "trade-free"}, "q": [{"ro": "Dacă ai avea tot ce vrei și îți trebuie fără să dai nimic în schimb (adică fără-troc), ce ți-ar plăcea să faci?", "en": "If you had everything you want and need without giving anything in return for it (thus trade-free), what would you love to do?", "fr": "Si tu avais tout ce que tu veux et dont tu as besoin sans rien donner en retour (donc sans-échange), qu'aimerais-tu faire ?", "it": "Se avessi tutto ciò che vuoi e di cui hai bisogno senza dare nulla in cambio (cioè trade-free), cosa ameresti fare?", "es": "Si tuvieras todo lo que quieres y necesitas sin dar nada a cambio (es decir, trade-free), ¿qué te encantaría hacer?", "pt": "Se tivesses tudo o que queres e de que precisas sem dares nada em troca (ou seja, trade-free), o que gostarias de fazer?", "de": "Wenn du alles hättest, was du willst und brauchst, ohne etwas dafür zu geben (also trade-free), was würdest du gern tun?", "hu": "Ha mindened meglenne, amit akarsz és amire szükséged van, anélkül, hogy bármit adnál érte cserébe (vagyis trade-free), mit szeretnél csinálni?"}, {"ro": "Ai pus vreodată sub semnul întrebării conceptul de troc/schimb?", "en": "Have you ever questioned the concept of trade?", "fr": "As-tu déjà remis en question le concept d'échange ?", "it": "Hai mai messo in discussione il concetto di commercio?", "es": "¿Alguna vez has cuestionado el concepto de comercio?", "pt": "Alguma vez questionaste o conceito de comércio?", "de": "Hast du jemals das Konzept des Handels infrage gestellt?", "hu": "Megkérdőjelezted már valaha a kereskedelem fogalmát?"}, {"ro": "Ce lucru sau activitate fără-troc îți place?", "en": "What trade-free thing or activity do you like?", "fr": "Quelle chose ou activité sans-échange aimes-tu ?", "it": "Quale cosa o attività trade-free ti piace?", "es": "¿Qué cosa o actividad trade-free te gusta?", "pt": "Que coisa ou atividade trade-free te agrada?", "de": "Welche trade-free Sache oder Aktivität magst du?", "hu": "Melyik trade-free dolgot vagy tevékenységet szereted?"}, {"ro": "Te-ai gândit vreodată la troc ca la originea majorității problemelor, ca o forță care îi poate împinge pe oameni să creeze probleme?", "en": "Have you ever thought about trade as the origin of most problems, acting as a force that can push people to create problems?", "fr": "As-tu déjà pensé à l'échange comme à l'origine de la plupart des problèmes, telle une force qui peut pousser les gens à en créer ?", "it": "Hai mai pensato al commercio come all'origine della maggior parte dei problemi, una forza che può spingere le persone a crearne?", "es": "¿Alguna vez has pensado en el comercio como el origen de la mayoría de los problemas, una fuerza que puede empujar a las personas a crearlos?", "pt": "Já pensaste no comércio como a origem da maior parte dos problemas, uma força que pode levar as pessoas a criá-los?", "de": "Hast du schon einmal darüber nachgedacht, dass der Handel der Ursprung der meisten Probleme sein könnte – eine Kraft, die Menschen dazu bringen kann, Probleme zu schaffen?", "hu": "Gondoltál már arra, hogy a kereskedelem a legtöbb probléma forrása, olyan erő, amely problémák teremtésére késztetheti az embereket?"}, {"ro": "Prieteniile tale sunt fără-troc?", "en": "Are your friendships trade-free?", "fr": "Tes amitiés sont-elles sans-échange ?", "it": "Le tue amicizie sono trade-free?", "es": "¿Tus amistades son trade-free?", "pt": "As tuas amizades são trade-free?", "de": "Sind deine Freundschaften trade-free?", "hu": "Trade-free a barátságaid?"}, {"ro": "Care troc e cel mai rău pentru tine?", "en": "Which trade is the worst for you?", "fr": "Quel échange est le pire pour toi ?", "it": "Quale tipo di scambio commerciale è il peggiore per te?", "es": "¿Qué intercambio comercial es el peor para ti?", "pt": "Qual é, para ti, a pior troca comercial?", "de": "Welcher Handel ist für dich der schlimmste?", "hu": "Melyik csere a legrosszabb számodra?"}, {"ro": "Îți poți imagina o lume plină de voluntari, proiecte open-source și bunuri/servicii fără-troc?", "en": "Can you imagine a world full of volunteers, open-source projects and trade-free goods and services?", "fr": "Peux-tu imaginer un monde plein de bénévoles, de projets open-source et de biens/services sans-échange ?", "it": "Riesci a immaginare un mondo pieno di volontari, progetti open source e beni e servizi trade-free?", "es": "¿Puedes imaginar un mundo lleno de voluntarios, proyectos de código abierto y bienes y servicios trade-free?", "pt": "Consegues imaginar um mundo cheio de voluntários, projetos de código aberto e bens e serviços trade-free?", "de": "Kannst du dir eine Welt voller Freiwilliger, Open-Source-Projekte und trade-free Güter und Dienstleistungen vorstellen?", "hu": "El tudsz képzelni egy olyan világot, amely tele van önkéntesekkel, nyílt forráskódú projektekkel és trade-free javakkal és szolgáltatásokkal?"}, {"ro": "Care e bunul sau serviciul tău preferat fără-troc?", "en": "What is your favourite trade-free good or service?", "fr": "Quel est ton bien ou service sans-échange préféré ?", "it": "Qual è il tuo bene o servizio trade-free preferito?", "es": "¿Cuál es tu bien o servicio trade-free favorito?", "pt": "Qual é o teu bem ou serviço trade-free preferido?", "de": "Was ist dein liebstes trade-free Gut oder deine liebste trade-free Dienstleistung?", "hu": "Mi a kedvenc trade-free javad vagy szolgáltatásod?"}, {"ro": "Ce ai putea face ca să susții sau să promovezi ideea fără-troc?", "en": "What could you do to support or promote the trade-free idea?", "fr": "Que pourrais-tu faire pour soutenir ou promouvoir l'idée du sans-échange ?", "it": "Cosa potresti fare per sostenere o promuovere l'idea trade-free?", "es": "¿Qué podrías hacer para apoyar o promover la idea trade-free?", "pt": "O que poderias fazer para apoiar ou promover a ideia trade-free?", "de": "Was könntest du tun, um die Trade-free-Idee zu unterstützen oder zu verbreiten?", "hu": "Mit tehetnél a trade-free eszme támogatásáért vagy terjesztéséért?"}, {"ro": "Ce lucru ai vrea să-l vezi mai întâi devenind fără-troc?", "en": "What would you love to see become trade-free first?", "fr": "Quelle chose aimerais-tu voir devenir sans-échange en premier ?", "it": "Cosa ameresti vedere diventare trade-free per prima?", "es": "¿Qué te encantaría ver convertirse primero en trade-free?", "pt": "O que gostarias de ver tornar-se trade-free em primeiro lugar?", "de": "Was würdest du am liebsten als Erstes trade-free sehen?", "hu": "Mit szeretnél először trade-free-vé válni látni?"}]}, {"title": {"ro": "Blocul 5 · aleatoriu", "en": "Block 5 · random", "fr": "Bloc 5 · aléatoire", "it": "Blocco 5 · a caso", "es": "Bloque 5 · al azar", "pt": "Bloco 5 · ao acaso", "de": "Block 5 · Zufall", "hu": "5. blokk · véletlen"}, "tag": {"ro": "aleatoriu", "en": "random", "fr": "aléatoire", "it": "a caso", "es": "al azar", "pt": "ao acaso", "de": "Zufall", "hu": "véletlen"}, "q": [{"ro": "Ce faci ca să te calmezi?", "en": "What do you do to calm down?", "fr": "Que fais-tu pour te calmer ?", "it": "Cosa fai per calmarti?", "es": "¿Qué haces para calmarte?", "pt": "O que fazes para te acalmares?", "de": "Was tust du, um dich zu beruhigen?", "hu": "Mit csinálsz, hogy megnyugodj?"}, {"ro": "Ce înveți în prezent în viață?", "en": "What are you currently learning in life?", "fr": "Qu'apprends-tu en ce moment dans la vie ?", "it": "Cosa stai imparando in questo momento della tua vita?", "es": "¿Qué estás aprendiendo actualmente en la vida?", "pt": "O que estás a aprender neste momento na vida?", "de": "Was lernst du gerade im Leben?", "hu": "Mit tanulsz éppen az életben?"}, {"ro": "Descrie-te în trei cuvinte.", "en": "Describe yourself in three words.", "fr": "Décris-toi en trois mots.", "it": "Descriviti con tre parole.", "es": "Descríbete con tres palabras.", "pt": "Descreve-te em três palavras.", "de": "Beschreibe dich in drei Worten.", "hu": "Jellemezd magad három szóval."}, {"ro": "Dacă ai putea întâlni orice persoană care a trăit vreodată, pe cine ai vrea să întâlnești?", "en": "If you could meet any person who ever lived, who would you want to meet?", "fr": "Si tu pouvais rencontrer n'importe quelle personne ayant vécu, qui voudrais-tu rencontrer ?", "it": "Se potessi incontrare una qualsiasi persona vissuta nella storia, chi vorresti incontrare?", "es": "Si pudieras conocer a cualquier persona que haya vivido jamás, ¿a quién te gustaría conocer?", "pt": "Se pudesses conhecer qualquer pessoa que alguma vez tenha vivido, quem gostarias de conhecer?", "de": "Wenn du einen beliebigen Menschen treffen könntest, der je gelebt hat, wen würdest du gern treffen?", "hu": "Ha találkozhatnál bárkivel, aki valaha élt, kivel szeretnél találkozni?"}, {"ro": "Ce faci când o decizie e dificilă pentru tine?", "en": "What do you do when a decision is difficult for you?", "fr": "Que fais-tu quand une décision est difficile pour toi ?", "it": "Cosa fai quando una decisione è difficile per te?", "es": "¿Qué haces cuando una decisión te resulta difícil?", "pt": "O que fazes quando uma decisão é difícil para ti?", "de": "Was tust du, wenn dir eine Entscheidung schwerfällt?", "hu": "Mit teszel, ha nehéz döntés előtt állsz?"}, {"ro": "Îți place să faci voluntariat? Dacă da, pentru ce?", "en": "Do you like to volunteer? If yes, for what?", "fr": "Aimes-tu faire du bénévolat ? Si oui, pour quoi ?", "it": "Ti piace fare volontariato? Se sì, per cosa?", "es": "¿Te gusta hacer voluntariado? Si es así, ¿en qué?", "pt": "Gostas de fazer voluntariado? Se sim, em quê?", "de": "Engagierst du dich gern ehrenamtlich? Wenn ja, wofür?", "hu": "Szeretsz önkénteskedni? Ha igen, mire?"}, {"ro": "Unde te vezi peste 10 ani?", "en": "Where do you see yourself in 10 years?", "fr": "Où te vois-tu dans 10 ans ?", "it": "Dove ti vedi tra 10 anni?", "es": "¿Dónde te ves dentro de 10 años?", "pt": "Onde te vês daqui a 10 anos?", "de": "Wo siehst du dich in 10 Jahren?", "hu": "Hol látod magad 10 év múlva?"}, {"ro": "Numește 3 persoane pe care le consideri modele.", "en": "Name 3 people you consider role models.", "fr": "Nomme 3 personnes que tu considères comme des modèles.", "it": "Nomina 3 persone che consideri modelli di riferimento.", "es": "Nombra 3 personas que consideres modelos a seguir.", "pt": "Indica 3 pessoas que consideres modelos a seguir.", "de": "Nenne 3 Menschen, die du als Vorbilder ansiehst.", "hu": "Nevezz meg 3 embert, akit példaképnek tartasz."}, {"ro": "Cum te descriu prietenii tăi?", "en": "How do your friends describe you?", "fr": "Comment tes amis te décrivent-ils ?", "it": "Come ti descrivono i tuoi amici?", "es": "¿Cómo te describen tus amigos?", "pt": "Como te descrevem os teus amigos?", "de": "Wie beschreiben dich deine Freunde?", "hu": "Hogyan jellemeznek a barátaid?"}, {"ro": "Există ceva fără de care nu ai putea trăi?", "en": "Is there something you couldn't live without?", "fr": "Y a-t-il quelque chose dont tu ne pourrais pas te passer ?", "it": "C'è qualcosa senza cui non potresti vivere?", "es": "¿Hay algo sin lo que no podrías vivir?", "pt": "Há alguma coisa sem a qual não conseguirias viver?", "de": "Gibt es etwas, ohne das du nicht leben könntest?", "hu": "Van valami, nélkül nem tudnál élni?"}]}, {"title": {"ro": "Blocul 6 · extra profund", "en": "Block 6 · extra deep", "fr": "Bloc 6 · extra profond", "it": "Blocco 6 · extra profondo", "es": "Bloque 6 · extra profundo", "pt": "Bloco 6 · extra profundo", "de": "Block 6 · extra tiefgründig", "hu": "6. blokk · extra mély"}, "tag": {"ro": "extra profund", "en": "extra deep", "fr": "extra profond", "it": "extra profondo", "es": "extra profundo", "pt": "extra profundo", "de": "extra tiefgründig", "hu": "extra mély"}, "q": [{"ro": "Povestește un moment de cotitură din viața ta.", "en": "Share a turning point in your life.", "fr": "Raconte un tournant de ta vie.", "it": "Racconta una svolta nella tua vita.", "es": "Comparte un punto de inflexión en tu vida.", "pt": "Partilha um ponto de viragem na tua vida.", "de": "Erzähle von einem Wendepunkt in deinem Leben.", "hu": "Mesélj az életed egy fordulópontjáról."}, {"ro": "Care e cel mai nebunesc sau curajos lucru pe care l-ai făcut?", "en": "What is the craziest or bravest thing you have done?", "fr": "Quelle est la chose la plus folle ou la plus courageuse que tu aies faite ?", "it": "Qual è la cosa più folle o più coraggiosa che tu abbia mai fatto?", "es": "¿Qué es lo más loco o lo más valiente que has hecho?", "pt": "Qual é a coisa mais louca ou mais corajosa que já fizeste?", "de": "Was ist das Verrückteste oder Mutigste, das du je getan hast?", "hu": "Mi a legőrültebb vagy legbátrabb dolog, amit valaha tettél?"}, {"ro": "Povestește un moment extrem de jenant din viața ta.", "en": "Share an extremely embarrassing moment of your life.", "fr": "Raconte un moment extrêmement embarrassant de ta vie.", "it": "Racconta un momento estremamente imbarazzante della tua vita.", "es": "Comparte un momento sumamente embarazoso de tu vida.", "pt": "Partilha um momento extremamente embaraçoso da tua vida.", "de": "Erzähle von einem extrem peinlichen Moment in deinem Leben.", "hu": "Mesélj az életed egy rendkívül kínos pillanatáról."}, {"ro": "Există ceva pentru care ești deosebit de recunoscător(oare)?", "en": "Is there something you are especially thankful for?", "fr": "Y a-t-il quelque chose pour lequel tu es particulièrement reconnaissant(e) ?", "it": "C'è qualcosa per cui sei particolarmente grato/a?", "es": "¿Hay algo por lo que estés especialmente agradecido/a?", "pt": "Há alguma coisa pela qual estejas especialmente grato/a?", "de": "Gibt es etwas, wofür du besonders dankbar bist?", "hu": "Van valami, amiért különösen hálás vagy?"}, {"ro": "Ce activități și interese sunt foarte importante pentru tine?", "en": "Which activities and interests are very important to you?", "fr": "Quelles activités et quels intérêts sont très importants pour toi ?", "it": "Quali attività e interessi sono molto importanti per te?", "es": "¿Qué actividades e intereses son muy importantes para ti?", "pt": "Que atividades e interesses são muito importantes para ti?", "de": "Welche Aktivitäten und Interessen sind dir sehr wichtig?", "hu": "Mely tevékenységek és érdeklődési körök nagyon fontosak számodra?"}, {"ro": "A s of an awesome friendship for you?", "fr": "Quelles sont, pour toi, les parties essentielles d'une amitié formidable ?", "it": "Quali sono per te gli elementi fondamentali di un'amicizia bellissima?", "es": "¿Cuáles son para ti los elementos cruciales de una gran amistad?", "pt": "Quais são, para ti, os elementos cruciais de uma grande amizade?", "de": "Was sind für dich die entscheidenden Bestandteile einer großartigen Freundschaft?", "hu": "Mik számodra egy csodálatos barátság kulcsfontosságú elemei?"}, {"ro": "Dacă vrei să povestești despre o pasiune sau iubire din trecut, cum v-ați cunoscut?", "en": "If you want to share a story of a past crush or love, how did you meet?", "fr": "Si tu veux raconter l'histoire d'un coup de cœur ou d'un amour passé, comment vous êtes-vous rencontrés ?", "it": "Se vuoi raccontare una storia di una cotta o di un amore passato, come vi siete conosciuti?", "es": "Si quieres compartir una historia de un amor o un flechazo pasado, ¿cómo os conocisteis?", "pt": "Se quiseres partilhar uma história de uma paixão ou de um amor passado, como se conheceram?", "de": "Wenn du eine Geschichte über eine frühere Schwärmerei oder Liebe teilen möchtest: Wie habt ihr euch kennengelernt?", "hu": "Ha szeretnél megosztani egy történetet egy régi szerelemről vagy fellángolásról: hogyan ismerkedtetek meg?"}]}, {"title": {"ro": "Blocul 8 · aici și acum", "en": "Block 8 · here and now", "fr": "Bloc 8 · ici et maintenant", "it": "Blocco 8 · qui e ora", "es": "Bloque 8 · aquí y ahora", "pt": "Bloco 8 · aqui e agora", "de": "Block 8 · Hier und jetzt", "hu": "8. blokk · itt és most"}, "tag": {"ro": "aici și acum", "en": "here and now", "fr": "ici et maintenant", "it": "qui e ora", "es": "aquí y ahora", "pt": "aqui e agora", "de": "Hier und jetzt", "hu": "itt és most"}, "q": [{"ro": "Ce te fascinează la cineva care stă aici, lângă tine?", "en": "What fascinates you about someone sitting here?", "fr": "Qu'est-ce qui te fascine chez quelqu'un assis ici ?", "it": "Cosa ti affascina di una persona seduta qui?", "es": "¿Qué te fascina de alguien que está sentado aquí?", "pt": "O que te fascina em alguém que está sentado aqui?", "de": "Was fasziniert dich an jemandem, der hier sitzt?", "hu": "Mi nyűgöz le valakiben, aki itt ül?"}, {"ro": "Dacă ai putea călători în timp și ai privi înapoi la viața ta de la 80 de ani, ce sfat ți-ai da pentru situația ta actuală?", "en": "If you could travel in time and look back on your life at 80, what advice would you give yourself for your current situation?", "fr": "Si tu pouvais voyager dans le temps et regarder ta vie depuis tes 80 ans, quel conseil te donnerais-tu pour ta situation actuelle ?", "it": "Se potessi viaggiare nel tempo e guardare la tua vita a 80 anni, quale consiglio daresti a te stesso/a per la tua situazione attuale?", "es": "Si pudieras viajar en el tiempo y mirar tu vida a los 80 años, ¿qué consejo te darías para tu situación actual?", "pt": "Se pudesses viajar no tempo e olhar para a tua vida aos 80 anos, que conselho darias a ti próprio/a para a tua situação atual?", "de": "Wenn du in der Zeit reisen und mit 80 auf dein Leben zurückblicken könntest, welchen Rat würdest du dir für deine jetzige Situation geben?", "hu": "Ha időutazással visszatekinthetnél az életedre 80 évesen, milyen tanácsot adnál magadnak a mostani helyzetedre?"}, {"ro": "Dacă ai muri mâine, ce ai face azi?", "en": "If you would die tomorrow, what would you do today?", "fr": "Si tu devais mourir demain, que ferais-tu aujourd'hui ?", "it": "Se domani dovessi morire, cosa faresti oggi?", "es": "Si murieras mañana, ¿qué harías hoy?", "pt": "Se morresses amanhã, o que farias hoje?", "de": "Wenn du morgen sterben würdest, was würdest du heute tun?", "hu": "Ha holnap meghalnál, mit tennél ma?"}, {"ro": "La ce te gândești în acest moment?", "en": "What's on your mind at the moment?", "fr": "À quoi penses-tu en ce moment ?", "it": "Cosa hai in mente in questo momento?", "es": "¿Qué tienes en la cabeza en este
