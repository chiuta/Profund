  BLOCKS.forEach(b=>{
    if(b.title[l]===undefined) b.title[l]=b.title.en;
    if(b.tag[l]===undefined) b.tag[l]=b.tag.en;
    b.q.forEach(it=>{ if(it[l]===undefined) it[l]=it.en; });
  });
});
const BRAND_HTML = {}; LANGS.forEach(l=>{ BRAND_HTML[l]=I18N[l].brand; });
const BRAND_PLAIN = {}; LANGS.forEach(l=>{ BRAND_PLAIN[l]=I18N[l].brand.replace(/<[^>]*>/g,''); });
let lang = 'en';
try{
  (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||'']).some(x=>{
    const c=String(x||'').slice(0,2).toLowerCase();
    if(LANGS.indexOf(c)>=0){ lang=c; return true; }
    return false;
  });
}catch(e){}
let active = 0;
let lastDraw = null;
let deck = [];
let deckIdx = 0;

/* restore saved language (gracefully ignored where storage is unavailable) */
try{ const s=localStorage.getItem('profund_lang'); if(s && LANGS.indexOf(s)>=0) lang=s; }catch(e){}

const nav = document.getElementById('blocksNav');
const grid = document.getElementById('cardGrid');
const blockTitle = document.getElementById('blockTitle');
const drawCard = document.getElementById('drawCard');
const drawText = document.getElementById('drawText');
const drawTag = document.getElementById('drawTag');

document.querySelectorAll('.lang-toggle button[data-l]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  try{ localStorage.setItem('profund_lang', l); }catch(e){}
  document.querySelectorAll('.lang-toggle button[data-l]').forEach(b=>b.classList.toggle('active', b.dataset.l===l));
  const t = I18N[l];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(t[k] !== undefined) el.innerHTML = t[k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ const v=t[el.getAttribute('data-i18n-ph')]; if(v!==undefined) el.placeholder=v; });
  buildTabs();
  selectBlock(active);
  if(turnLine.textContent) showTurn(false);
  if(lastDraw){
    drawTag.textContent = deck.length ? ((deckIdx)+' / '+deck.length+' · '+BLOCKS[lastDraw.bi].tag[l]) : BLOCKS[lastDraw.bi].tag[l];
    drawText.textContent = BLOCKS[lastDraw.bi].q[lastDraw.qi][l];
  }
  buildPrintSheet();
  if(typeof refreshFav==='function') refreshFav();
  if(typeof refreshDaily==='function') refreshDaily();
}

function buildTabs(){
  nav.innerHTML='';
  BLOCKS.forEach((b,i)=>{
    const tab=document.createElement('button');
    tab.className='block-tab'+(i===active?' active':'');
    tab.textContent=(i+1);
    tab.title=b.title[lang];
    tab.onclick=()=>selectBlock(i);
    nav.appendChild(tab);
  });
}

function selectBlock(i){
  active=i;
  [...nav.children].forEach((t,idx)=>t.classList.toggle('active',idx===i));
  blockTitle.textContent=BLOCKS[i].title[lang];
  grid.innerHTML='';
  BLOCKS[i].q.forEach((item,qi)=>{
    const card=document.createElement('button');
    card.className='card';
    card.innerHTML='<div class="card-inner">'+
      '<div class="card-face card-back"><span class="mark">'+BRAND_HTML[lang]+'</span><span class="ripple"></span></div>'+
      '<div class="card-face card-front"><span class="n">'+(i+1)+'.'+(qi+1)+'</span><span class="q">'+item[lang]+'</span></div>'+
    '</div>';
    card.setAttribute('aria-pressed','false');
    card.onclick=()=>{ const on=card.classList.toggle('flipped'); card.setAttribute('aria-pressed',on?'true':'false'); };
    grid.appendChild(card);
  });
}

function showCard(bi,qi,tagText){
  lastDraw={bi,qi};
  showTurn(true);
  drawCard.classList.remove('flip'); void drawCard.offsetWidth; drawCard.classList.add('flip');
  drawTag.textContent = tagText;
  drawText.textContent = BLOCKS[bi].q[qi][lang];
  refreshFav(); startTimer();
}

/* random card (with repeats) */
document.getElementById('drawBtn').onclick=()=>{
  const bi=Math.floor(Math.random()*BLOCKS.length);
  const qi=Math.floor(Math.random()*BLOCKS[bi].q.length);
  showCard(bi,qi,BLOCKS[bi].tag[lang]);
};

/* shuffle whole deck */
function shuffleDeck(){
  deck=[];
  BLOCKS.forEach((b,bi)=>b.q.forEach((_,qi)=>deck.push({bi,qi})));
  for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]];}
  deckIdx=0; lastDraw=null; refreshFav(); stopTimer();
  drawCard.classList.remove('flip'); void drawCard.offsetWidth; drawCard.classList.add('flip');
  drawTag.textContent='0 / '+deck.length;
  drawText.textContent=I18N[lang].deck_shuffled;
}
document.getElementById('shuffleBtn').onclick=shuffleDeck;

/* next card from deck */
document.getElementById('nextBtn').onclick=()=>{
  if(!deck.length){ shuffleDeck(); return; }
  if(deckIdx>=deck.length){
    drawCard.classList.remove('flip'); void drawCard.offsetWidth; drawCard.classList.add('flip');
    drawTag.textContent=deck.length+' / '+deck.length;
    drawText.textContent=I18N[lang].deck_done;
    deck=[]; lastDraw=null; refreshFav(); stopTimer(); return;
  }
  const {bi,qi}=deck[deckIdx]; deckIdx++;
  showCard(bi,qi, deckIdx+' / '+deck.length+' · '+BLOCKS[bi].tag[lang]);
};

/* jucători (opțional, doar în memorie): fiecare carte trasă indică cine răspunde, pe rând */
let players = [];
let turnIdx = 0;
const turnLine = document.getElementById('turnLine');
const playersInput = document.getElementById('playersInput');
function parsePlayers(v){
  const seen = new Set();
  return v.split(',').map(x=>x.trim().slice(0,30)).filter(x=>{ if(!x || seen.has(x.toLowerCase())) return false; seen.add(x.toLowerCase()); return true; }).slice(0,20);
}
function showTurn(advance){
  if(!players.length){ turnLine.textContent=''; return; }
  if(advance){ turnIdx = (turnIdx + 1) % players.length; }
  turnLine.textContent = I18N[lang].turn + ' ' + players[turnIdx];
}
playersInput.addEventListener('input',()=>{ players = parsePlayers(playersInput.value); turnIdx = players.length ? players.length - 1 : 0; turnLine.textContent=''; });

/* scurtături de tastatură în zona de joc */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.defaultPrevented) return;
  const tg=(e.target&&e.target.tagName)||'';
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||tg==='BUTTON'||tg==='A') return;
  const r=document.getElementById('joaca').getBoundingClientRect();
  if(!(r.top<innerHeight*0.6 && r.bottom>innerHeight*0.4)) return; /* nu intercepta derularea în afara zonei de joc */
  if(e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); document.getElementById('nextBtn').click(); }
  else if(e.key==='r'||e.key==='R'){ document.getElementById('drawBtn').click(); }
  else if(e.key==='s'||e.key==='S'){ shuffleDeck(); }
});

/* favorite (doar în memorie; se pot descărca ca text) + temporizator opțional pentru fiecare carte trasă */
const favs = new Map();
const favBtn = document.getElementById('favBtn'), favCount = document.getElementById('favCount');
const timerSel = document.getElementById('timerSel'), timerLine = document.getElementById('timerLine');
let timerId = null;
function favKey(d){ return d.bi+'.'+d.qi; }
function refreshFav(){
  const t = I18N[lang], on = !!(lastDraw && favs.has(favKey(lastDraw)));
  favBtn.innerHTML = on ? t.fav_del : t.fav_add;
  favBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  favCount.textContent = favs.size ? t.fav_count.replace('{n}', favs.size) : '';
}
favBtn.addEventListener('click',()=>{
  if(!lastDraw){ favCount.textContent = I18N[lang].fav_none; return; }
  const k = favKey(lastDraw);
  if(favs.has(k)) favs.delete(k); else favs.set(k, {bi:lastDraw.bi, qi:lastDraw.qi});
  refreshFav();
});
document.getElementById('favDl').addEventListener('click',()=>{
  const t = I18N[lang];
  if(!favs.size){ favCount.textContent = t.fav_empty; return; }
  const lines = [BRAND_PLAIN[lang]+' — '+t.fav_head, ''];
  favs.forEach(d=>lines.push((d.bi+1)+'.'+(d.qi+1)+'  '+BLOCKS[d.bi].q[d.qi][lang]));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')+'\n'],{type:'text/plain;charset=utf-8'}));
  a.download = 'profund-favorite.txt'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } timerLine.textContent=''; timerLine.classList.remove('done'); }
function startTimer(){
  stopTimer();
  let left = parseInt(timerSel.value,10) || 0; if(!left) return;
  const show = ()=>{ timerLine.textContent = I18N[lang].timer_sec.replace('{n}', left); };
  show();
  timerId = setInterval(()=>{
    left--;
    if(left<=0){ clearInterval(timerId); timerId=null; timerLine.textContent = I18N[lang].timer_end; timerLine.classList.add('done'); }
    else show();
  },1000);
}
timerSel.addEventListener('change',()=>{ if(lastDraw) startTimer(); else stopTimer(); });

/* print sheet */
function buildPrintSheet(){
  const sheet=document.getElementById('printSheet');
  let html='<div class="print-head">'+I18N[lang].print_head+'</div><div class="print-grid">';
  BLOCKS.forEach((b,i)=>{
    b.q.forEach((item,qi)=>{
      html+='<div class="print-card"><div class="pc-top">'+b.tag[lang]+' · '+(i+1)+'.'+(qi+1)+'</div><div class="pc-q">'+item[lang]+'</div><div class="pc-foot">'+BRAND_PLAIN[lang]+'</div></div>';
    });
  });
  html+='</div>';
  sheet.innerHTML=html;
}
document.getElementById('printBtn').onclick=()=>{ buildPrintSheet(); window.print(); };

/* ===== provocarea zilei (v2): mână de 5 cărți dintr-un seed al datei; rezultat ca emoji, fără spoilere ===== */
(function(){
  const POOLS = {easy:[0,1,4,8,9], med:[3,7,10,13,14], deep:[2,5,6,11,12]};
  const EM = ['⏭️','🌱','🌊','🔥'];
  function hash(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
  function rng(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
  function pad(n){ return (n<10?'0':'')+n; }
  function dayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  /* mână determinată de (dată, dificultate); indicii (bi,qi) nu depind de limbă */
  function handFor(date,diff){
    const r=rng(hash('profund|'+date+'|'+diff)), pool=POOLS[diff]||POOLS.easy;
    return pool.map(bi=>({bi:bi, qi:Math.floor(r()*BLOCKS[bi].q.length)}));
  }
  function load(){ try{ const o=JSON.parse(localStorage.getItem('profund_daily')||'null'); if(o && typeof o==='object' && o.h && typeof o.h==='object') return o; }catch(e){} return {h:{}}; }
  function save(o){ try{ const ks=Object.keys(o.h).sort(); while(ks.length>400) delete o.h[ks.shift()]; localStorage.setItem('profund_daily', JSON.stringify(o)); }catch(e){} }
  function doneCount(marks){ return marks.filter(m=>m!==null && m!==undefined).length; }
  /* serie: zile consecutive (până azi sau ieri) cu cel puțin o mână încheiată (toate 5 cărțile marcate) */
  function streak(o,today){
    const full=new Set(); Object.keys(o.h).forEach(k=>{ const p=k.split('|'); if(Array.isArray(o.h[k]) && doneCount(o.h[k])===5) full.add(p[0]); });
    const d=new Date(today+'T12:00:00'); let n=0;
    if(!full.has(dayKey(d))) d.setDate(d.getDate()-1);
    while(full.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
    return n;
  }
  const $=id=>document.getElementById(id);
  const hand$=$('dailyHand'), q$=$('dailyQ'), diff$=$('dailyDiff'), train$=$('dailyTrain'), out$=$('dailyOut'), msg$=$('dailyMsg');
  let st=load(), today=dayKey(), cur=0, hand=[], marks=[], diff='easy', trainSeed=0;
  function key(){ return today+'|'+diff; }
  function build(){
    today=dayKey();
    const training=train$.checked; diff=diff$.value;
    hand = training ? handFor('train-'+trainSeed, diff) : handFor(today, diff);
    marks = training ? (build.tm && build.tm.seed===trainSeed+'|'+diff ? build.tm.marks : [null,null,null,null,null]) : (st.h[key()] && st.h[key()].length===5 ? st.h[key()].slice() : [null,null,null,null,null]);
    if(training) build.tm={seed:trainSeed+'|'+diff, marks:marks};
    cur=0; out$.hidden=true; $('dailyShare').hidden=true; msg$.textContent='';
    $('dailyNew').hidden=!training;
    render();
  }
  function render(){
    const t=I18N[lang];
    $('dailyDate').textContent = train$.checked ? t.d_train.split(' (')[0] : today;
    $('dailyStreak').textContent = t.d_streak.replace('{n}', streak(st,today));
    hand$.innerHTML='';
    hand.forEach((c,i)=>{
      const b=document.createElement('button'); b.type='button'; b.className='dslot'; b.dataset.i=i;
      b.setAttribute('aria-pressed', i===cur?'true':'false');
      const m=marks[i];
      b.innerHTML='<span class="em" aria-hidden="true">'+(m===null||m===undefined?'🂠':EM[m])+'</span><span>'+t.d_slot.replace('{n}',i+1)+'</span>';
      b.onclick=()=>{ cur=i; render(); };
      hand$.appendChild(b);
    });
    const c=hand[cur];
    q$.textContent = BLOCKS[c.bi].q[c.qi][lang];
    q$.dataset.bi=c.bi; q$.dataset.qi=c.qi;
    document.querySelectorAll('#dailyRate [data-m]').forEach(b=>b.setAttribute('aria-pressed', marks[cur]===+b.dataset.m ? 'true':'false'));
    const n=doneCount(marks);
    $('dailyProg').textContent = n===5 ? t.d_done.replace('{n}', marks.filter(m=>m>0).length) : t.d_prog.replace('{n}', n);
    $('dailyShare').hidden = n!==5;
    if(n===5){ out$.value=shareText(); out$.hidden=false; } else out$.hidden=true;
  }
  function shareText(){
    const t=I18N[lang], dn={easy:t.d_easy,med:t.d_med,deep:t.d_deep}[diff];
    /* fără textul întrebărilor: doar emoji, data și dificultatea */
    return BRAND_PLAIN[lang]+' · '+(train$.checked? t.d_train.split(' (')[0] : today)+' · '+dn+'\n'+marks.map(m=>EM[m]).join('');
  }
  document.querySelectorAll('#dailyRate [data-m]').forEach(b=>b.addEventListener('click',()=>{
    marks[cur]=+b.dataset.m;
    if(!train$.checked){ st.h[key()]=marks.slice(); save(st); }
    if(cur<4 && doneCount(marks)<5){ const nx=marks.findIndex((m,i)=>i>cur && (m===null||m===undefined)); if(nx>=0) cur=nx; }
    render();
  }));
  diff$.addEventListener('change',build);
  train$.addEventListener('change',()=>{ trainSeed=Math.floor(Math.random()*1e9); build(); });
  $('dailyNew').addEventListener('click',()=>{ trainSeed=Math.floor(Math.random()*1e9); build(); });
  $('dailyShare').addEventListener('click',async()=>{
    const t=I18N[lang]; out$.value=shareText(); out$.hidden=false;
    try{ await navigator.clipboard.writeText(out$.value); msg$.textContent=t.d_copied; }
    catch(e){ out$.focus(); out$.select(); msg$.textContent=t.d_copy_fail; }
  });
  window.refreshDaily=render;
  window.ProfundDaily={handFor:handFor, shareText:shareText, streak:()=>streak(st,today)};
  build();
})();

setLang(lang);
</script>
