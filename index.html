ssimista o realista? Perché?", "es": "¿Eres optimista, pesimista o realista? ¿Por qué?", "pt": "És otimista, pessimista ou realista? Porquê?", "de": "Bist du Optimist(in), Pessimist(in) oder Realist(in)? Warum?", "hu": "Optimista, pesszimista vagy realista vagy? Miért?"}, {"ro": "Care sunt plăcerile tale vinovate?", "en": "What are your guilty pleasures?", "fr": "Quels sont tes plaisirs coupables ?", "it": "Quali sono i tuoi piaceri colpevoli?", "es": "¿Cuáles son tus placeres culpables?", "pt": "Quais são os teus prazeres culposos?", "de": "Was sind deine guilty pleasures?", "hu": "Melyek a bűnös örömeid?"}, {"ro": "Care sunt cele mai mari puncte forte ale tale?", "en": "What are your greatest strengths?", "fr": "Quelles sont tes plus grandes forces ?", "it": "Quali sono i tuoi punti di forza maggiori?", "es": "¿Cuáles son tus mayores fortalezas?", "pt": "Quais são os teus maiores pontos fortes?", "de": "Was sind deine größten Stärken?", "hu": "Melyek a legnagyobb erősségeid?"}, {"ro": "Care e cea mai importantă zi a anului pentru tine (dacă ai una)? De ce?", "en": "What is the most important day of the year for you (if you have one)? Why?", "fr": "Quel est le jour le plus important de l'année pour toi (si tu en as un) ? Pourquoi ?", "it": "Qual è il giorno più importante dell'anno per te (se ne hai uno)? Perché?", "es": "¿Cuál es el día más importante del año para ti (si tienes alguno)? ¿Por qué?", "pt": "Qual é o dia mais importante do ano para ti (se tiveres algum)? Porquê?", "de": "Was ist für dich der wichtigste Tag des Jahres (falls du einen hast)? Warum?", "hu": "Mi számodra az év legfontosabb napja (ha van ilyen)? Miért?"}, {"ro": "Despre ce subiect de conversație îți e confortabil să vorbești?", "en": "What topic of conversation is comfortable for you to talk about?", "fr": "De quel sujet de conversation es-tu à l'aise de parler ?", "it": "Di quale argomento di conversazione ti viene facile parlare?", "es": "¿De qué tema de conversación te resulta cómodo hablar?", "pt": "Sobre que assunto de conversa te sentes à vontade para falar?", "de": "Über welches Gesprächsthema sprichst du gern?", "hu": "Milyen beszélgetési téma van, amelyről kényelmesen beszélsz?"}, {"ro": "Există un cântec din copilărie pe care încă ți-l amintești? Cântă-l.", "en": "Is there a childhood song you still remember? Sing it.", "fr": "Y a-t-il une chanson d'enfance dont tu te souviens encore ? Chante-la.", "it": "C'è una canzone dell'infanzia che ricordi ancora? Cantala.", "es": "¿Hay alguna canción de tu infancia que todavía recuerdes? Cántala.", "pt": "Há alguma canção da infância de que ainda te lembres? Canta-a.", "de": "Gibt es ein Kinderlied, an das du dich noch erinnerst? Sing es.", "hu": "Emlékszel még valamelyik gyerekkori dalra? Énekeld el."}, {"ro": "Ce te fascinează la planeta Pământ?", "en": "What fascinates you about planet Earth?", "fr": "Qu'est-ce qui te fascine à propos de la planète Terre ?", "it": "Cosa ti affascina del pianeta Terra?", "es": "¿Qué te fascina del planeta Tierra?", "pt": "O que te fascina no planeta Terra?", "de": "Was fasziniert dich am Planeten Erde?", "hu": "Mi nyűgöz le a Föld nevű bolygóban?"}, {"ro": "Spune trei lucruri care te-au făcut foarte fericit(ă) luna asta.", "en": "Share three things that made you very happy this month.", "fr": "Partage trois choses qui t'ont rendu(e) très heureux(se) ce mois-ci.", "it": "Racconta tre cose che ti hanno reso molto felice questo mese.", "es": "Comparte tres cosas que te hicieron muy feliz este mes.", "pt": "Partilha três coisas que te fizeram muito feliz este mês.", "de": "Nenne drei Dinge, die dich in diesem Monat sehr glücklich gemacht haben.", "hu": "Mondj három dolgot, ami nagyon boldoggá tett ebben a hónapban."}, {"ro": "Dacă ai putea călători înapoi în timp la vârsta de 10 ani – ce sfat i-ai da eului tău mai tânăr?", "en": "If you could travel back in time to the age of 10 – what advice would you give your younger self?", "fr": "Si tu pouvais remonter le temps jusqu'à tes 10 ans – quel conseil donnerais-tu à ton toi plus jeune ?", "it": "Se potessi tornare indietro nel tempo a quando avevi 10 anni, quale consiglio daresti al te stesso/alla te stessa più giovane?", "es": "Si pudieras viajar en el tiempo hasta los 10 años, ¿qué consejo le darías a tu yo más joven?", "pt": "Se pudesses voltar atrás no tempo até aos 10 anos — que conselho darias ao teu eu mais novo?", "de": "Wenn du in der Zeit zurück ins Alter von 10 Jahren reisen könntest – welchen Rat würdest du deinem jüngeren Ich geben?", "hu": "Ha visszautazhatnál az időben 10 éves korodba – milyen tanácsot adnál a fiatalabb önmagadnak?"}, {"ro": "Cum ai schimba lumea dacă ai avea 5 miliarde de dolari?", "en": "How would you change the world if you had 5 billion dollars?", "fr": "Comment changerais-tu le monde si tu avais 5 milliards de dollars ?", "it": "Come cambieresti il mondo se avessi 5 miliardi di dollari?", "es": "¿Cómo cambiarías el mundo si tuvieras 5.000 millones de dólares?", "pt": "Como mudarias o mundo se tivesses 5 mil milhões de dólares?", "de": "Wie würdest du die Welt verändern, wenn du 5 Milliarden Dollar hättest?", "hu": "Hogyan változtatnád meg a világot, ha 5 milliárd dollárod lenne?"}]}, {"title": {"ro": "Blocul 10 · aleatoriu", "en": "Block 10 · random", "fr": "Bloc 10 · aléatoire", "it": "Blocco 10 · a caso", "es": "Bloque 10 · al azar", "pt": "Bloco 10 · ao acaso", "de": "Block 10 · Zufall", "hu": "10. blokk · véletlen"}, "tag": {"ro": "aleatoriu", "en": "random", "fr": "aléatoire", "it": "a caso", "es": "al azar", "pt": "ao acaso", "de": "Zufall", "hu": "véletlen"}, "q": [{"ro": "Dacă ai putea învăța o abilitate nouă, care ar fi?", "en": "If you could learn a new skill, what would it be?", "fr": "Si tu pouvais apprendre une nouvelle compétence, laquelle serait-ce ?", "it": "Se potessi imparare una nuova abilità, quale sarebbe?", "es": "Si pudieras aprender una nueva habilidad, ¿cuál sería?", "pt": "Se pudesses aprender uma nova competência, qual seria?", "de": "Wenn du eine neue Fähigkeit lernen könntest, welche wäre es?", "hu": "Ha megtanulhatnál egy új képességet, mi lenne az?"}, {"ro": "Povestește un moment din trecut în care te-ai simțit cel mai aproape de moarte.", "en": "Share a moment from your past when you felt closest to death.", "fr": "Raconte un moment de ton passé où tu t'es senti(e) le plus proche de la mort.", "it": "Racconta un momento del tuo passato in cui ti sei sentito/a più vicino/a alla morte.", "es": "Comparte un momento de tu pasado en el que te sentiste más cerca de la muerte.", "pt": "Partilha um momento do teu passado em que te sentiste mais perto da morte.", "de": "Erzähle von einem Moment aus deiner Vergangenheit, in dem du dem Tod am nächsten warst.", "hu": "Meséld el a múltad egy olyan pillanatát, amikor a legközelebb éreztél magad a halálhoz."}, {"ro": "Există un subiect despre care nimeni n-ar trebui să facă glume?", "en": "Is there a topic about which no one should make jokes?", "fr": "Y a-t-il un sujet sur lequel personne ne devrait faire de blagues ?", "it": "C'è un argomento su cui nessuno dovrebbe fare battute?", "es": "¿Hay algún tema sobre el que nadie debería hacer bromas?", "pt": "Há algum assunto sobre o qual ninguém devia fazer piadas?", "de": "Gibt es ein Thema, über das niemand Witze machen sollte?", "hu": "Van olyan téma, amelyről senkinek sem szabadna viccelődnie?"}, {"ro": "Care sunt lucrurile inacceptabile pentru tine într-o prietenie?", "en": "What are your deal breakers in friendships?", "fr": "Quelles sont tes limites infranchissables en amitié ?", "it": "Quali sono per te i motivi di rottura insuperabili in un'amicizia?", "es": "¿Cuáles son tus líneas rojas en las amistades?", "pt": "Quais são, para ti, os motivos de rutura inultrapassáveis numa amizade?", "de": "Was sind für dich K.-o.-Kriterien in Freundschaften?", "hu": "Mik számodra a barátságban a kizáró okok?"}, {"ro": "Moartea cărui membru al familiei ar fi cea mai grea pentru tine?", "en": "Which family member's death would be hardest for you?", "fr": "La mort de quel membre de ta famille serait la plus difficile pour toi ?", "it": "La morte di quale familiare sarebbe la più difficile per te?", "es": "¿La muerte de qué familiar te resultaría más difícil de afrontar?", "pt": "A morte de que familiar seria mais difícil para ti?", "de": "Der Tod welches Familienmitglieds wäre für dich am schwersten?", "hu": "Melyik családtagod halála esne neked a legnehezebben?"}, {"ro": "Dacă ai putea dobândi un talent nou peste noapte, care ar fi?", "en": "If you could gain a new talent overnight, what would it be?", "fr": "Si tu pouvais acquérir un nouveau talent du jour au lendemain, lequel serait-ce ?", "it": "Se potessi ottenere un nuovo talento dall'oggi al domani, quale sarebbe?", "es": "Si pudieras conseguir un nuevo talento de la noche a la mañana, ¿cuál sería?", "pt": "Se pudesses ganhar um novo talento de um dia para o outro, qual seria?", "de": "Wenn du über Nacht ein neues Talent bekommen könntest, welches wäre es?", "hu": "Ha egyik napról a másikra új tehetségre tehetnél szert, mi lenne az?"}, {"ro": "Care e cea mai importantă masă a zilei pentru tine?", "en": "What is the most important meal of the day for you?", "fr": "Quel est le repas le plus important de la journée pour toi ?", "it": "Qual è il pasto più importante della giornata per te?", "es": "¿Cuál es para ti la comida más importante del día?", "pt": "Qual é, para ti, a refeição mais importante do dia?", "de": "Welche Mahlzeit ist für dich die wichtigste des Tages?", "hu": "Számodra melyik a nap legfontosabb étkezése?"}, {"ro": "Ce înseamnă credința pentru tine?", "en": "What does belief or faith mean to you?", "fr": "Que signifie la croyance ou la foi pour toi ?", "it": "Cosa significano per te la fede e il credere?", "es": "¿Qué significan para ti las creencias o la fe?", "pt": "O que significam para ti a crença ou a fé?", "de": "Was bedeuten Glaube und Überzeugung für dich?", "hu": "Mit jelent számodra a hit?"}, {"ro": "Povestește o experiență dintr-o perioadă în care nu aveai deloc bani (sau foarte puțini) – ce ai făcut ca să supraviețuiești?", "en": "Share an experience from a time you had no money (or very little) – what did you do to survive?", "fr": "Raconte une expérience d'une époque où tu n'avais pas d'argent (ou très peu) – qu'as-tu fait pour survivre ?", "it": "Racconta un'esperienza di un periodo in cui non avevi soldi (o ne avevi pochissimi): cosa hai fatto per sopravvivere?", "es": "Comparte una experiencia de una época en la que no tenías dinero (o muy poco): ¿qué hiciste para sobrevivir?", "pt": "Partilha uma experiência de uma altura em que não tinhas dinheiro (ou tinhas muito pouco) — o que fizeste para sobreviver?", "de": "Erzähle von einer Zeit, in der du kein oder nur sehr wenig Geld hattest – was hast du getan, um zu überleben?", "hu": "Mesélj egy olyan időszakról, amikor nem volt pénzed (vagy nagyon kevés) – mit tettél, hogy túléld?"}, {"ro": "Te temi de moarte?", "en": "Do you fear death?", "fr": "Crains-tu la mort ?", "it": "Hai paura della morte?", "es": "¿Le temes a la muerte?", "pt": "Tens medo da morte?", "de": "Hast du Angst vor dem Tod?", "hu": "Félsz a haláltól?"}]}, {"title": {"ro": "Blocul 11 · întrebări din comunitate", "en": "Block 11 · community questions", "fr": "Bloc 11 · questions de la communauté", "it": "Blocco 11 · domande della comunità", "es": "Bloque 11 · preguntas de la comunidad", "pt": "Bloco 11 · perguntas da comunidade", "de": "Block 11 · Fragen aus der Community", "hu": "11. blokk · közösségi kérdések"}, "tag": {"ro": "comunitate", "en": "community", "fr": "communauté", "it": "comunità", "es": "comunidad", "pt": "comunidade", "de": "Community", "hu": "közösség"}, "q": [{"ro": "Cum crezi că iertarea contribuie la construirea unei comunități mai puternice și mai unite?", "en": "How do you believe forgiveness contributes to building a stronger and more cohesive community?", "fr": "Comment penses-tu que le pardon contribue à bâtir une communauté plus forte et plus soudée ?", "it": "In che modo credi che il perdono contribuisca a costruire una comunità più forte e più coesa?", "es": "¿De qué manera crees que el perdón contribuye a construir una comunidad más fuerte y cohesionada?", "pt": "De que forma achas que o perdão contribui para construir uma comunidade mais forte e mais coesa?", "de": "Wie trägt Vergebung deiner Meinung nach dazu bei, eine stärkere und geschlossenere Gemeinschaft aufzubauen?", "hu": "Szerinted miként járul hozzá a megbocsátás egy erősebb és összetartóbb közösség építéséhez?"}, {"ro": "În opinia ta, ce rol joacă empatia în procesul de a oferi a doua șansă în cadrul unei comunități?", "en": "In your opinion, what role does empathy play in the process of granting second chances within a community?", "fr": "À ton avis, quel rôle joue l'empathie dans le fait d'accorder une seconde chance au sein d'une communauté ?", "it": "Secondo te, quale ruolo ha l'empatia nel processo di concedere una seconda possibilità all'interno di una comunità?", "es": "En tu opinión, ¿qué papel desempeña la empatía en el proceso de conceder segundas oportunidades dentro de una comunidad?", "pt": "Na tua opinião, que papel desempenha a empatia no processo de conceder segundas oportunidades numa comunidade?", "de": "Welche Rolle spielt Empathie deiner Ansicht nach dabei, in einer Gemeinschaft zweite Chancen zu gewähren?", "hu": "Szerinted milyen szerepet játszik az empátia abban, hogy egy közösségben második esélyt adunk?"}, {"ro": "Poți împărtăși o experiență personală în care iertarea a jucat un rol decisiv în rezolvarea unui conflict din comunitate?", "en": "Can you share a personal experience where forgiveness played a pivotal role in resolving a community conflict?", "fr": "Peux-tu partager une expérience personnelle où le pardon a joué un rôle décisif dans la résolution d'un conflit communautaire ?", "it": "Puoi condividere un'esperienza personale in cui il perdono è stato decisivo per risolvere un conflitto nella comunità?", "es": "¿Puedes compartir una experiencia personal en la que el perdón fuera decisivo para resolver un conflicto comunitario?", "pt": "Podes partilhar uma experiência pessoal em que o perdão tenha sido decisivo para resolver um conflito na comunidade?", "de": "Kannst du eine persönliche Erfahrung teilen, bei der Vergebung entscheidend dazu beitrug, einen Konflikt in der Gemeinschaft zu lösen?", "hu": "Meg tudsz osztani egy személyes élményt, amelyben a megbocsátás döntő szerepet játszott egy közösségi konfliktus megoldásában?"}, {"ro": "Cum influențează valorile culturale sau sociale felul în care iertarea este percepută și practicată în comunitatea ta?", "en": "How do cultural or societal values influence the way forgiveness is perceived and practised in your community?", "fr": "Comment les valeurs culturelles ou sociales influencent-elles la façon dont le pardon est perçu et pratiqué dans ta communauté ?", "it": "In che modo i valori culturali o sociali influenzano il modo in cui il perdono viene percepito e praticato nella tua comunità?", "es": "¿Cómo influyen los valores culturales o sociales en la manera en que se percibe y se practica el perdón en tu comunidad?", "pt": "Como é que os valores culturais ou sociais influenciam a maneira como o perdão é percebido e praticado na tua comunidade?", "de": "Wie beeinflussen kulturelle oder gesellschaftliche Werte, wie Vergebung in deiner Gemeinschaft wahrgenommen und gelebt wird?", "hu": "Hogyan befolyásolják a kulturális vagy társadalmi értékek azt, ahogyan a megbocsátást a közösségedben megítélik és gyakorolják?"}, {"ro": "Crezi că există anumite fapte care sunt de neiertat în context comunitar și, dacă da, care sunt acelea?", "en": "Do you think there are certain actions that are unforgivable within a community context, and if so, what are they?", "fr": "Penses-tu qu'il existe certains actes impardonnables dans un contexte communautaire et, si oui, lesquels ?", "it": "Pensi che ci siano azioni imperdonabili in un contesto comunitario e, se sì, quali sono?", "es": "¿Crees que hay acciones imperdonables en un contexto comunitario y, de ser así, cuáles son?", "pt": "Achas que há ações imperdoáveis num contexto comunitário e, se sim, quais são?", "de": "Glaubst du, dass es im Zusammenleben einer Gemeinschaft Handlungen gibt, die unverzeihlich sind, und wenn ja, welche?", "hu": "Szerinted vannak olyan cselekedetek, amelyek egy közösségben megbocsáthatatlanok, és ha igen, melyek azok?"}, {"ro": "În relațiile dintr-o comunitate, cum poți găsi echilibrul între a oferi a doua șansă și a menține responsabilitatea?", "en": "In community relationships, how can one strike a balance between offering second chances and maintaining accountability?", "fr": "Dans les relations au sein d'une communauté, comment trouver l'équilibre entre offrir une seconde chance et maintenir la responsabilité ?", "it": "Nelle relazioni comunitarie, come si può trovare un equilibrio tra il concedere seconde possibilità e il mantenere la responsabilità?", "es": "En las relaciones comunitarias, ¿cómo se puede lograr un equilibrio entre ofrecer segundas oportunidades y mantener la rendición de cuentas?", "pt": "Nas relações comunitárias, como se pode encontrar um equilíbrio entre oferecer segundas oportunidades e manter a responsabilização?", "de": "Wie lässt sich in Gemeinschaftsbeziehungen ein Gleichgewicht finden zwischen dem Gewähren zweiter Chancen und dem Festhalten an Verantwortlichkeit?", "hu": "Hogyan lehet a közösségi kapcsolatokban egyensúlyt találni a második esélyek megadása és a felelősségre vonhatóság fenntartása között?"}, {"ro": "Ce strategii sau inițiative crezi că pot fi implementate pentru a cultiva o cultură a iertării și a reconcilierii într-o comunitate?", "en": "What strategies or initiatives do you think can be implemented to foster a culture of forgiveness and reconciliation in a community?", "fr": "Quelles stratégies ou initiatives penses-tu qu'on pourrait mettre en place pour cultiver une culture du pardon et de la réconciliation dans une communauté ?", "it": "Quali strategie o iniziative pensi possano essere messe in atto per promuovere una cultura del perdono e della riconciliazione in una comunità?", "es": "¿Qué estrategias o iniciativas crees que se pueden poner en marcha para fomentar una cultura del perdón y la reconciliación en una comunidad?", "pt": "Que estratégias ou iniciativas achas que podem ser postas em prática para fomentar uma cultura de perdão e reconciliação numa comunidade?", "de": "Welche Strategien oder Initiativen könnten deiner Meinung nach umgesetzt werden, um in einer Gemeinschaft eine Kultur der Vergebung und Versöhnung zu fördern?", "hu": "Szerinted milyen stratégiákkal vagy kezdeményezésekkel lehet előmozdítani a megbocsátás és a megbékélés kultúráját egy közösségben?"}, {"ro": "Cum se aliniază conceptul de iertare cu principiile justiției restaurative și cum ar putea fi aplicat într-un cadru comunitar?", "en": "How does the concept of forgiveness align with the principles of restorative justice, and how might it be applied in a community setting?", "fr": "Comment le concept de pardon s'aligne-t-il avec les principes de la justice réparatrice, et comment pourrait-il s'appliquer dans un cadre communautaire ?", "it": "In che modo il concetto di perdono si allinea ai principi della giustizia riparativa e come potrebbe essere applicato in un contesto comunitario?", "es": "¿Cómo se alinea el concepto de perdón con los principios de la justicia restaurativa y cómo podría aplicarse en un entorno comunitario?", "pt": "Como se alinha o conceito de perdão com os princípios da justiça restaurativa e como poderia ser aplicado num contexto comunitário?", "de": "Wie lässt sich das Konzept der Vergebung mit den Grundsätzen der restaurativen Gerechtigkeit vereinbaren und wie könnte es in einer Gemeinschaft angewendet werden?", "hu": "Hogyan kapcsolódik a megbocsátás fogalma a helyreállító igazságszolgáltatás elveihez, és hogyan lehetne alkalmazni egy közösségi környezetben?"}, {"ro": "Există situații în care a doua șansă a dus la transformări pozitive în comunitate? Poți da exemple?", "en": "Are there instances where second chances have led to positive transformations within the community? Can you provide examples?", "fr": "Y a-t-il des cas où une seconde chance a mené à des transformations positives dans la communauté ? Peux-tu donner des exemples ?", "it": "Ci sono casi in cui le seconde possibilità hanno portato a trasformazioni positive nella comunità? Puoi fare degli esempi?", "es": "¿Hay casos en los que las segundas oportunidades hayan conducido a transformaciones positivas en la comunidad? ¿Puedes dar ejemplos?", "pt": "Há casos em que as segundas oportunidades levaram a transformações positivas na comunidade? Podes dar exemplos?", "de": "Gibt es Fälle, in denen zweite Chancen zu positiven Veränderungen in der Gemeinschaft geführt haben? Kannst du Beispiele nennen?", "hu": "Vannak olyan esetek, amikor a második esélyek pozitív változást hoztak a közösségben? Tudsz példákat mondani?"}, {"ro": "În vremuri de conflict, cum poate o comunitate să lucreze împreună spre vindecare și iertare, în loc să perpetueze un ciclu de resentimente?", "en": "In times of conflict, how can a community collectively work towards healing and forgiveness, rather than perpetuating a cycle of resentment?", "fr": "En temps de conflit, comment une communauté peut-elle œuvrer ensemble vers la guérison et le pardon, plutôt que de perpétuer un cycle de ressentiment ?", "it": "Nei momenti di conflitto, come può una comunità lavorare insieme verso la guarigione e il perdono, anziché perpetuare un ciclo di risentimento?", "es": "En tiempos de conflicto, ¿cómo puede una comunidad trabajar colectivamente hacia la sanación y el perdón, en lugar de perpetuar un ciclo de resentimiento?", "pt": "Em tempos de conflito, como pode uma comunidade trabalhar coletivamente para a cura e o perdão, em vez de perpetuar um ciclo de ressentimento?", "de": "Wie kann eine Gemeinschaft in Zeiten des Konflikts gemeinsam auf Heilung und Vergebung hinarbeiten, statt einen Kreislauf des Grolls fortzusetzen?", "hu": "Konfliktus idején hogyan dolgozhat egy közösség közösen a gyógyulásért és a megbocsátásért ahelyett, hogy fenntartaná a neheztelés körforgását?"}]}, {"title": {"ro": "Blocul 12 · comunitate – extra profund", "en": "Block 12 · community questions – extra deep", "fr": "Bloc 12 · communauté – extra profond", "it": "Blocco 12 · comunità – extra profondo", "es": "Bloque 12 · comunidad – extra profundo", "pt": "Bloco 12 · comunidade – extra profundo", "de": "Block 12 · Community – extra tiefgründig", "hu": "12. blokk · közösség – extra mély"}, "tag": {"ro": "comunitate · profund", "en": "community · deep", "fr": "communauté · profond", "it": "comunità · profondo", "es": "comunidad · profundo", "pt": "comunidade · profundo", "de": "Community · tiefgründig", "hu": "közösség · mély"}, "q": [{"ro": "Poți descrie un moment de cotitură anume din viața ta care ți-a pus la încercare convingerile și ți-a schimbat fundamental perspectiva asupra lumii?", "en": "Can you describe a specific turning point in your life that challenged your preconceived notions and fundamentally altered your perspective on the world?", "fr": "Peux-tu décrire un tournant précis de ta vie qui a remis en cause tes idées reçues et a fondamentalement changé ta vision du monde ?", "it": "Puoi descrivere una specifica svolta nella tua vita che ha messo in discussione le tue idee preconcette e ha cambiato radicalmente la tua visione del mondo?", "es": "¿Puedes describir un punto de inflexión concreto de tu vida que desafió tus ideas preconcebidas y alteró de forma fundamental tu perspectiva del mundo?", "pt": "Podes descrever um ponto de viragem específico da tua vida que desafiou as tuas ideias preconcebidas e alterou fundamentalmente a tua perspetiva do mundo?", "de": "Kannst du einen bestimmten Wendepunkt in deinem Leben beschreiben, der deine vorgefassten Meinungen infrage stellte und deine Sicht auf die Welt grundlegend veränderte?", "hu": "Le tudsz írni egy konkrét fordulópontot az életedben, amely megkérdőjelezte az előfeltevéseidet, és gyökeresen megváltoztatta a világról alkotott nézeteidet?"}, {"ro": "Cum a influențat un moment de cotitură important din viața ta scopurile și aspirațiile pe care ți le-ai stabilit și ce drumuri noi ți-a deschis?", "en": "How did a significant turning point in your life influence the goals and aspirations you set for yourself, and what new paths did it open up?", "fr": "Comment un tournant important de ta vie a-t-il influencé les objectifs et aspirations que tu t'es fixés, et quelles nouvelles voies a-t-il ouvertes ?", "it": "In che modo una svolta importante della tua vita ha influenzato gli obiettivi e le aspirazioni che ti sei dato/a, e quali nuove strade ti ha aperto?", "es": "¿Cómo influyó un punto de inflexión importante de tu vida en los objetivos y las aspiraciones que te marcaste, y qué nuevos caminos te abrió?", "pt": "Como é que um ponto de viragem importante da tua vida influenciou os objetivos e as aspirações que definiste para ti e que novos caminhos te abriu?", "de": "Wie hat ein bedeutender Wendepunkt in deinem Leben die Ziele und Wünsche beeinflusst, die du dir gesetzt hast, und welche neuen Wege hat er dir eröffnet?", "hu": "Hogyan hatott egy jelentős életbeli fordulópont azokra a célokra és törekvésekre, amelyeket magad elé tűztél, és milyen új utakat nyitott meg?"}, {"ro": "Reflectând la un moment de cotitură, ce emoții sau conflicte interioare ai trăit și cum le-ai gestionat ca să mergi mai departe?", "en": "Reflecting on a turning point, what emotions or internal conflicts did you experience, and how did you navigate them to move forward?", "fr": "En réfléchissant à un tournant, quelles émotions ou conflits intérieurs as-tu vécus, et comment les as-tu surmontés pour avancer ?", "it": "Ripensando a una svolta, quali emozioni o conflitti interiori hai vissuto e come li hai affrontati per andare avanti?", "es": "Al reflexionar sobre un punto de inflexión, ¿qué emociones o conflictos internos experimentaste y cómo los gestionaste para seguir adelante?", "pt": "Ao refletires sobre um ponto de viragem, que emoções ou conflitos internos viveste e como os geriste para seguir em frente?", "de": "Welche Gefühle oder inneren Konflikte hast du im Rückblick auf einen Wendepunkt erlebt und wie bist du damit umgegangen, um weiterzukommen?", "hu": "Egy fordulópontra visszatekintve milyen érzelmeket vagy belső konfliktusokat éltél át, és hogyan kezelted őket, hogy előre tudj lépni?"}, {"ro": "A dus momentul de cotitură la o redescoperire a valorilor tale și, dacă da, cum ți-a remodelat prioritățile și deciziile?", "en": "Did the turning point lead to a rediscovery of your values, and if so, how did it reshape your priorities and decision-making?", "fr": "Le tournant a-t-il mené à une redécouverte de tes valeurs et, si oui, comment a-t-il remodelé tes priorités et tes décisions ?", "it": "La svolta ti ha portato a riscoprire i tuoi valori e, se sì, come ha rimodellato le tue priorità e il tuo modo di decidere?", "es": "¿El punto de inflexión te llevó a redescubrir tus valores y, de ser así, cómo transformó tus prioridades y tu forma de tomar decisiones?", "pt": "O ponto de viragem levou-te a redescobrir os teus valores e, se sim, como remodelou as tuas prioridades e a tua forma de decidir?", "de": "Hat dich der Wendepunkt dazu gebracht, deine Werte neu zu entdecken, und wenn ja, wie hat er deine Prioritäten und deine Entscheidungsfindung neu geprägt?", "hu": "Vezetett a fordulópont az értékeid újrafelfedezéséhez, és ha igen, hogyan alakította át a prioritásaidat és a döntéshozatalodat?"}, {"ro": "În urma unui moment crucial, cum s-au schimbat relațiile tale cu ceilalți și ți-a afectat sentimentul de apartenență la cercurile tale sociale?", "en": "In the aftermath of a pivotal moment, how did your relationships with others change, and did it affect your sense of belonging within your social circles?", "fr": "Après un moment décisif, comment tes relations avec les autres ont-elles changé, et cela a-t-il affecté ton sentiment d'appartenance à tes cercles sociaux ?", "it": "All'indomani di un momento cruciale, come sono cambiate le tue relazioni con gli altri e ha influito sul tuo senso di appartenenza ai tuoi ambienti sociali?", "es": "Tras un momento decisivo, ¿cómo cambiaron tus relaciones con los demás y afectó a tu sentido de pertenencia dentro de tus círculos sociales?", "pt": "Depois de um momento decisivo, como mudaram as tuas relações com os outros e isso afetou o teu sentimento de pertença nos teus círculos sociais?", "de": "Wie haben sich nach einem entscheidenden Moment deine Beziehungen zu anderen verändert und hat es dein Zugehörigkeitsgefühl in deinem sozialen Umfeld beeinflusst?", "hu": "Egy sorsdöntő pillanat után hogyan változtak meg a kapcsolataid másokkal, és befolyásolta-e a társas közegedhez való tartozás érzését?"}, {"ro": "Au existat factori externi sau persoane care au jucat un rol crucial în rezultatul acelui moment de cotitură și cum te-a influențat prezența lor?", "en": "Were there external factors or individuals who played a crucial role in shaping the outcome of the turning point, and how did their influence impact your journey?", "fr": "Y a-t-il eu des facteurs externes ou des personnes ayant joué un rôle crucial dans l'issue de ce tournant, et comment leur influence a-t-elle marqué ton parcours ?", "it": "Ci sono stati fattori esterni o persone che hanno avuto un ruolo decisivo nell'esito della svolta e in che modo la loro influenza ha inciso sul tuo percorso?", "es": "¿Hubo factores externos o personas que desempeñaron un papel crucial en el desenlace del punto de inflexión y cómo influyó su presencia en tu camino?", "pt": "Houve fatores externos ou pessoas que tiveram um papel crucial no desfecho do ponto de viragem e como é que a sua influência marcou o teu percurso?", "de": "Gab es äußere Faktoren oder Menschen, die für den Ausgang des Wendepunkts eine entscheidende Rolle spielten, und wie hat ihr Einfluss deinen Weg geprägt?", "hu": "Voltak külső tényezők vagy emberek, akik döntő szerepet játszottak a fordulópont kimenetelében, és hogyan hatott a befolyásuk az utadra?"}, {"ro": "Cum a influențat momentul de cotitură felul în care te percepi pe tine însuți/însăți și a contribuit la creșterea personală sau la o redefinire a identității tale?", "en": "How did the turning point impact your self-perception, and did it contribute to personal growth or a redefinition of your identity?", "fr": "Comment le tournant a-t-il influencé la perception que tu as de toi-même, et a-t-il contribué à ta croissance personnelle ou à une redéfinition de ton identité ?", "it": "In che modo la svolta ha influito sulla percezione che hai di te e ha contribuito alla tua crescita personale o a una ridefinizione della tua identità?", "es": "¿Cómo afectó el punto de inflexión a la percepción que tienes de ti mismo/a y contribuyó a tu crecimiento personal o a una redefinición de tu identidad?", "pt": "Como é que o ponto de viragem afetou a perceção que tens de ti e contribuiu para o teu crescimento pessoal ou para uma redefinição da tua identidade?", "de": "Wie hat der Wendepunkt deine Selbstwahrnehmung beeinflusst und trug er zu persönlichem Wachstum oder zu einer Neudefinition deiner Identität bei?", "hu": "Hogyan hatott a fordulópont az önképedre, és hozzájárult-e a személyes fejlődésedhez vagy az identitásod újraértelmezéséhez?"}, {"ro": "Ce moment ți-a arătat cât de mult te poți schimba și cum ai dus mai departe acea lecție?", "en": "What moment showed you how much you can change, and how did you carry that lesson forward?", "fr": "Quel moment t'a montré à quel point tu peux changer, et comment as-tu porté cette leçon plus loin ?", "it": "Quale momento ti ha mostrato quanto puoi cambiare e come ti sei portato/a dietro quella lezione?", "es": "¿Qué momento te mostró cuánto puedes cambiar y cómo llevaste esa lección contigo?", "pt": "Que momento te mostrou o quanto podes mudar e como levaste essa lição contigo?", "de": "Welcher Moment hat dir gezeigt, wie sehr du dich verändern kannst, und wie hast du diese Lektion mitgenommen?", "hu": "Melyik pillanat mutatta meg, mennyire meg tudsz változni, és hogyan vitted tovább ezt a tanulságot?"}, {"ro": "Cum integrezi lecțiile învățate dintr-un moment de cotitură în viața de zi cu zi și ce practici te ajută să-ți menții un sens și o direcție?", "en": "How do you integrate the lessons learned from a turning point into your daily life, and what practices help you maintain a sense of purpose and direction?", "fr": "Comment intègres-tu les leçons tirées d'un tournant dans ta vie quotidienne, et quelles pratiques t'aident à garder un sens et une direction ?", "it": "Come integri nella vita quotidiana gli insegnamenti di una svolta e quali pratiche ti aiutano a mantenere un senso di scopo e di direzione?", "es": "¿Cómo integras en tu vida diaria las lecciones aprendidas de un punto de inflexión y qué prácticas te ayudan a mantener un sentido de propósito y dirección?", "pt": "Como integras no dia a dia as lições aprendidas com um ponto de viragem e que práticas te ajudam a manter um sentido de propósito e de direção?", "de": "Wie integrierst du die Lehren aus einem Wendepunkt in deinen Alltag und welche Gewohnheiten helfen dir, Sinn und Richtung zu bewahren?", "hu": "Hogyan építed be a mindennapjaidba egy fordulópont tanulságait, és milyen gyakorlatok segítenek megőrizni a célérzetet és az irányt?"}, {"ro": "Privind în urmă, vezi momentul de cotitură ca pe un singur eveniment transformator sau ca pe o serie de momente interconectate care, împreună, ți-au modelat drumul în viață?", "en": "Looking back, do you see the turning point as a single, transformative event, or as part of a series of interconnected moments that collectively shaped your life journey?", "fr": "Avec le recul, vois-tu le tournant comme un seul événement transformateur, ou comme une série de moments interconnectés qui, ensemble, ont façonné ton parcours de vie ?", "it": "Guardando indietro, vedi la svolta come un singolo evento trasformativo o come parte di una serie di momenti collegati che insieme hanno plasmato il tuo percorso di vita?", "es": "Mirando atrás, ¿ves el punto de inflexión como un único acontecimiento transformador o como parte de una serie de momentos interconectados que juntos dieron forma al camino de tu vida?", "pt": "Olhando para trás, vês o ponto de viragem como um único acontecimento transformador ou como parte de uma série de momentos interligados que, em conjunto, moldaram o percurso da tua vida?", "de": "Siehst du den Wendepunkt rückblickend als ein einzelnes, verwandelndes Ereignis oder als Teil einer Reihe miteinander verbundener Momente, die zusammen deinen Lebensweg geprägt haben?", "hu": "Visszatekintve egyetlen átalakító eseménynek látod a fordulópontot, vagy egymással összefüggő pillanatok sorának, amelyek együtt formálták az életutadat?"}]}, {"title": {"ro": "Blocul 13 · comunitate – iubire", "en": "Block 13 · community questions – love", "fr": "Bloc 13 · communauté – amour", "it": "Blocco 13 · comunità – amore", "es": "Bloque 13 · comunidad – amor", "pt": "Bloco 13 · comunidade – amor", "de": "Block 13 · Community – Liebe", "hu": "13. blokk · közösség – szerelem"}, "tag": {"ro": "comunitate · iubire", "en": "community · love", "fr": "communauté · amour", "it": "comunità · amore", "es": "comunidad · amor", "pt": "comunidade · amor", "de": "Community · Liebe", "hu": "közösség · szerelem"}, "q": [{"ro": "Poți împărtăși o experiență semnificativă dintr-o relație din trecut care ți-a influențat profund dezvoltarea personală și înțelegerea de sine?", "en": "Can you share a meaningful experience from a past relationship that significantly impacted your personal growth and understanding of yourself?", "fr": "Peux-tu partager une expérience marquante d'une relation passée qui a profondément influencé ta croissance personnelle et la compréhension de toi-même ?", "it": "Puoi condividere un'esperienza significativa di una relazione passata che ha inciso molto sulla tua crescita personale e sulla comprensione di te stesso/a?", "es": "¿Puedes compartir una experiencia significativa de una relación pasada que influyera notablemente en tu crecimiento personal y en la comprensión de ti mismo/a?", "pt": "Podes partilhar uma experiência significativa de uma relação passada que tenha marcado muito o teu crescimento pessoal e a compreensão de ti próprio/a?", "de": "Kannst du eine bedeutsame Erfahrung aus einer früheren Beziehung teilen, die dein persönliches Wachstum und dein Selbstverständnis maßgeblich beeinflusst hat?", "hu": "Meg tudsz osztani egy jelentős élményt egy korábbi kapcsolatodból, amely nagy hatással volt a személyes fejlődésedre és az önmagadról alkotott képedre?"}, {"ro": "Cum navighezi echilibrul dintre a-ți păstra individualitatea și a construi o legătură profundă atunci când ești implicat(ă) romantic cu cineva?", "en": "How do you navigate the balance between maintaining individuality and building a deep connection when involved with someone romantically?", "fr": "Comment gères-tu l'équilibre entre préserver ton individualité et bâtir un lien profond lorsque tu es engagé(e) romantiquement avec quelqu'un ?", "it": "Come trovi l'equilibrio tra il mantenere la tua individualità e il costruire un legame profondo quando sei coinvolto/a sentimentalmente con qualcuno?", "es": "¿Cómo equilibras mantener tu individualidad y construir una conexión profunda cuando estás con alguien en el plano sentimental?", "pt": "Como encontras o equilíbrio entre manter a tua individualidade e construir uma ligação profunda quando estás envolvido/a afetivamente com alguém?", "de": "Wie findest du in einer romantischen Beziehung das Gleichgewicht zwischen deiner Individualität und dem Aufbau einer tiefen Verbindung?", "hu": "Hogyan találsz egyensúlyt az egyéniséged megőrzése és a mély kapcsolat kiépítése között, ha érzelmileg kötődsz valakihez?"}, {"ro": "În momentele de conflict dintr-o relație, cum abordezi rezolvarea și cum te asiguri că ambii parteneri se simt ascultați și înțeleși?", "en": "In times of conflict within a relationship, how do you approach resolution and ensure that both parties feel heard and understood?", "fr": "En cas de conflit dans une relation, comment abordes-tu la résolution et t'assures-tu que les deux personnes se sentent écoutées et comprises ?", "it": "Nei momenti di conflitto in una relazione, come affronti la risoluzione e ti assicuri che entrambe le parti si sentano ascoltate e comprese?", "es": "En los momentos de conflicto dentro de una relación, ¿cómo abordas la resolución y te aseguras de que ambas partes se sientan escuchadas y comprendidas?", "pt": "Em momentos de conflito numa relação, como abordas a resolução e garantes que ambas as partes se sentem ouvidas e compreendidas?", "de": "Wie gehst du in Konfliktsituationen in einer Beziehung an die Lösung heran und stellst sicher, dass sich beide gehört und verstanden fühlen?", "hu": "Egy kapcsolaton belüli konfliktus idején hogyan közelíted meg a megoldást, és hogyan gondoskodsz arról, hogy mindkét fél úgy érezze, meghallgatják és megértik?"}, {"ro": "Ai trăit vreodată un moment de cotitură într-o relație romantică ce a dus la o schimbare profundă a perspectivelor sau priorităților tale? Dacă da, care a fost?", "en": "Have you ever experienced a turning point in a romantic relationship that led to a profound shift in your perspectives or priorities? If so, what was it?", "fr": "As-tu déjà vécu un tournant dans une relation amoureuse qui a entraîné un changement profond de tes perspectives ou priorités ? Si oui, lequel ?", "it": "Hai mai vissuto una svolta in una relazione sentimentale che ha portato a un profondo cambiamento delle tue prospettive o priorità? Se sì, quale?", "es": "¿Has vivido alguna vez un punto de inflexión en una relación sentimental que provocara un cambio profundo en tus perspectivas o prioridades? Si es así, ¿cuál fue?", "pt": "Já viveste um ponto de viragem numa relação amorosa que tenha levado a uma mudança profunda nas tuas perspetivas ou prioridades? Se sim, qual foi?", "de": "Hast du in einer romantischen Beziehung schon einmal einen Wendepunkt erlebt, der zu einer tiefgreifenden Veränderung deiner Sichtweisen oder Prioritäten führte? Wenn ja, welchen?", "hu": "Átéltél már egy párkapcsolatban olyan fordulópontot, amely mélyreható változást hozott a nézeteidben vagy a prioritásaidban? Ha igen, mi volt az?"}, {"ro": "Cum contribuie relațiile tale romantice din trecut la așteptările și aspirațiile tale actuale în relații?", "en": "How do your past romantic involvements contribute to your present expectations and aspirations in relationships?", "fr": "Comment tes relations amoureuses passées contribuent-elles à tes attentes et aspirations actuelles en matière de relations ?", "it": "In che modo i tuoi coinvolgimenti sentimentali passati contribuiscono alle tue attuali aspettative e aspirazioni nelle relazioni?", "es": "¿Cómo contribuyen tus relaciones sentimentales pasadas a tus expectativas y aspiraciones actuales en las relaciones?", "pt": "Como contribuem os teus envolvimentos amorosos passados para as tuas expectativas e aspirações atuais nas relações?", "de": "Wie tragen deine früheren romantischen Beziehungen zu deinen heutigen Erwartungen und Wünschen an Beziehungen bei?", "hu": "Hogyan járulnak hozzá a korábbi párkapcsolataid a mostani elvárásaidhoz és vágyaidhoz a kapcsolatokban?"}, {"ro": "Poți descrie o situație în care implicarea cu cineva ți-a pus la încercare convingerile sau te-a împins în afara zonei de confort, ducând la o transformare personală?", "en": "Can you describe a situation where being involved with someone challenged your beliefs or pushed you outside your comfort zone, leading to personal transformation?", "fr": "Peux-tu décrire une situation où être lié(e) à quelqu'un a remis en cause tes convictions ou t'a poussé(e) hors de ta zone de confort, menant à une transformation personnelle ?", "it": "Puoi descrivere una situazione in cui stare con qualcuno ha messo in discussione le tue convinzioni o ti ha spinto fuori dalla tua zona di comfort, portando a una trasformazione personale?", "es": "¿Puedes describir una situación en la que estar con alguien puso a prueba tus creencias o te empujó fuera de tu zona de confort, llevándote a una transformación personal?", "pt": "Podes descrever uma situação em que estar com alguém pôs em causa as tuas crenças ou te empurrou para fora da tua zona de conforto, levando a uma transformação pessoal?", "de": "Kannst du eine Situation beschreiben, in der dich das Zusammensein mit jemandem in deinen Überzeugungen herausforderte oder aus deiner Komfortzone drängte und so zu einer persönlichen Verwandlung führte?", "hu": "Le tudsz írni egy olyan helyzetet, amelyben a valakivel való együttlét próbára tette a hiedelmeidet, vagy kimozdított a komfortzónádból, és személyes átalakuláshoz vezetett?"}, {"ro": "Ce rol joacă vulnerabilitatea în relațiile tale și cum navighezi deschiderea emoțională față de cineva?", "en": "What role does vulnerability play in your relationships, and how do you navigate opening up to someone emotionally?", "fr": "Quel rôle joue la vulnérabilité dans tes relations, et comment gères-tu le fait de t'ouvrir émotionnellement à quelqu'un ?", "it": "Che ruolo ha la vulnerabilità nelle tue relazioni e come affronti l'aprirti emotivamente a qualcuno?", "es": "¿Qué papel desempeña la vulnerabilidad en tus relaciones y cómo gestionas abrirte emocionalmente a alguien?", "pt": "Que papel desempenha a vulnerabilidade nas tuas relações e como lidas com o abrir-te emocionalmente a alguém?", "de": "Welche Rolle spielt Verletzlichkeit in deinen Beziehungen und wie gehst du damit um, dich jemandem emotional zu öffnen?", "hu": "Milyen szerepet játszik a sebezhetőség a kapcsolataidban, és hogyan nyílsz meg érzelmileg valaki előtt?"}, {"ro": "Reflectând la experiențele tale, cum ți-au evoluat în timp valorile și prioritățile în relații?", "en": "Reflecting on your experiences, how have your values and priorities in relationships evolved over time?", "fr": "En réfléchissant à tes expériences, comment tes valeurs et priorités dans les relations ont-elles évolué avec le temps ?", "it": "Riflettendo sulle tue esperienze, come si sono evoluti nel tempo i tuoi valori e le tue priorità nelle relazioni?", "es": "Al reflexionar sobre tus experiencias, ¿cómo han evolucionado con el tiempo tus valores y prioridades en las relaciones?", "pt": "Ao refletires sobre as tuas experiências, como evoluíram ao longo do tempo os teus valores e prioridades nas relações?", "de": "Wenn du auf deine Erfahrungen zurückblickst: Wie haben sich deine Werte und Prioritäten in Beziehungen im Lauf der Zeit entwickelt?", "hu": "A tapasztalataidra visszatekintve hogyan fejlődtek az idők során az értékeid és a prioritásaid a kapcsolatokban?"}, {"ro": "Cum îți menții un sentiment de autonomie și independență atunci când ești implicat(ă) cu cineva și cât de important e pentru tine acest echilibru?", "en": "How do you maintain a sense of autonomy and independence while being involved with someone, and how important is this balance to you?", "fr": "Comment conserves-tu un sentiment d'autonomie et d'indépendance tout en étant engagé(e) avec quelqu'un, et quelle importance accordes-tu à cet équilibre ?", "it": "Come mantieni un senso di autonomia e indipendenza mentre sei coinvolto/a con qualcuno e quanto è importante per te questo equilibrio?", "es": "¿Cómo mantienes un sentido de autonomía e independencia mientras estás con alguien y qué importancia tiene este equilibrio para ti?", "pt": "Como manténs um sentido de autonomia e independência enquanto estás com alguém e quão importante é para ti esse equilíbrio?", "de": "Wie bewahrst du dir ein Gefühl von Autonomie und Unabhängigkeit, während du mit jemandem zusammen bist, und wie wichtig ist dir dieses Gleichgewicht?", "hu": "Hogyan őrzöd meg az önállóság és a függetlenség érzését, miközben kötődsz valakihez, és mennyire fontos számodra ez az egyensúly?"}, {"ro": "Ai găsit vreodată inspirație sau creștere personală sprijinind pe altcineva în drumul său și cum ți-a influențat asta propria dezvoltare?", "en": "Have you ever found inspiration or personal growth through supporting someone else on their journey, and how has this impacted your own development?", "fr": "As-tu déjà trouvé de l'inspiration ou une croissance personnelle en soutenant quelqu'un d'autre dans son cheminement, et comment cela a-t-il influencé ton propre développement ?", "it": "Hai mai trovato ispirazione o crescita personale sostenendo qualcun altro nel suo percorso e in che modo questo ha influito sul tuo sviluppo?", "es": "¿Has encontrado alguna vez inspiración o crecimiento personal apoyando a otra persona en su camino y cómo ha influido eso en tu propio desarrollo?", "pt": "Já encontraste inspiração ou crescimento pessoal ao apoiares outra pessoa no seu percurso e como isso influenciou o teu próprio desenvolvimento?", "de": "Hast du schon einmal Inspiration oder persönliches Wachstum darin gefunden, jemand anderen auf seinem Weg zu unterstützen, und wie hat das deine eigene Entwicklung beeinflusst?", "hu": "Találtál már valaha inspirációt vagy személyes fejlődést abban, hogy valakit támogattál az útján, és ez hogyan hatott a saját fejlődésedre?"}]}, {"title": {"ro": "Blocul 14 · comunitate – profund", "en": "Block 14 · community questions – deep", "fr": "Bloc 14 · communauté – profond", "it": "Blocco 14 · comunità – profondo", "es": "Bloque 14 · comunidad – profundo", "pt": "Bloco 14 · comunidade – profundo", "de": "Block 14 · Community – tiefgründig", "hu": "14. blokk · közösség – mély"}, "tag": {"ro": "comunitate · identitate", "en": "community · identity", "fr": "communauté · identité", "it": "comunità · identità", "es": "comunidad · identidad", "pt": "comunidade · identidade", "de": "Community · Identität", "hu": "közösség · identitás"}, "q": [{"ro": "Dincolo de nume, profesie și roluri, ce aspecte ale identității tale simți că te definesc cu adevărat ca individ?", "en": "Beyond your name, profession and roles, what aspects of your identity do you feel truly define who you are as an individual?", "fr": "Au-delà de ton nom, de ta profession et de tes rôles, quels aspects de ton identité sens-tu qui te définissent vraiment en tant qu'individu ?", "it": "Al di là del tuo nome, della tua professione e dei tuoi ruoli, quali aspetti della tua identità senti che definiscono davvero chi sei come individuo?", "es": "Más allá de tu nombre, tu profesión y tus roles, ¿qué aspectos de tu identidad sientes que definen realmente quién eres como individuo?", "pt": "Para além do teu nome, da tua profissão e dos teus papéis, que aspetos da tua identidade sentes que definem verdadeiramente quem és como indivíduo?", "de": "Welche Aspekte deiner Identität definieren dich über deinen Namen, deinen Beruf und deine Rollen hinaus wirklich als Individuum?", "hu": "A neveden, a foglalkozásodon és a szerepeiden túl az identitásod mely vonásai határoznak meg igazán egyéniségként?"}, {"ro": "Cum ți-a modelat trecutul înțelegerea actuală de sine și ce experiențe-cheie au contribuit la sentimentul tău de identitate?", "en": "How has your past shaped your present understanding of yourself, and what key experiences have contributed to your sense of identity?", "fr": "Comment ton passé a-t-il façonné la compréhension actuelle de toi-même, et quelles expériences clés ont contribué à ton sentiment d'identité ?", "it": "In che modo il tuo passato ha plasmato la comprensione che hai di te oggi e quali esperienze chiave hanno contribuito al tuo senso di identità?", "es": "¿Cómo ha moldeado tu pasado la comprensión que tienes de ti hoy y qué experiencias clave han contribuido a tu sentido de identidad?", "pt": "Como é que o teu passado moldou a compreensão que tens de ti hoje e que experiências-chave contribuíram para o teu sentido de identidade?", "de": "Wie hat deine Vergangenheit dein heutiges Selbstverständnis geprägt und welche Schlüsselerfahrungen haben zu deinem Identitätsgefühl beigetragen?", "hu": "Hogyan alakította a múltad az önmagadról alkotott mostani képedet, és mely meghatározó élmények járultak hozzá az identitástudatodhoz?"}, {"ro": "În momentele de introspecție, ce valori sau principii descoperi că sunt în miezul identității tale, ghidându-ți deciziile și acțiunile?", "en": "In moments of self-reflection, what values or principles do you find are at the core of your identity, guiding your decisions and actions?", "fr": "Dans tes moments d'introspection, quelles valeurs ou principes trouves-tu au cœur de ton identité, guidant tes décisions et tes actions ?", "it": "Nei momenti di riflessione su di te, quali valori o principi trovi al centro della tua identità, a guidare le tue decisioni e le tue azioni?", "es": "En los momentos de autorreflexión, ¿qué valores o principios consideras que están en el núcleo de tu identidad y guían tus decisiones y acciones?", "pt": "Em momentos de autorreflexão, que valores ou princípios consideras estarem no cerne da tua identidade, a guiar as tuas decisões e ações?", "de": "Welche Werte oder Prinzipien stehen in Momenten der Selbstreflexion im Kern deiner Identität und leiten deine Entscheidungen und Handlungen?", "hu": "Az önreflexió pillanataiban milyen értékeket vagy elveket találsz az identitásod magjában, amelyek a döntéseidet és a tetteidet vezérlik?"}, {"ro": "Cum navighezi echilibrul dintre așteptările externe puse asupra ta și sinele tău autentic, mai ales în diverse contexte sociale și profesionale?", "en": "How do you navigate the balance between the external expectations placed on you and your authentic self, particularly in various social and professional contexts?", "fr": "Comment gères-tu l'équilibre entre les attentes externes placées sur toi et ton vrai moi, notamment dans divers contextes sociaux et professionnels ?", "it": "Come trovi l'equilibrio tra le aspettative esterne che ricadono su di te e il tuo io autentico, in particolare nei vari contesti sociali e professionali?", "es": "¿Cómo equilibras las expectativas externas que recaen sobre ti con tu yo auténtico, en particular en distintos contextos sociales y profesionales?", "pt": "Como encontras o equilíbrio entre as expectativas externas que recaem sobre ti e o teu eu autêntico, em particular nos vários contextos sociais e profissionais?", "de": "Wie findest du das Gleichgewicht zwischen den äußeren Erwartungen, die an dich gestellt werden, und deinem authentischen Selbst, besonders in verschiedenen sozialen und beruflichen Zusammenhängen?", "hu": "Hogyan találsz egyensúlyt a rád nehezedő külső elvárások és a hiteles éned között, különösen a különféle társadalmi és szakmai környezetekben?"}, {"ro": "Poți identifica un moment de cotitură sau o revelație din viața ta care ți-a influențat semnificativ percepția de sine și sentimentul scopului?", "en": "Can you identify a specific turning point or realisation in your life that significantly influenced your self-perception and sense of purpose?", "fr": "Peux-tu identifier un tournant ou une prise de conscience précise de ta vie qui a fortement influencé la perception de toi-même et ton sens du but ?", "it": "Riesci a individuare una svolta o una presa di coscienza specifica nella tua vita che ha influenzato in modo significativo la percezione che hai di te e il tuo senso di scopo?", "es": "¿Puedes identificar un punto de inflexión o una toma de conciencia concretos en tu vida que influyeran de manera significativa en la percepción de ti mismo/a y en tu sentido de propósito?", "pt": "Consegues identificar um ponto de viragem ou uma tomada de consciência específicos na tua vida que tenham influenciado de forma significativa a perceção que tens de ti e o teu sentido de propósito?", "de": "Kannst du einen bestimmten Wendepunkt oder eine Erkenntnis in deinem Leben benennen, die deine Selbstwahrnehmung und dein Gefühl für einen Lebenssinn deutlich beeinflusst hat?", "hu": "Meg tudsz nevezni egy konkrét fordulópontot vagy felismerést az életedben, amely jelentősen befolyásolta az önképedet és a céltudatodat?"}, {"ro": "În ce măsură contribuie relațiile tale cu ceilalți la sentimentul tău de sine și cum îți menții autenticitatea în aceste legături?", "en": "To what extent do your relationships with others contribute to your sense of self, and how do you maintain authenticity in these connections?", "fr": "Dans quelle mesure tes relations avec les autres contribuent-elles à ton sentiment de toi-même, et comment préserves-tu ton authenticité dans ces liens ?", "it": "In che misura le tue relazioni con gli altri contribuiscono al tuo senso di te e come mantieni l'autenticità in questi legami?", "es": "¿En qué medida contribuyen tus relaciones con los demás a tu sentido de ti mismo/a y cómo mantienes la autenticidad en esos vínculos?", "pt": "Em que medida as tuas relações com os outros contribuem para o teu sentido de ti e como manténs a autenticidade nessas ligações?", "de": "Inwieweit tragen deine Beziehungen zu anderen zu deinem Selbstbild bei und wie bewahrst du in diesen Verbindungen deine Authentizität?", "hu": "Mennyiben járulnak hozzá a másokkal való kapcsolataid az énképedhez, és hogyan őrzöd meg a hitelességedet ezekben a kapcsolatokban?"}, {"ro": "Cum împaci natura mereu schimbătoare a identității cu dorința de stabilitate și de continuitate în viața ta?", "en": "How do you reconcile the evolving nature of identity with the desire for stability and a sense of continuity in your life?", "fr": "Comment concilies-tu la nature évolutive de l'identité avec le désir de stabilité et de continuité dans ta vie ?", "it": "Come concili la natura mutevole dell'identità con il desiderio di stabilità e di continuità nella tua vita?", "es": "¿Cómo concilias la naturaleza cambiante de la identidad con el deseo de estabilidad y de continuidad en tu vida?", "pt": "Como concilias a natureza mutável da identidade com o desejo de estabilidade e de continuidade na tua vida?", "de": "Wie bringst du den wandelbaren Charakter der Identität mit dem Wunsch nach Stabilität und Kontinuität in deinem Leben in Einklang?", "hu": "Hogyan békíted össze az identitás változó természetét a stabilitás és a folytonosság iránti vággyal az életedben?"}, {"ro": "În momentele de provocare sau adversitate, cum îți influențează înțelegerea propriei identități reziliența și capacitatea de a depăși obstacolele?", "en": "In moments of challenge or adversity, how does your understanding of who you are influence your resilience and ability to overcome obstacles?", "fr": "Dans les moments de défi ou d'adversité, comment ta compréhension de qui tu es influence-t-elle ta résilience et ta capacité à surmonter les obstacles ?", "it": "Nei momenti di sfida o di avversità, in che modo la comprensione di chi sei influenza la tua resilienza e la tua capacità di superare gli ostacoli?", "es": "En los momentos de desafío o adversidad, ¿cómo influye la comprensión de quién eres en tu resiliencia y tu capacidad para superar obstáculos?", "pt": "Em momentos de desafio ou adversidade, como influencia a compreensão de quem és a tua resiliência e a tua capacidade de superar obstáculos?", "de": "Wie beeinflusst dein Verständnis davon, wer du bist, in Momenten der Herausforderung oder Not deine Widerstandskraft und deine Fähigkeit, Hindernisse zu überwinden?", "hu": "A kihívások vagy a nehézségek idején hogyan befolyásolja az, hogy tudod, ki vagy, a rugalmasságodat és az akadályok leküzdésére való képességedet?"}, {"ro": "Crezi că dezvoltarea personală necesită o reevaluare continuă a identității și, dacă da, cum abordezi acest proces în viața ta?", "en": "Do you believe that personal growth requires a continuous reevaluation of one's identity, and if so, how do you approach this process in your own life?", "fr": "Crois-tu que la croissance personnelle exige une réévaluation continue de son identité et, si oui, comment abordes-tu ce processus dans ta propre vie ?", "it": "Credi che la crescita personale richieda una continua rivalutazione della propria identità e, se sì, come affronti questo processo nella tua vita?", "es": "¿Crees que el crecimiento personal requiere una reevaluación continua de la propia identidad y, de ser así, cómo abordas ese proceso en tu vida?", "pt": "Achas que o crescimento pessoal exige uma reavaliação contínua da identidade e, se sim, como abordas esse processo na tua vida?", "de": "Glaubst du, dass persönliches Wachstum eine ständige Neubewertung der eigenen Identität erfordert, und wenn ja, wie gehst du diesen Prozess in deinem Leben an?", "hu": "Úgy gondolod, hogy a személyes fejlődés megköveteli az identitás folyamatos újraértékelését, és ha igen, hogyan közelíted meg ezt a folyamatot az életedben?"}, {"ro": "Dacă ar fi să te descrii prin metafore sau simboluri, care ar fi acestea și cum surprind ele esența a ceea ce ești?", "en": "If you were to describe yourself using metaphors or symbols, what would they be, and how do they encapsulate the essence of who you are?", "fr": "Si tu devais te décrire par des métaphores ou des symboles, quels seraient-ils, et comment capturent-ils l'essence de qui tu es ?", "it": "Se dovessi descriverti con metafore o simboli, quali sarebbero e in che modo racchiudono l'essenza di chi sei?", "es": "Si tuvieras que describirte con metáforas o símbolos, ¿cuáles serían y cómo recogen la esencia de quién eres?", "pt": "Se tivesses de te descrever com metáforas ou símbolos, quais seriam e como resumem a essência de quem és?", "de": "Wenn du dich mit Metaphern oder Symbolen beschreiben solltest, welche wären es und wie fassen sie das Wesen dessen zusammen, wer du bist?", "hu": "Ha metaforákkal vagy szimbólumokkal kellene jellemezned magad, melyek lennének azok, és hogyan foglalják össze azt, hogy ki vagy?"}]}, {"title": {"ro": "Blocul 15 · comunitate – aleatoriu", "en": "Block 15 · community questions – random", "fr": "Bloc 15 · communauté – aléatoire", "it": "Blocco 15 · comunità – a caso", "es": "Bloque 15 · comunidad – al azar", "pt": "Bloco 15 · comunidade – ao acaso", "de": "Block 15 · Community – Zufall", "hu": "15. blokk · közösség – véletlen"}, "tag": {"ro": "comunitate · aleatoriu", "en": "community · random", "fr": "communauté · aléatoire", "it": "comunità · a caso", "es": "comunidad · al azar", "pt": "comunidade · ao acaso", "de": "Community · Zufall", "hu": "közösség · véletlen"}, "q": [{"ro": "Cum stabilești granițele dintre umor și lipsa de sensibilitate și ai criterii anume pentru a evalua dacă un subiect e interzis glumelor?", "en": "How do you determine the boundaries between humour and insensitivity, and are there specific criteria you use to assess whether a topic is off-limits for jokes?", "fr": "Comment détermines-tu les limites entre l'humour et le manque de sensibilité, et as-tu des critères précis pour juger si un sujet est interdit aux blagues ?", "it": "Come stabilisci il confine tra umorismo e insensibilità e ci sono criteri specifici che usi per valutare se un argomento è off-limits per le battute?", "es": "¿Cómo determinas los límites entre el humor y la insensibilidad y utilizas criterios concretos para valorar si un tema está vetado para las bromas?", "pt": "Como determinas as fronteiras entre o humor e a insensibilidade e usas critérios específicos para avaliar se um assunto está vedado a piadas?", "de": "Wie bestimmst du die Grenze zwischen Humor und Taktlosigkeit und gibt es bestimmte Kriterien, anhand derer du beurteilst, ob ein Thema für Witze tabu ist?", "hu": "Hogyan húzod meg a határt a humor és az érzéketlenség között, és vannak-e konkrét szempontjaid annak megítélésére, hogy egy téma tabu-e a viccek számára?"}, {"ro": "În opinia ta, poate fi umorul un instrument de comentariu social pe teme sensibile sau anumite subiecte ar trebui tratate mereu cu seriozitate și gravitate?", "en": "In your opinion, can humour be a tool for social commentary on sensitive topics, or should certain subjects always be treated with solemnity and seriousness?", "fr": "À ton avis, l'humour peut-il être un outil de commentaire social sur des sujets sensibles, ou certains sujets devraient-ils toujours être traités avec solennité et sérieux ?", "it": "Secondo te, l'umorismo può essere uno strumento di commento sociale su temi delicati o certi argomenti vanno sempre trattati con solennità e serietà?", "es": "En tu opinión, ¿puede el humor ser una herramienta de comentario social sobre temas sensibles o ciertos asuntos deben tratarse siempre con solemnidad y seriedad?", "pt": "Na tua opinião, o humor pode ser uma ferramenta de comentário social sobre temas sensíveis, ou certos assuntos devem ser sempre tratados com solenidade e seriedade?", "de": "Kann Humor deiner Meinung nach ein Mittel der Gesellschaftskritik an heiklen Themen sein, oder sollten bestimmte Themen immer mit Ernst und Feierlichkeit behandelt werden?", "hu": "Szerinted lehet a humor a társadalomkritika eszköze érzékeny témákban, vagy bizonyos témákat mindig ünnepélyesen és komolyan kell kezelni?"}, {"ro": "Ai întâlnit vreodată o situație în care cineva a făcut o glumă pe un subiect pe care îl considerai tabu și cum ai reacționat?", "en": "Have you ever encountered a situation where someone made a joke about a topic you considered taboo, and how did you respond?", "fr": "As-tu déjà rencontré une situation où quelqu'un a fait une blague sur un sujet que tu jugeais tabou, et comment as-tu réagi ?", "it": "Ti è mai capitato che qualcuno facesse una battuta su un argomento che consideri tabù e come hai reagito?", "es": "¿Te has encontrado alguna vez con alguien que bromeara sobre un tema que tú consideras tabú y cómo reaccionaste?", "pt": "Já te deparaste com uma situação em que alguém fez uma piada sobre um assunto que consideras tabu e como reagiste?", "de": "Ist dir schon einmal begegnet, dass jemand einen Witz über ein Thema machte, das du für tabu hältst, und wie hast du reagiert?", "hu": "Előfordult már, hogy valaki olyan témáról viccelt, amelyet te tabunak tartasz, és hogyan reagáltál?"}, {"ro": "Cum influențează contextul cultural percepția ta despre ce subiecte sunt nepotrivite pentru umor și crezi că aceste granițe variază de la o societate la alta?", "en": "How does cultural context influence your perception of what topics are inappropriate for humour, and do you think these boundaries vary across different societies?", "fr": "Comment le contexte culturel influence-t-il ta perception des sujets inappropriés pour l'humour, et penses-tu que ces limites varient d'une société à l'autre ?", "it": "In che modo il contesto culturale influenza la tua percezione di quali argomenti siano inappropriati per l'umorismo e pensi che questi confini cambino da una società all'altra?", "es": "¿Cómo influye el contexto cultural en tu percepción de qué temas son inapropiados para el humor y crees que esos límites varían entre sociedades?", "pt": "Como é que o contexto cultural influencia a tua perceção de quais os assuntos inadequados para o humor e achas que esses limites variam entre sociedades?", "de": "Wie beeinflusst der kulturelle Kontext deine Wahrnehmung, welche Themen für Humor unangemessen sind, und glaubst du, dass diese Grenzen in verschiedenen Gesellschaften unterschiedlich verlaufen?", "hu": "Hogyan befolyásolja a kulturális közeg azt, hogy mely témákat tartod humorra alkalmatlannak, és szerinted ezek a határok társadalmanként eltérnek?"}, {"ro": "Poate fi umorul o modalitate de a face față unei traume personale sau unor experiențe dificile și, dacă da, unde tragi linia între râsul terapeutic și posibilul rău?", "en": "Can humour be a means of coping with personal trauma or difficult experiences, and if so, where do you draw the line between therapeutic laughter and potential harm?", "fr": "L'humour peut-il être un moyen de faire face à un traumatisme personnel ou à des expériences difficiles et, si oui, où traces-tu la ligne entre le rire thérapeutique et le tort possible ?", "it": "L'umorismo può essere un mezzo per affrontare traumi personali o esperienze difficili e, se sì, dove tracci il limite tra risata terapeutica e potenziale danno?", "es": "¿Puede el humor ser una forma de sobrellevar un trauma personal o experiencias difíciles y, de ser así, dónde trazas la línea entre la risa terapéutica y el posible daño?", "pt": "O humor pode ser um meio de lidar com traumas pessoais ou experiências difíceis e, se sim, onde traças a linha entre o riso terapêutico e o dano potencial?", "de": "Kann Humor ein Mittel sein, persönliche Traumata oder schwierige Erfahrungen zu bewältigen, und wenn ja, wo ziehst du die Grenze zwischen heilsamem Lachen und möglichem Schaden?", "hu": "Lehet a humor a személyes traumák vagy nehéz élmények feldolgozásának eszköze, és ha igen, hol húzod meg a határt a terápiás nevetés és a lehetséges ártalom között?"}, {"ro": "Crezi că intenția contează atunci când faci glume pe teme sensibile și cum ar trebui să cântărim impactul cuvintelor asupra unor audiențe diferite?", "en": "Do you believe that intent matters when it comes to making jokes about sensitive topics, and how should one consider the impact of their words on different audiences?", "fr": "Crois-tu que l'intention compte lorsqu'on fait des blagues sur des sujets sensibles, et comment devrait-on considérer l'impact de ses mots sur des publics différents ?", "it": "Credi che l'intenzione conti quando si fanno battute su temi delicati e come si dovrebbe considerare l'impatto delle proprie parole su pubblici diversi?", "es": "¿Crees que la intención importa al hacer bromas sobre temas sensibles y cómo se debería considerar el impacto de las propias palabras en públicos distintos?", "pt": "Achas que a intenção importa quando se fazem piadas sobre temas sensíveis e como se deve ponderar o impacto das próprias palavras em públicos diferentes?", "de": "Glaubst du, dass die Absicht eine Rolle spielt, wenn man Witze über heikle Themen macht, und wie sollte man die Wirkung seiner Worte auf unterschiedliches Publikum bedenken?", "hu": "Szerinted számít a szándék, amikor érzékeny témákról viccelünk, és hogyan kell figyelembe venni a szavaink hatását különböző közönségekre?"}, {"ro": "Au comedianții sau artiștii o responsabilitate de a lua în calcul răul pe care l-ar putea provoca glumele lor sau exprimarea creativă ar trebui să fie nelimitată de sensibilitățile societății?", "en": "Is there a responsibility for comedians or entertainers to consider the potential harm their jokes may cause, or should creative expression be unrestricted by societal sensitivities?", "fr": "Les comédiens ou artistes ont-ils la responsabilité de considérer le tort que leurs blagues pourraient causer, ou l'expression créative devrait-elle être sans limites imposées par les sensibilités sociales ?", "it": "Ci sono responsabilità per i comici o gli artisti nel considerare il possibile danno che le loro battute possono causare, o l'espressione creativa dovrebbe essere libera dalle sensibilità della società?", "es": "¿Tienen los cómicos o artistas la responsabilidad de considerar el posible daño que pueden causar sus bromas, o la expresión creativa debería estar libre de las sensibilidades de la sociedad?", "pt": "Os humoristas ou artistas têm a responsabilidade de considerar o dano potencial que as suas piadas podem causar, ou a expressão criativa deve ficar livre das sensibilidades da sociedade?", "de": "Tragen Komiker oder Künstler die Verantwortung, den möglichen Schaden ihrer Witze zu bedenken, oder sollte künstlerischer Ausdruck frei von gesellschaftlichen Empfindlichkeiten sein?", "hu": "Felelőssége-e a humoristáknak vagy a szórakoztatóknak, hogy mérlegeljék a viccek lehetséges károkozását, vagy az alkotói szabadságot nem korlátozhatják a társadalmi érzékenységek?"}, {"ro": "Cum poate fi folosit umorul în mod constructiv pentru a aborda subiecte dificile și a stârni dialog, în loc să perpetueze stereotipuri sau narațiuni dăunătoare?", "en": "How can humour be used constructively to address challenging subjects and foster dialogue, rather than perpetuating stereotypes or reinforcing harmful narratives?", "fr": "Comment l'humour peut-il être utilisé de manière constructive pour aborder des sujets difficiles et susciter le dialogue, plutôt que de perpétuer des stéréotypes ou des récits nuisibles ?", "it": "Come si può usare l'umorismo in modo costruttivo per affrontare argomenti difficili e favorire il dialogo, anziché perpetuare stereotipi o rafforzare narrazioni dannose?", "es": "¿Cómo puede usarse el humor de forma constructiva para abordar temas difíciles y fomentar el diálogo, en lugar de perpetuar estereotipos o reforzar narrativas dañinas?", "pt": "Como pode o humor ser usado de forma construtiva para abordar temas difíceis e fomentar o diálogo, em vez de perpetuar estereótipos ou reforçar narrativas prejudiciais?", "de": "Wie kann Humor konstruktiv genutzt werden, um schwierige Themen anzusprechen und den Dialog zu fördern, statt Stereotype fortzuschreiben oder schädliche Narrative zu verstärken?", "hu": "Hogyan lehet a humort építő módon használni nehéz témák megközelítésére és a párbeszéd elősegítésére ahelyett, hogy sztereotípiákat tartana fenn vagy káros narratívákat erősítene?"}, {"ro": "Ți-ai schimbat vreodată părerea despre dacă un anumit subiect e potrivit pentru umor și, dacă da, ce a declanșat această schimbare?", "en": "Have you ever changed your perspective on whether a certain topic is suitable for humour, and if so, what prompted this shift in your thinking?", "fr": "As-tu déjà changé d'avis sur le fait qu'un certain sujet soit approprié à l'humour et, si oui, qu'est-ce qui a déclenché ce changement ?", "it": "Hai mai cambiato idea sull'opportunità di fare umorismo su un certo argomento e, se sì, cosa ha provocato questo cambiamento nel tuo modo di pensare?", "es": "¿Has cambiado alguna vez de perspectiva sobre si un tema es adecuado para el humor y, de ser así, qué provocó ese cambio en tu manera de pensar?", "pt": "Já mudaste de perspetiva sobre se um determinado assunto é adequado ao humor e, se sim, o que motivou essa mudança na tua maneira de pensar?", "de": "Hast du deine Sicht darauf, ob ein bestimmtes Thema für Humor geeignet ist, schon einmal geändert, und wenn ja, was hat diesen Wandel in deinem Denken ausgelöst?", "hu": "Megváltozott már a véleményed arról, hogy egy adott téma alkalmas-e humorra, és ha igen, mi váltotta ki ezt a gondolkodásbeli változást?"}, {"ro": "În viziunea ta, ar trebui să existe linii directoare universale sau norme culturale care să definească ce subiecte sunt interzise glumelor pentru toți, sau e o chestiune subiectivă, ce ține de valorile și experiențele fiecăruia?", "en": "In your view, should there be universal guidelines or cultural norms that help define which topics are universally off-limits for jokes, or is it a subjective matter dependent on individual values and experiences?", "fr": "Selon toi, devrait-il exister des lignes directrices universelles ou des normes culturelles définissant quels sujets sont universellement interdits aux blagues, ou est-ce une question subjective dépendant des valeurs et expériences de chacun ?", "it": "Secondo te, dovrebbero esserci linee guida universali o norme culturali che aiutino a definire quali argomenti sono off-limits per le battute in modo universale, o è una questione soggettiva che dipende da valori ed esperienze individuali?", "es": "En tu opinión, ¿debería haber pautas universales o normas culturales que ayuden a definir qué temas están vetados universalmente para las bromas, o es una cuestión subjetiva que depende de los valores y experiencias individuales?", "pt": "Na tua perspetiva, deveria haver diretrizes universais ou normas culturais que ajudem a definir que assuntos estão universalmente vedados a piadas, ou trata-se de uma questão subjetiva que depende dos valores e das experiências individuais?", "de": "Sollte es deiner Ansicht nach universelle Richtlinien oder kulturelle Normen geben, die definieren, welche Themen für Witze allgemein tabu sind, oder ist das eine subjektive Frage, die von individuellen Werten und Erfahrungen abhängt?", "hu": "Szerinted kellenek-e általános irányelvek vagy kulturális normák, amelyek segítenek meghatározni, mely témák tabuk minden viccelődés számára, vagy ez szubjektív kérdés, amely az egyéni értékektől és tapasztalatoktól függ?"}]}];
