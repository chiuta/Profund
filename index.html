      let r;
      try { r = o.onMove ? o.onMove(move, info) : undefined; } catch (e) { return {ok: false, reason: String(e && e.message || e)}; }
      if (r === false) return {ok: false, reason: 'rejected'};
      if (typeof r === 'string') return {ok: false, reason: r};
      return {ok: true};
    };
    function snapshotMsg() {
      const m = {t: 'sync', seq, seed, rng: rng.getState()};
      if (o.snapshot) m.state = o.snapshot();
      return m;
    }
    function begin(reason, st) {
      if (!started) { started = true; clearTimeout(helloTimer); }
      if (o.onState) o.onState(st, {reason, seq, seed, rng: rng.getState()});
    }
    function applyRemote(m) {                                  // oaspete: o mutare numerotată de la gazdă
      if (m.seq <= seq) { stats.dupes++; return; }
      if (m.seq > seq + 1) {
        if (m.seq - seq > AHEAD_MAX || ahead.size >= AHEAD_MAX) { send({t: 'need', from: seq}); return; }   // plafon: un partener rău nu umple memoria
        ahead.set(m.seq, m); send({t: 'need', from: seq}); return;
      }
      const mine = m.from === 'guest' && pending.has(m.cid);
      const r = tryApply(m.move, {seq: m.seq, from: m.from, mine, rng});
      if (!r.ok) { fail('diverged', {detail: r.reason}); stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      seq = m.seq; stats.applied++;
      if (mine) { const p = pending.get(m.cid); pending.delete(m.cid); clearTimeout(p.timer); p.resolve({seq, ok: true}); }
      if (o.hash && m.h != null && String(o.hash()) !== String(m.h)) { stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      const nx = ahead.get(seq + 1); if (nx) { ahead.delete(seq + 1); applyRemote(nx); }
    }
    function hostApply(move, from, cidv) {                     // gazdă: validează, aplică, numerotează, difuzează
      if (move == null || typeof move !== 'object') return {ok: false, reason: 'bad-move'};
      if (o.validate) { const v = o.validate(move, {from, seq: seq + 1}); if (v !== true && v !== undefined) return {ok: false, reason: typeof v === 'string' ? v : 'invalid'}; }
      const r = tryApply(move, {seq: seq + 1, from, mine: from === 'host', rng});
      if (!r.ok) return r;
      seq++; stats.applied++;
      log.push({seq, move, from}); if (log.length > keep) log.shift();
      const m = {t: 'move', seq, move, from}; if (cidv != null) m.cid = cidv; if (o.hash) m.h = o.hash();
      send(m);
      return {ok: true, seq};
    }
    function onMsg(m) {
      if (stopped || !m || typeof m.t !== 'string') return;
      if (isHost()) {
        if (m.t === 'hello') { send(snapshotMsg()); }
        else if (m.t === 'move') {
          const r = hostApply(m.move, 'guest', m.cid);
          if (!r.ok) { stats.rejected++; send({t: 'reject', cid: m.cid, reason: r.reason}); }
        } else if (m.t === 'need') {
          const from = Number.isInteger(m.from) ? m.from : -1;
          if (!m.force && log.length && log[0].seq <= from + 1 && from <= seq) send({t: 'moves', list: log.filter(e => e.seq > from)});
          else if (o.snapshot) { stats.resyncs++; send(Object.assign(snapshotMsg(), {resync: true})); }
          else send({t: 'fatal', reason: 'no-history'});
        } else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'guest');
        return;
      }
      if (m.t === 'sync') {                                    // oaspete
        if (!Number.isInteger(m.seq) || !Number.isInteger(m.seed) || m.seq < 0) return;
        if (!m.resync && started && m.seq === seq && m.seed === seed) return;     // idempotent
        if (m.state !== undefined || m.seq === 0) {            // stare completă sau început de joc
          const first = !started;
          seq = m.seq; seed = m.seed >>> 0; rng = mulberry(seed);
          if (Number.isInteger(m.rng)) rng.setState(m.rng);
          ahead.clear(); begin(first ? 'start' : 'resync', m.state);
        } else if (m.seq > seq) {                              // gazda e înainte, fără instantaneu: cere mutările
          if (!started) { seed = m.seed >>> 0; rng = mulberry(seed); started = true; clearTimeout(helloTimer); }
          send({t: 'need', from: seq});
        } else fail('diverged');
      } else if (m.t === 'move') { if (started && Number.isInteger(m.seq) && m.move && typeof m.move === 'object') applyRemote(m); }
      else if (m.t === 'moves' && Array.isArray(m.list)) { m.list.slice(0, keep).forEach(e => { if (e && Number.isInteger(e.seq) && e.move && typeof e.move === 'object') applyRemote({t: 'move', seq: e.seq, move: e.move, from: e.from === 'host' ? 'host' : 'guest'}); }); }
      else if (m.t === 'reject') { const p = pending.get(m.cid); if (p) { pending.delete(m.cid); clearTimeout(p.timer); p.reject(Object.assign(new Error(String(m.reason || 'rejected')), {code: 'rejected'})); } }
      else if (m.t === 'fatal') fail(String(m.reason || 'fatal'));
      else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'host');
    }
    function bind() {
      offs.forEach(f => f()); offs.length = 0;
      offs.push(sess.on('message', onMsg));
      offs.push(sess.on('open', start));
      offs.push(sess.on('close', () => { pending.forEach(p => { clearTimeout(p.timer); p.reject(Object.assign(new Error('closed'), {code: 'closed'})); }); pending.clear(); }));
      if (sess.open) start();
    }
    function start() {
      if (isHost()) { if (!started) { started = true; begin('start'); } send(snapshotMsg()); }
      else { helloTries = 0; hello(); }
    }
    function hello() {
      clearTimeout(helloTimer);
      if (stopped) return;
      if (helloTries++ >= 8) { if (!started) fail('no-sync'); return; }
      send({t: 'hello', seq});
      helloTimer = setTimeout(() => { if (!started) hello(); }, 1500);
    }
    const api = {
      get seq() { return seq; }, get seed() { return seed; }, get role() { return sess.role; }, get stats() { return Object.assign({}, stats); },
      rng: () => rng(), get rngState() { return rng.getState(); },
      /** Trimite o mutare. Gazdă: aplică imediat; oaspete: așteaptă ecoul numerotat al gazdei. Returnează Promise<{seq}>. */
      move(move) {
        if (stopped) return Promise.reject(Object.assign(new Error('stopped'), {code: 'stopped'}));
        if (isHost()) {
          const r = hostApply(move, 'host');
          return r.ok ? Promise.resolve({seq: r.seq, ok: true}) : Promise.reject(Object.assign(new Error(r.reason), {code: 'rejected'}));
        }
        if (!sess.open) return Promise.reject(Object.assign(new Error('closed'), {code: 'closed'}));
        const id = ++cid;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(id); reject(Object.assign(new Error('timeout'), {code: 'timeout'})); }, o.timeout || 8000);
          pending.set(id, {resolve, reject, timer});
          if (!send({t: 'move', cid: id, move})) { clearTimeout(timer); pending.delete(id); reject(Object.assign(new Error('closed'), {code: 'closed'})); }
        });
      },
      chat(text) { return send({t: 'chat', text: String(text).slice(0, 2000)}); },
      /** Cere resincronizarea completă (oaspete) sau retrimite starea (gazdă). */
      resync() { if (isHost()) return send(snapshotMsg()); return send({t: 'need', from: seq, force: true}); },
      /** După o reconectare: leagă aceeași stare de joc la o sesiune nouă. */
      rebind(newSession) { sess = newSession; bind(); },
      stop() { stopped = true; clearTimeout(helloTimer); offs.forEach(f => f()); offs.length = 0; }
    };
    bind();
    return api;
  }

  /* ======================= dialog ======================= */
  let uid = 0, cssDone = false;
  const CSS = `

@media (prefers-color-scheme:dark){dialog.fff-p2p{--fff-bg:#1c1c21;--fff-fg:#ececf1;--fff-border:#8d8d99;--fff-accent:#8ab4ff;--fff-on-accent:#0b0b10;--fff-field:#111116}

@media (prefers-reduced-motion:reduce){dialog.fff-p2p *{animation:none!important;transition:none!important}}`;
  function injectCss() {
    if (cssDone) return; cssDone = true;
    try { const sh = new CSSStyleSheet(); sh.replaceSync(CSS); document.adoptedStyleSheets = [...document.adoptedStyleSheets, sh]; }
    catch (e) { const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st); }
  }
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) { const v = attrs[k]; if (v === false || v == null) continue; if (k === 'text') n.textContent = v; else n.setAttribute(k, v === true ? '' : v); }
    kids.forEach(c => c != null && n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return n;
  }

  /** QR (sau cadre QR succesive) pentru un cod; returnează {node, destroy}. */
  function qrView(code, o) {
    o = o || {};
    const list = frames(code, o), root = el('div', {'data-role': 'qr'});
    let idx = 0, timer = 0, paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const box = el('div', {class: 'fff-p2p-qr'}), cap = el('p', {class: 'fff-p2p-small', 'data-role': 'qr-caption'});
    const draw = () => {
      let svgStr;
      try { svgStr = F.qr.svg(list[idx], {ecc: 'M', scale: 5, margin: 3, label: list.length > 1 ? T('frame', {i: idx + 1, n: list.length}) : F.t('qr', 'label')}); }
      catch (e) { box.textContent = e.message; return; }
      const doc = new DOMParser().parseFromString(svgStr, 'image/svg+xml').documentElement;
      box.replaceChildren(document.importNode(doc, true));
      cap.textContent = list.length > 1 ? T('frame', {i: idx + 1, n: list.length}) : '';
    };
    root.appendChild(box);
    if (list.length > 1) {
      const prev = el('button', {type: 'button', class: 'fff-p2p-sec', text: T('prev')}), next = el('button', {type: 'button', class: 'fff-p2p-sec', text: T('next')});
      const pp = el('button', {type: 'button', class: 'fff-p2p-sec', 'aria-pressed': String(!paused), text: paused ? T('play') : T('pause')});
      const go = d => { idx = (idx + d + list.length) % list.length; draw(); };
      prev.addEventListener('click', () => go(-1)); next.addEventListener('click', () => go(1));
      const arm = () => { clearInterval(timer); if (!paused) timer = setInterval(() => go(1), 1600); };
      pp.addEventListener('click', () => { paused = !paused; pp.setAttribute('aria-pressed', String(!paused)); pp.textContent = paused ? T('play') : T('pause'); arm(); });
      root.append(cap, el('p', {class: 'fff-p2p-small', text: T('chunkInfo', {n: list.length})}), el('div', {class: 'fff-p2p-row'}, prev, next, pp));
      arm();
    }
    draw();
    return {node: root, frames: list, destroy() { clearInterval(timer); }};
  }

  function dialog(o) {
    o = o || {};
    injectCss();
    const id = 'fff-p2p-' + (++uid);
    const dlg = el('dialog', {class: 'fff-p2p', 'aria-labelledby': id + '-t', 'data-role': 'p2p-dialog'});
    const status = el('p', {class: 'fff-p2p-status', role: 'status', 'aria-live': 'polite', 'data-role': 'status'});
    const closeBtn = el('button', {type: 'button', class: 'fff-p2p-sec', 'data-role': 'close', text: T('close')});
    let session = null, qrv = [], resolveP, rejectP, delivered = false, camJob = false;
    const promise = new Promise((res, rej) => { resolveP = res; rejectP = rej; });
    promise.catch(() => {});
    const say = (k, v, isErr) => { status.textContent = k ? T(k, v) : ''; status.dataset.key = k || ''; if (isErr) status.setAttribute('role', 'alert'); else status.setAttribute('role', 'status'); };
    const sayRaw = t => { status.textContent = t; status.setAttribute('role', 'alert'); };
    function shutdown() {
      qrv.forEach(q => q.destroy()); qrv = [];
      if (F.qr && F.qr.stopScan) F.qr.stopScan();
      if (dlg.open) dlg.close();
      dlg.remove();
    }
    function api_close() {
      if (session && !delivered) session.close('cancel');
      if (!delivered) rejectP(Object.assign(new Error('cancel'), {code: 'cancel'}));
      shutdown();
    }
    closeBtn.addEventListener('click', api_close);
    dlg.addEventListener('cancel', e => { e.preventDefault(); api_close(); });
    const api = {element: dlg, promise, close: api_close, get session() { return session; }};

    const head = el('h2', {id: id + '-t', text: o.title || T('title')});
    dlg.appendChild(head);

    if (!supported()) {
      dlg.append(el('p', {role: 'alert', 'data-role': 'unsupported', text: T('unsupported')}), el('div', {class: 'fff-p2p-row'}, closeBtn));
      document.body.appendChild(dlg); dlg.showModal();
      return api;
    }

    const warn = el('div', {class: 'fff-p2p-warn', 'data-role': 'warning'}, el('p', {text: T('ipWarn')}), el('p', {text: T('limits')}));
    const chk = el('input', {type: 'checkbox', id: id + '-ok', 'data-role': 'optin'});
    const chkLabel = el('label', {class: 'fff-p2p-chk', for: id + '-ok'}, chk, el('span', {text: T('optin')}));
    const stun = el('input', {type: 'text', id: id + '-stun', placeholder: 'stun:host:3478', autocomplete: 'off', spellcheck: 'false', 'data-role': 'stun', 'aria-describedby': id + '-stunh'});
    const stunBox = el('div', {}, el('label', {for: id + '-stun', text: T('stunLabel')}), stun, el('p', {id: id + '-stunh', class: 'fff-p2p-small', text: T('stunHelp')}));
    const bHost = el('button', {type: 'button', 'data-role': 'mode-host', disabled: true, text: T('host')});
    const bJoin = el('button', {type: 'button', 'data-role': 'mode-join', disabled: true, text: T('join')});
    const modes = el('div', {class: 'fff-p2p-row', role: 'group', 'aria-label': T('title')}, bHost, bJoin);
    const panel = el('div', {'data-role': 'panel'});
    dlg.append(warn, chkLabel, stunBox, modes, panel, status, el('div', {class: 'fff-p2p-row'}, closeBtn));
    chk.addEventListener('change', () => { bHost.disabled = bJoin.disabled = !chk.checked; if (!chk.checked) panel.replaceChildren(); });

    function opts() { return {stun: stun.value, heartbeat: o.heartbeat, gatherTimeout: o.gatherTimeout}; }
    function copyBtn(ta) {
      const b = el('button', {type: 'button', class: 'fff-p2p-sec', 'data-role': 'copy', text: T('copy')});
      b.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.focus(); ta.select(); try { document.execCommand('copy'); } catch (er) { /* manual */ } }

      });
      return b;
    }
    function showCode(label, code, role) {
      const ta = el('textarea', {id: id + '-' + role, readonly: true, rows: '4', 'data-role': role, spellcheck: 'false'}); ta.value = code;
      const q = qrView(code, o); qrv.push(q);
      return el('div', {}, el('label', {for: id + '-' + role, text: label}), ta, el('div', {class: 'fff-p2p-row'}, copyBtn(ta)), q.node);
    }
    /** Câmp de introducere + scanare QR/imagine. */
    function codeInput(label, role) {
      const ta = el('textarea', {id: id + '-' + role, rows: '4', 'data-role': role, spellcheck: 'false', autocomplete: 'off'});
      const asm = assembler();
      const prog = r => { if (r.total > 1 && !r.done) say('progress', {have: r.have, total: r.total}); };
      const video = el('video', {playsinline: true, muted: true, hidden: true, 'aria-label': T('scanning'), 'data-role': 'video'});
      const bCam = el('button', {type: 'button', class: 'fff-p2p-sec', 'data-role': 'scan-cam', text: T('scanCam')});
      const bStop = el('button', {type: 'button', class: 'fff-p2p-sec', hidden: true, 'data-role': 'scan-stop', text: T('scanStop')});
      const file = el('input', {type: 'file', accept: 'image/*', multiple: true, id: id + '-' + role + '-f', hidden: true, 'data-role': 'scan-file'});
      const bFile = el('button', {type: 'button', class: 'fff-p2p-sec', 'data-role': 'scan-file-btn', text: T('scanFile')});
      const got = code => { ta.value = code; say(null); ta.dispatchEvent(new Event('input', {bubbles: true})); };
      bFile.addEventListener('click', () => file.click());
      file.addEventListener('change', async () => {
        let found = false;
        for (const f of file.files) {
          try {
            const txt = await F.qr.scan(f);
            if (!txt) continue;
            const r = asm.add(txt); found = found || !r.ignored; prog(r);

      });
      bCam.addEventListener('click', async () => {
        if (camJob) return; camJob = true; asm.reset();
        video.hidden = false; bStop.hidden = false; bCam.disabled = true; say('scanning');
        let result = null;

    function watch(s) {

      gen.addEventListener('click', async () => {
        gen.disabled = true; say('gathering');
        try {
          if (session) session.close('restart');
          const s = await host(opts()); watch(s);
          const ans = codeInput(T('answerIn'), 'answer-in');
          const conn = el('button', {type: 'button', 'data-role': 'connect', text: T('connect')});
          conn.addEventListener('click', async () => {
            if (!ans.ta.value.trim()) { say('emptyField', null, true); ans.ta.focus(); return; }
            try { conn.disabled = true; await s.accept(ans.ta.value); say('connecting'); } catch (e) { fail(e); conn.disabled = false; }
          });
          slot.replaceChildren(showCode(T('offerOut'), s.offer, 'offer-out'), ans.node, el('div', {class: 'fff-p2p-row'}, conn));
          say('waitAnswer');
        } catch (e) { fail(e); gen.disabled = false; }
      });
      gen.focus();
    });
    bJoin.addEventListener('click', () => {
      bJoin.setAttribute('aria-pressed', 'true'); bHost.setAttribute('aria-pressed', 'false');

  /* =====================================================================================
     FFF.games · motorul comun de jocuri: istoric local, clasament Elo pe nume, turnee hot-seat
     și un hub „Turneu & Elo” atașabil oricărui joc (fără AI în rețea: jocurile rulează cu connect-src 'none').
     Miezul pur (record/ladder/history/export/import) nu atinge DOM-ul și se testează în Node. */
  var T = TBL, doc = typeof document !== 'undefined' ? document : null, el = T.el, clear = T.clear;
  var G = {}, MAXH = 300, START = 1200;
  function key(k) { return String(k || 'joc').toLowerCase().replace(/[^a-z0-9_-]+/g, '-').slice(0, 40) || 'joc'; }
  function cleanName(n) { return String(n == null ? '' : n).replace(/\s+/g, ' ').trim().slice(0, 24); }
  function ladderRaw(k) { var L = T.store.get('lad.' + key(k), null); return L && typeof L === 'object' && !Array.isArray(L) ? L : {}; }
  /** Notează o partidă: res = scorul lui A (1 / 0.5 / 0). Actualizează istoricul și clasamentul Elo (K 40/28/20 după numărul de partide). */
  G.record = function (k, a, b, res, meta) {
    a = cleanName(a); b = cleanName(b);
    if (!a || !b || a.toLowerCase() === b.toLowerCase()) throw new Error('players');
    if (res !== 1 && res !== 0 && res !== 0.5) throw new Error('result');
    var L = ladderRaw(k), A = L[a] || (L[a] = { r: START, g: 0, w: 0, d: 0, l: 0 }), B = L[b] || (L[b] = { r: START, g: 0, w: 0, d: 0, l: 0 });
    var n = T.elo.update(A.r, B.r, res, A.g, B.g), da = n[0] - A.r, db = n[1] - B.r;
    A.r = n[0]; B.r = n[1]; A.g++; B.g++;
    if (res === 1) { A.w++; B.l++; } else if (res === 0) { A.l++; B.w++; } else { A.d++; B.d++; }
    T.store.set('lad.' + key(k), L);
    var H = G.history(k); H.push({ at: new Date().toISOString(), a: a, b: b, res: res, meta: meta || null });
    if (H.length > MAXH) H = H.slice(H.length - MAXH);
    T.store.set('his.' + key(k), H);
    return { a: { name: a, r: A.r, delta: da }, b: { name: b, r: B.r, delta: db } };
  };
  G.history = function (k) { var H = T.store.get('his.' + key(k), []); return Array.isArray(H) ? H.slice() : []; };
  G.ladder = function (k) {
    var L = ladderRaw(k);
    return Object.keys(L).map(function (n) { var p = L[n]; return { name: n, r: p.r, g: p.g, w: p.w, d: p.d, l: p.l }; })
      .sort(function (x, y) { return (y.r - x.r) || (x.name < y.name ? -1 : 1); });
  };
  G.clear = function (k) { T.store.remove('lad.' + key(k)); T.store.remove('his.' + key(k)); };
  G.exportJSON = function (k) { return JSON.stringify({ fff: 'games', v: 1, game: key(k), history: G.history(k) }, null, 1); };
  /** Importă un istoric exportat: se reia calculul Elo din zero în ordinea partidelor (clasamentul decurge din istoric). Aruncă la format greșit. */
  G.importJSON = function (k, json) {
    var o = JSON.parse(json);
    if (!o || o.fff !== 'games' || o.v !== 1 || !Array.isArray(o.history) || o.history.length > MAXH) throw new Error('format');
    o.history.forEach(function (m) { if (!m || typeof m.a !== 'string' || typeof m.b !== 'string' || [0, 0.5, 1].indexOf(m.res) < 0 || !cleanName(m.a) || !cleanName(m.b) || cleanName(m.a).toLowerCase() === cleanName(m.b).toLowerCase()) throw new Error('format'); });
    G.clear(k);
    o.history.forEach(function (m) { G.record(k, m.a, m.b, m.res, m.meta); });
    return o.history.length;
  };
  G.toCSV = function (k) {
    var rows = ['pozitie;nume;elo;jocuri;V;E;I'];

<style>

  :root{
    --teal-950:#082826;--teal-900:#0b3735;--teal-800:#0f4845;--teal-700:#125e58;
    --teal-500:#17766d;--teal-300:#5cc4b7;--cream:#f6efe0;--cream-soft:#faf5ea;
    --paper:#fffdf8;--coral:#ff7a59;--coral-ink:#b93a18;--amber:#f4b860;--ink:#13322f;--ink-soft:#3d5a56;
    --shadow:rgba(8,40,38,.18);
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:'Figtree','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--coral);color:#fff}

  /* language toggle */
  .lang-toggle{
    position:fixed;top:1.1rem;right:1.1rem;z-index:50;display:flex;
    background:rgba(8,40,38,.92);backdrop-filter:blur(10px);border:1px solid rgba(246,239,224,.25);
    border-radius:999px;padding:.25rem;gap:.15rem;
  }
  .lang-toggle button{
    font-family:var(--sans);font-weight:700;font-size:.82rem;letter-spacing:.04em;
    padding:.4rem .85rem;border-radius:999px;border:none;cursor:pointer;background:transparent;color:var(--cream);transition:all .2s;
  }
  .lang-toggle button.active{background:var(--amber);color:var(--teal-950)}
  @media (max-width:560px){
    .lang-toggle{top:.6rem;right:.6rem;padding:.2rem;gap:.05rem}
    .lang-toggle button{font-size:.68rem;padding:.38rem .42rem;letter-spacing:0}
  }

  /* HERO */
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 1.5rem 3rem;
    background:radial-gradient(120% 90% at 80% -10%,rgba(244,184,96,.16),transparent 55%),radial-gradient(100% 80% at 10% 110%,rgba(255,122,89,.18),transparent 55%),linear-gradient(165deg,var(--teal-900),var(--teal-950));
    color:var(--cream);overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);opacity:.6}
  .emblem{width:84px;height:84px;margin-bottom:1.6rem;position:relative;z-index:2;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .brand{font-family:var(--serif);font-weight:600;font-size:clamp(3.8rem,12vw,7.5rem);line-height:.9;letter-spacing:-.02em;position:relative;z-index:2;animation:rise .9s .08s cubic-bezier(.2,.8,.2,1) both}
  .brand em{font-style:italic;color:var(--amber)}
  .tagline{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,3vw,1.7rem);color:var(--teal-300);margin-top:.6rem;position:relative;z-index:2;animation:rise .9s .16s cubic-bezier(.2,.8,.2,1) both}
  .hashtag{margin-top:2rem;font-weight:600;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);opacity:.7;position:relative;z-index:2;animation:rise .9s .24s cubic-bezier(.2,.8,.2,1) both}
  .hero-cta{margin-top:2.4rem;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:2;animation:rise .9s .32s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .btn{font-family:var(--sans);font-weight:600;font-size:1rem;padding:.85rem 1.8rem;border-radius:999px;border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;transition:transform .25s,box-shadow .25s,background .25s}
  .btn-primary{background:var(--coral-ink);color:#fff;box-shadow:0 10px 26px rgba(255,122,89,.4)}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(255,122,89,.5)}
  .btn-ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(246,239,224,.4)}
  .btn-ghost:hover{background:rgba(246,239,224,.1);transform:translateY(-3px)}
  .btn-teal{background:var(--teal-700);color:var(--cream)}
  .btn-teal:hover{transform:translateY(-3px);background:var(--teal-500)}
  .scroll-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:2;color:var(--cream);opacity:.6;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;animation:bob 2.2s ease-in-out infinite;text-decoration:none}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

  section{padding:5.5rem 1.5rem}
  .wrap{max-width:1100px;margin:0 auto}
  .narrow{max-width:760px}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,3rem);line-height:1.05;letter-spacing:-.015em;margin-bottom:1.2rem}
  h2 em{font-style:italic;color:var(--coral-ink)}
  .lead{font-size:clamp(1.05rem,2.4vw,1.3rem);color:var(--ink-soft);max-width:620px}
  .legal-status{max-width:46rem;margin:1.4rem auto 0;padding:.8rem 1rem;border:1px solid var(--amber);border-left:6px solid var(--coral);background:var(--paper);color:var(--ink);border-radius:8px;font-size:.92rem;line-height:1.55;text-align:left}
  .legal-status a{color:var(--coral-ink);text-decoration:underline}
  footer .legal-foot strong{color:inherit}
  .eyebrow{font-weight:700;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-500);margin-bottom:.8rem;display:block}

  .intro{background:var(--paper);text-align:center}
  .intro .wrap{display:flex;flex-direction:column;align-items:center}
  .pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem;margin-top:3rem}
  .pillar{background:var(--cream-soft);border:1px solid rgba(18,94,88,.12);border-radius:20px;padding:1.8rem;text-align:left;transition:transform .3s,box-shadow .3s}
  .pillar:hover{transform:translateY(-5px);box-shadow:0 18px 40px var(--shadow)}
  .pillar .ico{font-size:1.6rem;margin-bottom:.6rem;display:block}
  .pillar h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin-bottom:.4rem}
  .pillar p{color:var(--ink-soft);font-size:.98rem}

  .might{background:var(--teal-900);color:var(--cream)}
  .might h2{color:var(--cream)}.might .lead{color:var(--teal-300)}
  .might-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem;margin-top:2.4rem}
  .might-item{display:flex;gap:.9rem;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:1.3rem}
  .might-item .dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--teal-950);display:grid;place-items:center;font-weight:700;font-family:var(--serif)}
  .might-item span:last-child{font-size:1.02rem}

  .ways{background:var(--cream)}
  .ways-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.4rem;margin-top:3rem}
  .way{background:var(--paper);border-radius:22px;padding:2rem;position:relative;overflow:hidden;border:1px solid rgba(18,94,88,.1);transition:transform .3s,box-shadow .3s}
  .way:hover{transform:translateY(-6px);box-shadow:0 20px 44px var(--shadow)}
  .way .num{font-family:var(--serif);font-size:3.4rem;font-weight:600;line-height:1;color:var(--teal-300);position:absolute;top:1.1rem;right:1.4rem;opacity:.55}
  .way h3{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin-bottom:.2rem;padding-right:3rem}
  .way .who{font-size:.82rem;font-weight:600;color:var(--coral-ink);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem}
  .way p{color:var(--ink-soft);font-size:.97rem}

  .play{background:var(--teal-950);color:var(--cream);position:relative}
  .play::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 0%,rgba(244,184,96,.1),transparent 60%);pointer-events:none}
  .play .wrap{position:relative;z-index:2}
  .play h2{color:var(--cream)}.play .lead{color:var(--teal-300)}
  .draw-zone{display:flex;flex-direction:column;align-items:center;gap:1.4rem;margin:2.8rem 0 3.5rem}
  .draw-card{width:min(420px,90vw);min-height:230px;border-radius:24px;padding:2.2rem;background:linear-gradient(150deg,var(--cream-soft),var(--paper));color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);font-size:clamp(1.3rem,3.6vw,1.7rem);line-height:1.25;box-shadow:0 24px 60px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.5);transition:transform .5s cubic-bezier(.2,.8,.2,1);position:relative}
  .draw-card .tag{position:absolute;top:1rem;left:1.4rem;font-family:var(--sans);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--teal-500)}
  .draw-card.flip{animation:dealFlip .55s ease}
  @keyframes dealFlip{0%{transform:rotateY(90deg) scale(.96);opacity:.2}100%{transform:none;opacity:1}}
  .blocks-nav{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2.6rem}
  .block-tab{font-family:var(--sans);font-weight:600;font-size:.85rem;padding:.5rem 1rem;border-radius:999px;border:1.5px solid rgba(92,196,183,.35);background:transparent;color:var(--teal-300);cursor:pointer;transition:all .2s}
  .block-tab:hover{border-color:var(--teal-300)}
  .block-tab.active{background:var(--amber);color:var(--teal-950);border-color:var(--amber)}
  .block-title{font-family:var(--serif);font-style:italic;font-size:1.5rem;text-align:center;margin-bottom:1.8rem;color:var(--amber)}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;perspective:1200px}
  .card{aspect-ratio:3/4;cursor:pointer;background:transparent;border:none;padding:0;perspective:1000px}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;border-radius:16px}
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.35);overflow:hidden}
  .card-back{background:linear-gradient(155deg,var(--teal-700),var(--teal-900));color:var(--cream);flex-direction:column;gap:.4rem}
  .card-back::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(244,184,96,.18),transparent 60%)}
  .card-back .mark{font-family:var(--serif);font-style:italic;font-size:1.6rem;z-index:1}
  .card-back .mark em{color:var(--amber);font-style:italic}
  .card-back .ripple{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(246,239,224,.4);position:relative;z-index:1}
  .card-back .ripple::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(246,239,224,.25)}
  .card:hover .card-back{filter:brightness(1.12)}
  .card-front{background:linear-gradient(155deg,var(--cream-soft),var(--paper));color:var(--ink);transform:rotateY(180deg);flex-direction:column;padding:1rem .9rem;gap:.5rem}
  .card-front .q{font-family:var(--serif);font-size:.92rem;line-height:1.25;overflow-y:auto;max-height:100%}
  .card-front .n{position:absolute;top:.5rem;right:.7rem;font-size:.7rem;font-weight:700;color:var(--teal-300)}


  /* provocarea zilei (v2) */
  .daily{background:var(--teal-900);color:var(--cream)}
  .daily h2{color:var(--cream)}.daily .lead{color:var(--teal-300)}
  .daily-ctl{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin:1.6rem 0 1rem}
  .daily-ctl label{font-weight:600;font-size:.9rem;margin:0;display:inline-flex;gap:.5rem;align-items:center}
  .daily-ctl select{background:var(--teal-700);color:var(--cream);border:1px solid var(--teal-300);border-radius:8px;padding:.45rem .6rem;font:inherit}
  .daily-ctl input[type=checkbox]{width:1.1rem;height:1.1rem;padding:0}
  .daily-date,.daily-streak,.daily-prog{font-size:.9rem;color:var(--teal-300);font-weight:700}
  .daily-hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem;margin:1rem 0}
  .dslot{min-height:76px;border-radius:14px;border:1.5px solid rgba(92,196,183,.4);background:linear-gradient(155deg,var(--teal-700),var(--teal-900));color:var(--cream);font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;align-items:center;justify-content:center;padding:.6rem}
  .dslot[aria-pressed=true]{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
  .dslot .em{font-size:1.5rem;min-height:1.7rem}
  .daily-q{background:var(--paper);color:var(--ink);border-radius:20px;padding:1.6rem;font-family:var(--serif);font-size:1.2rem;line-height:1.35;min-height:5rem;margin:1rem 0}
  .daily-rate{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.6rem 0}
  .daily-rate .btn{padding:.6rem 1.1rem;font-size:.92rem;min-height:44px}
  .daily-rate .btn[aria-pressed=true]{outline:3px solid var(--amber);outline-offset:2px}
  .daily-out{width:100%;max-width:560px;margin-top:.8rem;font:inherit;font-size:1rem;padding:.8rem 1rem;border-radius:12px;border:1.5px solid rgba(92,196,183,.45);background:rgba(255,255,255,.06);color:var(--cream);resize:none}
  .daily-msg{min-height:1.4em;font-size:.9rem;color:var(--amber);font-weight:700}
  @media(max-width:680px){.daily-hand{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}}
  /* OFFLINE */
  .offline{background:var(--cream)}
  .offline-actions{display:flex;gap:1rem;flex-wrap:wrap;margin:2rem 0 1rem}
  .offline-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:2.5rem;align-items:start}
  .offline-box{background:var(--paper);border:1px dashed rgba(18,94,88,.3);border-radius:20px;padding:1.8rem}
  .offline-box h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin-bottom:.5rem}
  .offline-box p{color:var(--ink-soft);font-size:.97rem}
  .offline-box .ico{font-size:1.6rem;display:block;margin-bottom:.5rem}

  .contact{background:var(--paper)}
  .contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start}
  form{display:flex;flex-direction:column;gap:1rem}
  label{font-weight:600;font-size:.9rem;margin-bottom:-.5rem}
  input,textarea{font-family:var(--sans);font-size:1rem;padding:.85rem 1rem;border-radius:12px;border:1.5px solid rgba(18,94,88,.2);background:var(--cream-soft);color:var(--ink);resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--teal-500);background:#fff}
  .hp{display:none}
  .form-note{font-size:.85rem;color:var(--ink-soft);margin-top:.3rem}

  footer{background:var(--teal-950);color:var(--cream);text-align:center;padding:3.5rem 1.5rem}
  footer .fmark{font-family:var(--serif);font-style:italic;font-size:2rem;color:var(--amber);margin-bottom:.8rem}
  footer a{color:var(--teal-300);text-decoration:none;border-bottom:1px solid transparent;transition:border .2s}
  footer a:hover{border-color:var(--teal-300)}
  footer .fine a{text-decoration:underline}
  footer .links{margin:1.2rem 0;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;font-weight:600}
  footer .fine{font-size:.85rem;opacity:.85;margin-top:1.2rem;line-height:1.7}
  .vol{display:inline-block;margin-top:.6rem;font-size:.85rem;opacity:.8}

  /* PRINT SHEET */
  #printSheet{display:none}
  @media print{
    body{background:#fff}
    body>*{display:none !important}
    #printSheet{display:block !important}
    .print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .print-card{border:1.2px solid #0b3735;border-radius:10px;padding:12px 10px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;break-inside:avoid;page-break-inside:avoid}
    .print-card .pc-top{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#1a8a80}
    .print-card .pc-q{font-family:var(--serif);font-size:11px;line-height:1.25;margin:8px 0;color:#13322f}
    .print-card .pc-foot{font-family:var(--serif);font-style:italic;font-size:11px;color:#0b3735;text-align:right}
    .print-head{font-family:var(--serif);font-size:18px;margin-bottom:10px;text-align:center}
    @page{margin:1cm}
  }

  @media(max-width:680px){
    .contact .wrap{grid-template-columns:1fr}
    .offline-grid{grid-template-columns:1fr}
    section{padding:4rem 1.2rem}
    .card-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.7rem}
  }

  .players{display:flex;flex-direction:column;align-items:center;gap:.4rem;width:min(420px,90vw)}
  .players label{font-size:.82rem;font-weight:600;color:var(--teal-300)}
  .players input{width:100%;padding:.55rem .8rem;border-radius:12px;border:1.5px solid rgba(92,196,183,.45);background:rgba(255,255,255,.06);color:var(--cream);font:inherit}
  .players input::placeholder{color:rgba(246,239,224,.6)}
  .players-hint,.kb-hint{font-size:.78rem;color:var(--teal-300);text-align:center;margin:0}
  .turn-line{min-height:1.4em;font-weight:700;color:var(--amber);margin:0}
  .fav-row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:.4rem}
  .fav-row .btn{font-size:.85rem;padding:.55rem 1.1rem}
  .fav-count,.timer-line{font-size:.85rem;color:var(--teal-300);margin:0}
  .timer-line{font-variant-numeric:tabular-nums;min-height:1.3em;font-weight:700}
  .timer-line.done{color:var(--amber)}
  .timer-wrap{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--cream)}
  .timer-wrap select{background:var(--teal-700);color:var(--cream);border:1px solid var(--teal-300);border-radius:8px;padding:.35rem .5rem;font:inherit}
  .draw-buttons{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
  .btn-amber{background:var(--amber);color:var(--teal-950)}
  .btn-amber:hover{transform:translateY(-3px);filter:brightness(1.05)}

/* ținte tactile ≥44px pe ecrane tactile (WCAG 2.5.5) */
@media (pointer:coarse){
.lang-toggle{flex-wrap:wrap;max-width:calc(100vw - 1.2rem);justify-content:flex-end}
.lang-toggle button[data-l],.block-tab,.fav-row .btn,#timerSel{min-height:44px;min-width:44px}
}

/* r9: text minim 12px pe ecrane înguste */
@media (max-width:99999px){
.lang-toggle button,
.draw-card .tag,
.card-front .n,
.print-card .pc-top,
.print-card .pc-q,
.print-card .pc-foot{font-size:12px !important}
}

/* r9: text minim 12px (stiluri inline) */
@media (max-width:99999px){
[style*="font-size:6px"],
[style*="font-size: 6px"],
[style*="font-size:6.5px"],
[style*="font-size: 6.5px"],
[style*="font-size:7px"],
[style*="font-size: 7px"],
[style*="font-size:7.5px"],
[style*="font-size: 7.5px"],
[style*="font-size:8px"],
[style*="font-size: 8px"],
[style*="font-size:8.5px"],
[style*="font-size: 8.5px"],
[style*="font-size:9px"],
[style*="font-size: 9px"],
[style*="font-size:9.5px"],
[style*="font-size: 9.5px"],
[style*="font-size:10px"],
[style*="font-size: 10px"],
[style*="font-size:10.5px"],
[style*="font-size: 10.5px"],
[style*="font-size:11px"],
[style*="font-size: 11px"],
[style*="font-size:11.5px"],
[style*="font-size: 11.5px"]{font-size:12px !important}
}

/* r9: ținte tactile ≥24px */
@media all{
button,[role=button],select,input[type=checkbox],input[type=radio],input[type=range],summary{min-height:24px}
input[type=checkbox],input[type=radio]{min-width:24px}
}

/* r9: focus vizibil pe orice control */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[role=button]:focus-visible,[tabindex]:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}

#app-version[data-fff-label]{display:inline-block;min-height:24px;line-height:24px}
p#app-version[data-fff-label],div#app-version[data-fff-label]{display:block}
input[type=search],input[type=text],input[type=number]{min-height:24px}

footer a,a.scroll-hint{display:inline-block;min-height:24px;line-height:24px}
a[target=_blank],a[href^="mailto:"]{display:inline-block;min-height:24px;line-height:24px}
button[data-l]{min-width:26px}
</style>

<body>

<nav class="lang-toggle" id="langToggle" aria-label="Limbă / Language / Langue / Lingua / Idioma / Sprache / Nyelv">
  <button id="btnRo" class="active" data-l="ro" lang="ro" title="Română">RO</button>
  <button id="btnEn" data-l="en" lang="en" title="English">EN</button>
  <button id="btnFr" data-l="fr" lang="fr" title="Français">FR</button>
  <button id="btnIt" data-l="it" lang="it" title="Italiano">IT</button>
  <button id="btnEs" data-l="es" lang="es" title="Español">ES</button>
  <button id="btnPt" data-l="pt" lang="pt" title="Português">PT</button>
  <button id="btnDe" data-l="de" lang="de" title="Deutsch">DE</button>
  <button id="btnHu" data-l="hu" lang="hu" title="Magyar">HU</button>
</nav>

<header class="hero">
  <svg class="emblem" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <circle cx="50" cy="50" r="46" stroke="#f4b860" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="30" stroke="#5cc4b7" stroke-width="2"/>
    <circle cx="50" cy="50" r="14" stroke="#f6efe0" stroke-width="2"/>
    <circle cx="50" cy="50" r="3" fill="#ff7a59"/>
  </svg>
  <h1 class="brand" data-i18n="brand">Pro<em>fund</em></h1>
  <p class="tagline" data-i18n="tagline">aprindem conversații cu sens</p>
  <p class="hashtag" data-i18n="hashtag">#FaraVorbeGoale</p>
  <div class="hero-cta">
    <a href="#joaca" class="btn btn-primary" data-i18n="cta_play">Joacă online →</a>
    <a href="#despre" class="btn btn-ghost" data-i18n="cta_about">Ce este Profund?</a>
  </div>
  <a href="#despre" class="scroll-hint" data-i18n="scroll">derulează în jos</a>
</header>

<main id="main">
<section class="intro" id="despre">
  <div class="wrap narrow">
    <span class="eyebrow" data-i18n="intro_eyebrow"></span>
    <h2 data-i18n="intro_h2"></h2>
    <p class="lead" style="margin:0 auto" data-i18n="intro_lead"></p>
    <p class="legal-status" id="legal-top" role="note" data-i18n="legal_status"></p>
    <div class="pillars">
      <div class="pillar"><span class="ico">🌉</span><h3 data-i18n="p1h"></h3><p data-i18n="p1p"></p></div>
      <div class="pillar"><span class="ico">💬</span><h3 data-i18n="p2h"></h3><p data-i18n="p2p"></p></div>
      <div class="pillar"><span class="ico">🤲</span><h3 data-i18n="p3h"></h3><p data-i18n="p3p"></p></div>
    </div>
  </div>
</section>

<section class="might">
  <div class="wrap">
    <span class="eyebrow" style="color:var(--amber)" data-i18n="might_eyebrow"></span>
    <h2 data-i18n="might_h2"></h2>
    <div class="might-list">
      <div class="might-item"><span class="dot">1</span><span data-i18n="m1"></span></div>
      <div class="might-item"><span class="dot">2</span><span data-i18n="m2"></span></div>
      <div class="might-item"><span class="dot">3</span><span data-i18n="m3"></span></div>
      <div class="might-item"><span class="dot">4</span><span data-i18n="m4"></span></div>
    </div>
  </div>
</section>

<section class="ways">
  <div class="wrap">
    <span class="eyebrow" data-i18n="ways_eyebrow"></span>
    <h2 data-i18n="ways_h2"></h2>
    <div class="ways-grid">
      <div class="way"><span class="num">1</span><h3 data-i18n="w1h"></h3><p class="who" data-i18n="w1who"></p><p data-i18n="w1p"></p></div>
      <div class="way"><span class="num">2</span><h3 data-i18n="w2h"></h3><p class="who" data-i18n="w2who"></p><p data-i18n="w2p"></p></div>
      <div class="way"><span class="num">3</span><h3 data-i18n="w3h"></h3><p class="who" data-i18n="w3who"></p><p data-i18n="w3p"></p></div>
      <div class="way"><span class="num">4</span><h3 data-i18n="w4h"></h3><p class="who" data-i18n="w4who"></p><p data-i18n="w4p"></p></div>
    </div>
  </div>
</section>

<section class="play" id="joaca">
  <div class="wrap">
    <span class="eyebrow" style="color:var(--amber)" data-i18n="play_eyebrow"></span>
    <h2 data-i18n="play_h2"></h2>
    <p class="lead" data-i18n="play_lead"></p>
    <div class="draw-zone">
      <div class="draw-card" id="drawCard">
        <span class="tag" id="drawTag" data-i18n="draw_tag"></span>
        <span id="drawText" data-i18n="draw_text"></span>
      </div>
        <p class="turn-line" id="turnLine" role="status" aria-live="polite"></p>
      <div class="draw-buttons">
        <button class="btn btn-primary" id="drawBtn" data-i18n="draw_btn"></button>
        <button class="btn btn-teal" id="shuffleBtn" data-i18n="shuffle_btn"></button>
        <button class="btn btn-amber" id="nextBtn" data-i18n="next_btn"></button>
      </div>
      <p class="kb-hint" data-i18n="d_passnote"></p>
      <div class="fav-row">
        <button class="btn btn-ghost" id="favBtn" type="button" aria-pressed="false" data-i18n="fav_add"></button>
        <button class="btn btn-ghost" id="favDl" type="button" data-i18n="fav_dl"></button>
        <span class="fav-count" id="favCount" role="status" aria-live="polite"></span>
        <label class="timer-wrap"><span data-i18n="timer_label"></span>

angé ! Appuie sur « Carte suivante ».", "players_label": "Joueurs (facultatif)", "players_ph": "Anne, Marc, Jeanne…", "players_hint": "Saisissez des prénoms séparés par des virgules ; chaque carte tirée indique qui répond. Rien n'est enregistré.", "turn": "Répond :", "fav_add": "♡ Garder la carte", "fav_del": "♥ Retirer des favoris", "fav_count": "Favoris : {n}", "fav_dl": "Télécharger les favoris (texte)", "fav_none": "Tire d'abord une carte.", "fav_head": "Cartes favorites", "fav_empty": "Tu n'as pas encore de carte favorite.", "timer_label": "Minuteur", "timer_off": "Sans", "timer_end": "Le temps est écoulé.", "timer_sec": "{n} s", "kb_hint": "Touches : Espace ou → = carte suivante · R = carte au hasard · S = mélanger", "deck_done": "Tu as parcouru tout le paquet 🎉 Mélange à nouveau.", "offline_eyebrow": "Jouer hors ligne", "offline_h2": "Imprime les <em>cartes</em> toi-même", "offline_lead": "Génère les 150 cartes sur une feuille prête à imprimer (ou enregistre en PDF), puis découpe-les et range-les dans une boîte. Ou télécharge les questions en fichier texte.", "offline_print": "🖨️ Imprimer les cartes (PDF)", "offline_txt": "📄 Télécharger les questions (texte)", "off_b1h": "Le jeu de cartes de base", "off_b1p": "Appuie sur « Imprimer », choisis « Enregistrer en PDF » dans la boîte de dialogue et tu obtiendras les 150 questions, 3 par ligne, prêtes à découper.", "off_b2h": "Façons de jouer &amp; boîte", "off_b2p": "Utilise les 4 façons de jouer ci-dessus. Rassemble les cartes découpées dans une petite boîte et tu auras le jeu complet, sans-échange, où que tu ailles.", "contact_eyebrow": "Contribue", "contact_h2": "Contact", "contact_lead": "Tu as une bonne question qui manque au jeu, des suggestions, ou tu veux traduire ce jeu dans ta langue ? Écris-nous avec plaisir 🙂", "f_name": "Ton nom (obligatoire)", "f_email": "Ton e-mail (obligatoire)", "f_subject": "Sujet", "f_message": "Ton message", "f_submit": "Envoyer le message", "f_sent": "Merci ! Ton message est p "Si pesca una carta; la persona A decide se vuole rispondere alla domanda. Se non vuole, fino a 3 persone possono proporre azioni alternative da compiere. La persona sceglie un'azione. In alternativa, le azioni possono essere stabilite in anticipo. Poi pesca la persona successiva…", "play_eyebrow": "Gioca online", "play_h2": "Pesca una carta e <em>comincia</em>", "play_lead": "Ecco le domande per giocare online, divise in blocchi da 10 domande ciascuno. Tocca una carta per girarla.", "draw_tag": "premi un pulsante", "draw_text": "Pesca una carta a caso oppure mescola tutto il mazzo e lascia scorrere la conversazione…", "draw_btn": "🎴 Carta a caso", "shuffle_btn": "🔀 Mescola il mazzo", "next_btn": "⏭️ Carta successiva", "deck_shuffled": "Mazzo mescolato! Premi «Carta successiva».", "players_label": "Giocatori (facoltativo)", "players_ph": "Anna, Marco, Giulia…", "players_hint": "Scrivi i nomi separati da virgole; ogni carta pescata mostra chi risponde. Non viene salvato nulla.", "turn": "Risponde:", "fav_add": "♡ Tieni questa carta", "fav_del": "♥ Rimuovi dai preferiti", "fav_count": "Preferiti: {n}", "fav_dl": "Scarica i preferiti (testo)", "fav_none": "Pesca prima una carta.", "fav_head": "Carte preferite", "fav_empty": "Non hai ancora nessuna carta preferita.", "timer_label": "Timer", "timer_off": "Disattivato", "timer_end": "Tempo scaduto.", "timer_sec": "{n} s", "kb_hint": "Tasti: Spazio o → = carta successiva · R = carta a caso · S = mescola", "deck_done": "Hai finito tutto il mazzo 🎉 Mescola di nuovo.", "offline_eyebrow": "Gioca offline", "offline_h2": "Stampa le <em>carte</em> da solo", "offline_lead": "Genera tutte le 150 carte su un foglio pronto per la stampa (o salvalo in PDF), poi ritagliale e mettile in una scatola. Oppure scarica le domande come file di testo.", "offline_print": "🖨️ Stampa le carte (PDF)", "offline_txt": "📄 Scarica le domande (testo)", "off_b1h": "Il set di carte base", "off_b1p": "Premi «Stampa», scegli «Salva come PDF» nella finestra s://deepcards.org/\" target=\"_blank\" rel=\"noopener\">deepcards.org</a> (attribuzione). <strong>Il consenso dei titolari dei diritti non è stato confermato — da chiarire a cura dell’autore.</strong> L’app non afferma che tale consenso esista; fino al chiarimento resta pubblicata con l’attribuzione sopra. Richieste di correzione o ritiro: <a href=\"mailto:alexio@trom.tf\">alexio@trom.tf</a>."}, "es": {"ver_label": "Versión", "title": "Profundo – encendemos conversaciones con sentido", "brand": "Pro<em>fundo</em>", "tagline": "encendemos conversaciones con sentido", "hashtag": "#SinPalabrasVacías", "cta_play": "Juega en línea →", "cta_about": "¿Qué es Profundo?", "scroll": "desplázate hacia abajo", "intro_eyebrow": "Hablemos de verdad", "intro_h2": "¡Tengamos conversaciones <em>con sentido</em> en todo el mundo!", "intro_lead": "¿Conoces de verdad a las personas que te rodean? Conoceos mejor con este juego de preguntas trade-free.", "p1h": "Un puente entre las personas", "p1p": "Acerca a la gente y crea conexiones reales más allá de la charla superficial.", "p2h": "Un punto de partida para conversar", "p2p": "Una buena pregunta abre puertas que no sabías que tenías. Lo demás viene solo.", "p3h": "Un juego trade-free", "p3p": "No tienes que dar nada a cambio por jugar. Ni dinero, ni datos, nada. Es totalmente trade-free 🙂", "might_eyebrow": "Lo que podría pasar", "might_h2": "Podrías…", "m1": "llegar a conocer de verdad a las personas con las que pasas el tiempo", "m2": "desarrollar más profundidad en tu interior", "m3": "enamorarte de alguien que te gusta", "m4": "hablar de temas e ideas realmente interesantes", "ways_eyebrow": "Reglas sencillas, posibilidades infinitas", "ways_h2": "Formas de <em>jugar</em>", "w1h": "Toma &amp; Responde", "w1who": "ideal para 2–6 personas", "w1p": "Una persona toma una carta, la lee en voz alta y responde a la pregunta. Cualquier otra persona que quiera también puede responder. Las conversaciones pueden durar todo lo que queráis. Después toma una carta la siguiente persona, y así sucesivamente.", "w2h": "Adivina", "w2who": "ideal para 2–6 personas", "w2p": "Una persona toma una carta, la lee en voz alta y las demás intentan adivinar cuál sería su respuesta a la pregunta. Las conversaciones pueden durar todo lo que queráis. Después toma una carta la siguiente persona, y así sucesivamente.", "w3h": "Rompehielos", "w3who": "ideal para 4–20 personas", "w3p": "Cuando os reunís en grupo, cada persona nueva que llega puede tomar una carta y responder a la pregunta. Quienes ya estaban pueden añadir más preguntas.", "w4h": "SinRespuesta – PasaALaAcción", "w4who": "ideal para 2–10 personas", "w4p": "Se toma una carta; la persona A decide si quiere responder a la pregunta. Si no, hasta 3 personas pueden proponer acciones alternativas que tendrá que hacer. Elige una de ellas. También se pueden fijar las acciones de antemano. Después toma carta la siguiente persona…", "play_eyebrow": "Juega en línea", "play_h2": "Saca una carta y <em>empieza</em>", "play_lead": "Aquí tienes las preguntas para jugar en línea, organizadas en bloques de 10 preguntas cada uno. Toca cualquier carta para darle la vuelta.", "draw_tag": "pulsa un botón", "draw_text": "Saca una carta al azar o baraja todo el mazo y deja que la conversación fluya…", "draw_btn": "🎴 Carta al azar", "shuffle_btn": "🔀 Barajar el mazo", "next_btn": "⏭️ Siguiente carta", "deck_shuffled": "¡Mazo barajado! Pulsa «Siguiente carta».", "players_label": "Jugadores (opcional)", "players_ph": "Ana, Miguel, Laura…", "players_hint": "Escribe los nombres separados por comas; cada carta que salga mostrará quién responde. No se guarda nada.", "turn": "Responde:", "fav_add": "♡ Guardar esta carta", "fav_del": "♥ Quitar de favoritas", "fav_count": "Favoritas: {n}", "fav_dl": "Descargar favoritas (texto)", "fav_none": "Primero saca una carta.", "fav_head": "Cartas favoritas", "fav_empty": "Todavía no tienes ninguna carta favorita.", "timer_label": "Temporizador", "timer ncek letöltése (szöveg)", "fav_none": "Előbb húzz egy kártyát.", "fav_head": "Kedvenc kártyák", "fav_empty": "Még nincs kedvenc kártyád.", "timer_label": "Időzítő", "timer_off": "Ki", "timer_end": "Lejárt az idő.", "timer_sec": "{n} mp", "kb_hint": "Billentyűk: Szóköz vagy → = következő kártya · R = véletlen kártya · S = keverés", "deck_done": "Végigmentél az egész paklin 🎉 Keverd meg újra.", "offline_eyebrow": "Játssz offline", "offline_h2": "Nyomtasd ki magad a <em>kártyákat</em>", "offline_lead": "Készítsd el mind a 150 kártyát egy nyomtatásra kész lapon (vagy mentsd PDF-ként), aztán vágd ki őket, és tedd egy dobozba. Vagy töltsd le a kérdéseket szöveges fájlként.", "offline_print": "🖨️ Kártyák nyomtatása (PDF)", "offline_txt": "📄 Kérdések letöltése (szöveg)", "off_b1h": "Az alap kártyakészlet", "off_b1p": "Nyomd meg a „Nyomtatás” gombot, válaszd a „Mentés PDF-ként” lehetőséget a nyomtatási ablakban, és megkapod mind a 150 kérdést, soronként 3-at, kivágásra készen.", "off_b2h": "Játékmódok &amp; doboz", "off_b2p": "Használd a fent leírt 4 játékmódot. Gyűjtsd a kivágott kártyákat egy kis dobozba, és kész a teljes, trade-free játék, bárhová mész.", "contact_eyebrow": "Közreműködés", "contact_h2": "Kapcsolat", "contact_lead": "Van egy jó kérdésed, ami hiányzik a játékból, javaslatod, vagy le szeretnéd fordítani a játékot a saját nyelvedre? Keress bátran 🙂", "f_name": "A neved (kötelező)", "f_email": "Az e-mail-címed (kötelező)", "f_subject": "Tárgy", "f_message": "Az üzeneted", "f_submit": "Üzenet küldése", "f_sent": "Köszönjük! Az üzeneted elő van készítve. 🙂", "f_about": "Rólunk", "f_play": "Játssz online", "f_offline": "Játssz offline", "f_contact": "Kapcsolat", "f_fine": "Ez egy <strong>trade-free</strong> kérdezős játék.<br>Román / angol / francia adaptáció a <a href=\"https://deepcards.org/\" target=\"_blank\" rel=\"noopener\">deepcards.org</a> alapján · a <a href=\"https://www.tiotrom.com/\" target=\"_blank\" rel=\"noopener\">TROM</a> ökoszisztéma része.", "f
