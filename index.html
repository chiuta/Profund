    if (!o.data || typeof o.data !== 'object' || Array.isArray(o.data)) throw BErr('format');
    var keys = Object.keys(o.data);
    if (keys.length > MAX_KEYS) throw BErr('too_big');
    var pfx = F.store.prefix;
    keys.forEach(function (k) {
      if (typeof o.data[k] !== 'string' || !k || k.length > 2000) throw BErr('format');
      if (k === F.store.indexKey) throw BErr('key', {k: k});
      if (k.indexOf('fff.') === 0 && k.indexOf(pfx) !== 0) throw BErr('key', {k: k});
    });
    return keys;
  }

  /* ---------- chei permise la import ---------- */
  var allowed = [];
  function declaredKeys() {
    var out = allowed.slice();
    try {
      var el = doc.getElementById('fff-info');
      if (el) {
        var j = JSON.parse(el.textContent || '{}');
        [j.storageKeys, j.bundleKeys].forEach(function (a) { if (Array.isArray(a)) a.forEach(function (x) { if (typeof x === 'string' && x) out.push(x); }); });
      }
    } catch (e) { /* fff-info absent sau invalid */ }
    return out;
  }
  /** Chei cunoscute: fff.<slug>.*, cheile deja indexate în acest browser, cele declarate (fff-info storageKeys/bundleKeys, bundle.allow);
   *  o declarație care se termină în „*”, „_”, „.”, „:” sau „-” e prefix. Restul sunt „necunoscute” (avertisment la import, nu refuz). */
  function unknownKeys(keys) {
    var decl = declaredKeys(), idx = Object.create(null);
    F.store.indexKeys().forEach(function (k) { idx[k] = 1; });
    var pfx = F.store.prefix;
    return keys.filter(function (k) {
      if (k.indexOf(pfx) === 0 || idx[k] === 1) return false;
      if (F.store.appPrefix && k.indexOf(F.store.appPrefix) === 0) return false;   // modulul „store”: <slug>.*
      return !decl.some(function (d) {
        if (d.charAt(d.length - 1) === '*') return k.indexOf(d.slice(0, -1)) === 0;
        if (/[_.:-]$/.test(d)) return k.indexOf(d) === 0;
        return d === k;
      });
    });
  }
  function keyList(keys, max) {
    max = max || 8;
    var shown = keys.slice(0, max).map(function (k) { return k.length > 60 ? k.slice(0, 57) + '…' : k; }).join(', ');
    return shown + (keys.length > max ? ' … (+' + (keys.length - max) + ')' : '');
  }
  function sensitiveKeys(obj) {
    var full = plain(false).data;
    return Object.keys(obj.data).filter(function (k) { return SENSITIVE_RE.test(k) && obj.data[k] !== '' && obj.data[k] === full[k]; });
  }

  /* ---------- API ---------- */

    schema: SCHEMA,
    iterations: ITER,
    minPassword: PW_MIN,
    passwordStrength: strength,
    sensitivePattern: SENSITIVE_RE,
    /** Declară chei (sau prefixe: „prefix_*”) pe care importul le consideră ale aplicației. */
    allow: function (list) { [].concat(list || []).forEach(function (x) { if (typeof x === 'string' && x) allowed.push(x); }); },
    build: function () { return plain(false); },
    /** Înregistrează fn(cheie, valoare) -> valoare curățată (șir); se aplică doar exportului necriptat. */
    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

    /** Descarcă un .fff.json. Cu {encrypt:true, password} produce varianta criptată. Exportul necriptat cu chei sensibile
     *  (api key, token, secret, parolă…) cere confirmare și propune criptarea ({confirm:false} sau {sensitive:false} o omit). */
    export: function (opt) {
      opt = opt || {};
      return Promise.resolve().then(function () {
        var enc = !!opt.encrypt, pw = opt.password;
        var obj = plain(!enc && !opt.secrets);   // exportul necriptat trece prin redactori (secrete scoase); cel criptat sau {secrets:true} e complet
        var step = Promise.resolve();
        if (!enc && opt.confirm !== false && opt.sensitive !== false) {
          var sens = sensitiveKeys(obj);
          if (sens.length) {
            step = choiceDlg(T('sens_msg', {list: keyList(sens)}), [
              {label: T('no'), value: null},
              {label: T('sens_plain'), value: 'plain'},
              {label: T('sens_enc'), value: 'enc', primary: true}
            ]).then(function (c) {
              if (c === null) return {cancelled: true};
              if (c === 'plain') return null;
              enc = true; obj = plain(false);
              if (typeof pw === 'string' && pw.length >= PW_MIN) return null;
              return passwordDlg().then(function (p) { if (p == null) return {cancelled: true}; pw = p; return null; });
            });
          }

      }).then(function (r) {
        if (r.cancelled) return {filename: null, size: 0, keys: 0, encrypted: false, cancelled: true};

    },

    /** Citește antetul fără a scrie nimic: {encrypted, app, version, exported, keys?} */
    inspect: function (file, opt) {
      opt = opt || {};
      return readText(file).then(function (t) {
        var o = parseEnvelope(t);

    },

    /** Importă (îmbină) cheile din bundle. Cere confirmare; reîncarcă pagina dacă reload !== false și confirm !== false. */

        var keys = validatePlain(o, slug);
        var unknown = unknownKeys(keys);
        var msg = T('confirm_import', {n: keys.length, app: slug, ver: o.version || '?', date: (o.exported || '').slice(0, 10) || '?'}) +
          '\n\n' + T('import_keys', {list: keyList(keys)}) +
          (unknown.length ? '\n\n' + T('import_unknown', {n: unknown.length, list: keyList(unknown)}) : '');
        return ask(msg, opt.confirm)
          .then(function (ok) {
            if (!ok) return {keys: 0, cancelled: true};
            var undo = new Map();   // Map: numele cheilor din Object.prototype (constructor, toString, __proto__) nu mai sunt „deja prezente”
            try {
              keys.forEach(function (k) {
                if (!undo.has(k)) undo.set(k, F.store.raw.get(k));
                F.store.raw.set(k, o.data[k]);
                if (k.indexOf('fff.') !== 0) F.store.remember(k);
              });
            } catch (e) {
              undo.forEach(function (v, k) { try { if (v == null) F.store.raw.remove(k); else F.store.raw.set(k, v); } catch (e2) { /* ignorat */ } });
              throw BErr('quota');
            }
            if (opt.reload === true) F.store.freeze();   // înainte de reload: handlerele pagehide/beforeunload ale aplicației nu mai pot suprascrie importul
            F.bus.emit('bundle:imported', {keys: keys.length, file: fname, unknown: unknown});
            if (opt.reload === true) setTimeout(function () { location.reload(); }, opt.delay == null ? 900 : opt.delay);
            return {keys: keys.length, cancelled: false, unknown: unknown};
          });
      });
    },

    /** Șterge DOAR cheile indexate ale aplicației (și cele fff.<slug>.*). */
    wipe: function (opt) {
      opt = opt || {};
      var keys = F.store.indexKeys();
      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});
      return ask(T('confirm_wipe', {n: keys.length}), opt.confirm, {danger: true, yes: T('wipe_yes')}).then(function (ok) {
        if (!ok) return {keys: 0, cancelled: true};
        keys.forEach(function (k) { try { F.store.raw.remove(k); } catch (e) { /* ignorat */ } F.store.forget(k); });
        try { F.store.raw.remove(F.store.indexKey); } catch (e) { /* ignorat */ }
        if (opt.reload === true) F.store.freeze();
        F.bus.emit('bundle:wiped', {keys: keys.length});
        if (opt.reload === true) setTimeout(function () { location.reload(); }, opt.delay == null ? 900 : opt.delay);
        return {keys: keys.length, cancelled: false};
      });
    }
  };
})();

<title data-i18n="title">Profund – aprindem conversații cu sens</title>
<style>

  :root{
    --teal-950:#082826;--teal-900:#0b3735;--teal-800:#0f4845;--teal-700:#125e58;
    --teal-500:#17766d;--teal-300:#5cc4b7;--cream:#f6efe0;--cream-soft:#faf5ea;
    --paper:#fffdf8;--coral:#ff7a59;--coral-ink:#b93a18;--amber:#f4b860;--ink:#13322f;--ink-soft:#3d5a56;
    --shadow:rgba(8,40,38,.18);
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:'Figtree','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--coral);color:#fff}

  /* language toggle */
  .lang-toggle{
    position:fixed;top:1.1rem;right:1.1rem;z-index:50;display:flex;
    background:rgba(8,40,38,.92);backdrop-filter:blur(10px);border:1px solid rgba(246,239,224,.25);
    border-radius:999px;padding:.25rem;gap:.15rem;
  }
  .lang-toggle button{
    font-family:var(--sans);font-weight:700;font-size:.82rem;letter-spacing:.04em;
    padding:.4rem .85rem;border-radius:999px;border:none;cursor:pointer;background:transparent;color:var(--cream);transition:all .2s;
  }
  .lang-toggle button.active{background:var(--amber);color:var(--teal-950)}
  @media (max-width:560px){
    .lang-toggle{top:.6rem;right:.6rem;padding:.2rem;gap:.05rem}
    .lang-toggle button{font-size:.68rem;padding:.38rem .42rem;letter-spacing:0}
  }

  /* HERO */
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 1.5rem 3rem;
    background:radial-gradient(120% 90% at 80% -10%,rgba(244,184,96,.16),transparent 55%),radial-gradient(100% 80% at 10% 110%,rgba(255,122,89,.18),transparent 55%),linear-gradient(165deg,var(--teal-900),var(--teal-950));
    color:var(--cream);overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);opacity:.6}
  .emblem{width:84px;height:84px;margin-bottom:1.6rem;position:relative;z-index:2;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .brand{font-family:var(--serif);font-weight:600;font-size:clamp(3.8rem,12vw,7.5rem);line-height:.9;letter-spacing:-.02em;position:relative;z-index:2;animation:rise .9s .08s cubic-bezier(.2,.8,.2,1) both}
  .brand em{font-style:italic;color:var(--amber)}
  .tagline{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,3vw,1.7rem);color:var(--teal-300);margin-top:.6rem;position:relative;z-index:2;animation:rise .9s .16s cubic-bezier(.2,.8,.2,1) both}
  .hashtag{margin-top:2rem;font-weight:600;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);opacity:.7;position:relative;z-index:2;animation:rise .9s .24s cubic-bezier(.2,.8,.2,1) both}
  .hero-cta{margin-top:2.4rem;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:2;animation:rise .9s .32s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .btn{font-family:var(--sans);font-weight:600;font-size:1rem;padding:.85rem 1.8rem;border-radius:999px;border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;transition:transform .25s,box-shadow .25s,background .25s}
  .btn-primary{background:var(--coral-ink);color:#fff;box-shadow:0 10px 26px rgba(255,122,89,.4)}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(255,122,89,.5)}
  .btn-ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(246,239,224,.4)}
  .btn-ghost:hover{background:rgba(246,239,224,.1);transform:translateY(-3px)}
  .btn-teal{background:var(--teal-700);color:var(--cream)}
  .btn-teal:hover{transform:translateY(-3px);background:var(--teal-500)}
  .scroll-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:2;color:var(--cream);opacity:.6;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;animation:bob 2.2s ease-in-out infinite;text-decoration:none}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

  section{padding:5.5rem 1.5rem}
  .wrap{max-width:1100px;margin:0 auto}
  .narrow{max-width:760px}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,3rem);line-height:1.05;letter-spacing:-.015em;margin-bottom:1.2rem}
  h2 em{font-style:italic;color:var(--coral-ink)}
  .lead{font-size:clamp(1.05rem,2.4vw,1.3rem);color:var(--ink-soft);max-width:620px}
  .legal-status{max-width:46rem;margin:1.4rem auto 0;padding:.8rem 1rem;border:1px solid var(--amber);border-left:6px solid var(--coral);background:var(--paper);color:var(--ink);border-radius:8px;font-size:.92rem;line-height:1.55;text-align:left}
  .legal-status a{color:var(--coral-ink);text-decoration:underline}
  footer .legal-foot strong{color:inherit}
  .eyebrow{font-weight:700;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-500);margin-bottom:.8rem;display:block}

  .intro{background:var(--paper);text-align:center}
  .intro .wrap{display:flex;flex-direction:column;align-items:center}
  .pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem;margin-top:3rem}
  .pillar{background:var(--cream-soft);border:1px solid rgba(18,94,88,.12);border-radius:20px;padding:1.8rem;text-align:left;transition:transform .3s,box-shadow .3s}
  .pillar:hover{transform:translateY(-5px);box-shadow:0 18px 40px var(--shadow)}
  .pillar .ico{font-size:1.6rem;margin-bottom:.6rem;display:block}
  .pillar h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin-bottom:.4rem}
  .pillar p{color:var(--ink-soft);font-size:.98rem}

  .might{background:var(--teal-900);color:var(--cream)}
  .might h2{color:var(--cream)}.might .lead{color:var(--teal-300)}
  .might-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem;margin-top:2.4rem}
  .might-item{display:flex;gap:.9rem;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:1.3rem}
  .might-item .dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--teal-950);display:grid;place-items:center;font-weight:700;font-family:var(--serif)}
  .might-item span:last-child{font-size:1.02rem}

  .ways{background:var(--cream)}
  .ways-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.4rem;margin-top:3rem}
  .way{background:var(--paper);border-radius:22px;padding:2rem;position:relative;overflow:hidden;border:1px solid rgba(18,94,88,.1);transition:transform .3s,box-shadow .3s}
  .way:hover{transform:translateY(-6px);box-shadow:0 20px 44px var(--shadow)}
  .way .num{font-family:var(--serif);font-size:3.4rem;font-weight:600;line-height:1;color:var(--teal-300);position:absolute;top:1.1rem;right:1.4rem;opacity:.55}
  .way h3{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin-bottom:.2rem;padding-right:3rem}
  .way .who{font-size:.82rem;font-weight:600;color:var(--coral-ink);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem}
  .way p{color:var(--ink-soft);font-size:.97rem}

  .play{background:var(--teal-950);color:var(--cream);position:relative}
  .play::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 0%,rgba(244,184,96,.1),transparent 60%);pointer-events:none}
  .play .wrap{position:relative;z-index:2}
  .play h2{color:var(--cream)}.play .lead{color:var(--teal-300)}
  .draw-zone{display:flex;flex-direction:column;align-items:center;gap:1.4rem;margin:2.8rem 0 3.5rem}
  .draw-card{width:min(420px,90vw);min-height:230px;border-radius:24px;padding:2.2rem;background:linear-gradient(150deg,var(--cream-soft),var(--paper));color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);font-size:clamp(1.3rem,3.6vw,1.7rem);line-height:1.25;box-shadow:0 24px 60px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.5);transition:transform .5s cubic-bezier(.2,.8,.2,1);position:relative}
  .draw-card .tag{position:absolute;top:1rem;left:1.4rem;font-family:var(--sans);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--teal-500)}
  .draw-card.flip{animation:dealFlip .55s ease}
  @keyframes dealFlip{0%{transform:rotateY(90deg) scale(.96);opacity:.2}100%{transform:none;opacity:1}}
  .blocks-nav{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2.6rem}
  .block-tab{font-family:var(--sans);font-weight:600;font-size:.85rem;padding:.5rem 1rem;border-radius:999px;border:1.5px solid rgba(92,196,183,.35);background:transparent;color:var(--teal-300);cursor:pointer;transition:all .2s}
  .block-tab:hover{border-color:var(--teal-300)}
  .block-tab.active{background:var(--amber);color:var(--teal-950);border-color:var(--amber)}
  .block-title{font-family:var(--serif);font-style:italic;font-size:1.5rem;text-align:center;margin-bottom:1.8rem;color:var(--amber)}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;perspective:1200px}
  .card{aspect-ratio:3/4;cursor:pointer;background:transparent;border:none;padding:0;perspective:1000px}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;border-radius:16px}
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.35);overflow:hidden}
  .card-back{background:linear-gradient(155deg,var(--teal-700),var(--teal-900));color:var(--cream);flex-direction:column;gap:.4rem}
  .card-back::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(244,184,96,.18),transparent 60%)}
  .card-back .mark{font-family:var(--serif);font-style:italic;font-size:1.6rem;z-index:1}
  .card-back .mark em{color:var(--amber);font-style:italic}
  .card-back .ripple{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(246,239,224,.4);position:relative;z-index:1}
  .card-back .ripple::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(246,239,224,.25)}
  .card:hover .card-back{filter:brightness(1.12)}
  .card-front{background:linear-gradient(155deg,var(--cream-soft),var(--paper));color:var(--ink);transform:rotateY(180deg);flex-direction:column;padding:1rem .9rem;gap:.5rem}
  .card-front .q{font-family:var(--serif);font-size:.92rem;line-height:1.25;overflow-y:auto;max-height:100%}
  .card-front .n{position:absolute;top:.5rem;right:.7rem;font-size:.7rem;font-weight:700;color:var(--teal-300)}


  /* provocarea zilei (v2) */
  .daily{background:var(--teal-900);color:var(--cream)}
  .daily h2{color:var(--cream)}.daily .lead{color:var(--teal-300)}
  .daily-ctl{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin:1.6rem 0 1rem}
  .daily-ctl label{font-weight:600;font-size:.9rem;margin:0;display:inline-flex;gap:.5rem;align-items:center}
  .daily-ctl select{background:var(--teal-700);color:var(--cream);border:1px solid var(--teal-300);border-radius:8px;padding:.45rem .6rem;font:inherit}
  .daily-ctl input[type=checkbox]{width:1.1rem;height:1.1rem;padding:0}
  .daily-date,.daily-streak,.daily-prog{font-size:.9rem;color:var(--teal-300);font-weight:700}
  .daily-hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem;margin:1rem 0}
  .dslot{min-height:76px;border-radius:14px;border:1.5px solid rgba(92,196,183,.4);background:linear-gradient(155deg,var(--teal-700),var(--teal-900));color:var(--cream);font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;align-items:center;justify-content:center;padding:.6rem}
  .dslot[aria-pressed=true]{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
  .dslot .em{font-size:1.5rem;min-height:1.7rem}
  .daily-q{background:var(--paper);color:var(--ink);border-radius:20px;padding:1.6rem;font-family:var(--serif);font-size:1.2rem;line-height:1.35;min-height:5rem;margin:1rem 0}
  .daily-rate{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.6rem 0}
  .daily-rate .btn{padding:.6rem 1.1rem;font-size:.92rem;min-height:44px}
  .daily-rate .btn[aria-pressed=true]{outline:3px solid var(--amber);outline-offset:2px}
  .daily-out{width:100%;max-width:560px;margin-top:.8rem;font:inherit;font-size:1rem;padding:.8rem 1rem;border-radius:12px;border:1.5px solid rgba(92,196,183,.45);background:rgba(255,255,255,.06);color:var(--cream);resize:none}
  .daily-msg{min-height:1.4em;font-size:.9rem;color:var(--amber);font-weight:700}
  @media(max-width:680px){.daily-hand{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}}
  /* OFFLINE */
  .offline{background:var(--cream)}
  .offline-actions{display:flex;gap:1rem;flex-wrap:wrap;margin:2rem 0 1rem}
  .offline-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:2.5rem;align-items:start}
  .offline-box{background:var(--paper);border:1px dashed rgba(18,94,88,.3);border-radius:20px;padding:1.8rem}
  .offline-box h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin-bottom:.5rem}
  .offline-box p{color:var(--ink-soft);font-size:.97rem}
  .offline-box .ico{font-size:1.6rem;display:block;margin-bottom:.5rem}

  .contact{background:var(--paper)}
  .contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start}
  form{display:flex;flex-direction:column;gap:1rem}
  label{font-weight:600;font-size:.9rem;margin-bottom:-.5rem}
  input,textarea{font-family:var(--sans);font-size:1rem;padding:.85rem 1rem;border-radius:12px;border:1.5px solid rgba(18,94,88,.2);background:var(--cream-soft);color:var(--ink);resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--teal-500);background:#fff}
  .hp{display:none}
  .form-note{font-size:.85rem;color:var(--ink-soft);margin-top:.3rem}

  footer{background:var(--teal-950);color:var(--cream);text-align:center;padding:3.5rem 1.5rem}
  footer .fmark{font-family:var(--serif);font-style:italic;font-size:2rem;color:var(--amber);margin-bottom:.8rem}
  footer a{color:var(--teal-300);text-decoration:none;border-bottom:1px solid transparent;transition:border .2s}
  footer a:hover{border-color:var(--teal-300)}
  footer .fine a{text-decoration:underline}
  footer .links{margin:1.2rem 0;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;font-weight:600}
  footer .fine{font-size:.85rem;opacity:.85;margin-top:1.2rem;line-height:1.7}
  .vol{display:inline-block;margin-top:.6rem;font-size:.85rem;opacity:.8}

  /* PRINT SHEET */
  #printSheet{display:none}
  @media print{
    body{background:#fff}
    body>*{display:none !important}
    #printSheet{display:block !important}
    .print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .print-card{border:1.2px solid #0b3735;border-radius:10px;padding:12px 10px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;break-inside:avoid;page-break-inside:avoid}
    .print-card .pc-top{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#1a8a80}
    .print-card .pc-q{font-family:var(--serif);font-size:11px;line-height:1.25;margin:8px 0;color:#13322f}
    .print-card .pc-foot{font-family:var(--serif);font-style:italic;font-size:11px;color:#0b3735;text-align:right}
    .print-head{font-family:var(--serif);font-size:18px;margin-bottom:10px;text-align:center}
    @page{margin:1cm}
  }

  @media(max-width:680px){
    .contact .wrap{grid-template-columns:1fr}
    .offline-grid{grid-template-columns:1fr}
    section{padding:4rem 1.2rem}
    .card-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.7rem}
  }

  .players{display:flex;flex-direction:column;align-items:center;gap:.4rem;width:min(420px,90vw)}
  .players label{font-size:.82rem;font-weight:600;color:var(--teal-300)}
  .players input{width:100%;padding:.55rem .8rem;border-radius:12px;border:1.5px solid rgba(92,196,183,.45);background:rgba(255,255,255,.06);color:var(--cream);font:inherit}
  .players input::placeholder{color:rgba(246,239,224,.6)}
  .players-hint,.kb-hint{font-size:.78rem;color:var(--teal-300);text-align:center;margin:0}
  .turn-line{min-height:1.4em;font-weight:700;color:var(--amber);margin:0}
  .fav-row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:.4rem}
  .fav-row .btn{font-size:.85rem;padding:.55rem 1.1rem}
  .fav-count,.timer-line{font-size:.85rem;color:var(--teal-300);margin:0}
  .timer-line{font-variant-numeric:tabular-nums;min-height:1.3em;font-weight:700}
  .timer-line.done{color:var(--amber)}
  .timer-wrap{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--cream)}
  .timer-wrap select{background:var(--teal-700);color:var(--cream);border:1px solid var(--teal-300);border-radius:8px;padding:.35rem .5rem;font:inherit}
  .draw-buttons{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
  .btn-amber{background:var(--amber);color:var(--teal-950)}
  .btn-amber:hover{transform:translateY(-3px);filter:brightness(1.05)}

/* ținte tactile ≥44px pe ecrane tactile (WCAG 2.5.5) */
@media (pointer:coarse){
.lang-toggle{flex-wrap:wrap;max-width:calc(100vw - 1.2rem);justify-content:flex-end}
.lang-toggle button[data-l],.block-tab,.fav-row .btn,#timerSel{min-height:44px;min-width:44px}
}

/* r9: text minim 12px pe ecrane înguste */
@media (max-width:99999px){
.lang-toggle button,
.draw-card .tag,
.card-front .n,
.print-card .pc-top,
.print-card .pc-q,
.print-card .pc-foot{font-size:12px !important}
}

/* r9: text minim 12px (stiluri inline) */
@media (max-width:99999px){
[style*="font-size:6px"],
[style*="font-size: 6px"],
[style*="font-size:6.5px"],
[style*="font-size: 6.5px"],
[style*="font-size:7px"],
[style*="font-size: 7px"],
[style*="font-size:7.5px"],
[style*="font-size: 7.5px"],
[style*="font-size:8px"],
[style*="font-size: 8px"],
[style*="font-size:8.5px"],
[style*="font-size: 8.5px"],
[style*="font-size:9px"],
[style*="font-size: 9px"],
[style*="font-size:9.5px"],
[style*="font-size: 9.5px"],
[style*="font-size:10px"],
[style*="font-size: 10px"],
[style*="font-size:10.5px"],
[style*="font-size: 10.5px"],
[style*="font-size:11px"],
[style*="font-size: 11px"],
[style*="font-size:11.5px"],
[style*="font-size: 11.5px"]{font-size:12px !important}
}

/* r9: ținte tactile ≥24px */
@media all{
button,[role=button],select,input[type=checkbox],input[type=radio],input[type=range],summary{min-height:24px}
input[type=checkbox],input[type=radio]{min-width:24px}
}

/* r9: focus vizibil pe orice control */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[role=button]:focus-visible,[tabindex]:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}

#app-version[data-fff-label]{display:inline-block;min-height:24px;line-height:24px}
p#app-version[data-fff-label],div#app-version[data-fff-label]{display:block}
input[type=search],input[type=text],input[type=number]{min-height:24px}

footer a,a.scroll-hint{display:inline-block;min-height:24px;line-height:24px}
a[target=_blank],a[href^="mailto:"]{display:inline-block;min-height:24px;line-height:24px}
button[data-l]{min-width:26px}
</style>

<body>

<nav class="lang-toggle" id="langToggle" aria-label="Limbă / Language / Langue / Lingua / Idioma / Sprache / Nyelv">
  <button id="btnRo" class="active" data-l="ro" lang="ro" title="Română">RO</button>
  <button id="btnEn" data-l="en" lang="en" title="English">EN</button>
  <button id="btnFr" data-l="fr" lang="fr" title="Français">FR</button>
  <button id="btnIt" data-l="it" lang="it" title="Italiano">IT</button>
  <button id="btnEs" data-l="es" lang="es" title="Español">ES</button>
  <button id="btnPt" data-l="pt" lang="pt" title="Português">PT</button>
  <button id="btnDe" data-l="de" lang="de" title="Deutsch">DE</button>
  <button id="btnHu" data-l="hu" lang="hu" title="Magyar">HU</button>
</nav>

<header class="hero">
  <svg class="emblem" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <circle cx="50" cy="50" r="46" stroke="#f4b860" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="30" stroke="#5cc4b7" stroke-width="2"/>
    <circle cx="50" cy="50" r="14" stroke="#f6efe0" stroke-width="2"/>
    <circle cx="50" cy="50" r="3" fill="#ff7a59"/>
  </svg>
  <h1 class="brand" data-i18n="brand">Pro<em>fund</em></h1>
  <p class="tagline" data-i18n="tagline">aprindem conversații cu sens</p>
  <p class="hashtag" data-i18n="hashtag">#FaraVorbeGoale</p>
  <div class="hero-cta">
    <a href="#joaca" class="btn btn-primary" data-i18n="cta_play">Joacă online →</a>
    <a href="#despre" class="btn btn-ghost" data-i18n="cta_about">Ce este Profund?</a>
  </div>
  <a href="#despre" class="scroll-hint" data-i18n="scroll">derulează în jos</a>
</header>

<main id="main">
<section class="intro" id="despre">
  <div class="wrap narrow">
    <span class="eyebrow" data-i18n="intro_eyebrow"></span>
    <h2 data-i18n="intro_h2"></h2>
    <p class="lead" style="margin:0 auto" data-i18n="intro_lead"></p>
    <p class="legal-status" id="legal-top" role="note" data-i18n="legal_status"></p>
    <div class="pillars">
      <div class="pillar"><span class="ico">🌉</span><h3 data-i18n="p1h"></h3><p data-i18n="p1p"></p></div>
      <div class="pillar"><span class="ico">💬</span><h3 data-i18n="p2h"></h3><p data-i18n="p2p"></p></div>
      <div class="pillar"><span class="ico">🤲</span><h3 data-i18n="p3h"></h3><p data-i18n="p3p"></p></div>
    </div>
  </div>
</section>

<section class="might">
  <div class="wrap">
    <span class="eyebrow" style="color:var(--amber)" data-i18n="might_eyebrow"></span>
    <h2 data-i18n="might_h2"></h2>
    <div class="might-list">
      <div class="might-item"><span class="dot">1</span><span data-i18n="m1"></span></div>
      <div class="might-item"><span class="dot">2</span><span data-i18n="m2"></span></div>
      <div class="might-item"><span class="dot">3</span><span data-i18n="m3"></span></div>
      <div class="might-item"><span class="dot">4</span><span data-i18n="m4"></span></div>
    </div>
  </div>
</section>

<section class="ways">
  <div class="wrap">
    <span class="eyebrow" data-i18n="ways_eyebrow"></span>
    <h2 data-i18n="ways_h2"></h2>
    <div class="ways-grid">
      <div class="way"><span class="num">1</span><h3 data-i18n="w1h"></h3><p class="who" data-i18n="w1who"></p><p data-i18n="w1p"></p></div>
      <div class="way"><span class="num">2</span><h3 data-i18n="w2h"></h3><p class="who" data-i18n="w2who"></p><p data-i18n="w2p"></p></div>
      <div class="way"><span class="num">3</span><h3 data-i18n="w3h"></h3><p class="who" data-i18n="w3who"></p><p data-i18n="w3p"></p></div>
      <div class="way"><span class="num">4</span><h3 data-i18n="w4h"></h3><p class="who" data-i18n="w4who"></p><p data-i18n="w4p"></p></div>
    </div>
  </div>
</section>

<section class="play" id="joaca">
  <div class="wrap">
    <span class="eyebrow" style="color:var(--amber)" data-i18n="play_eyebrow"></span>
    <h2 data-i18n="play_h2"></h2>
    <p class="lead" data-i18n="play_lead"></p>
    <div class="draw-zone">
      <div class="draw-card" id="drawCard">
        <span class="tag" id="drawTag" data-i18n="draw_tag"></span>
        <span id="drawText" data-i18n="draw_text"></span>
      </div>
        <p class="turn-line" id="turnLine" role="status" aria-live="polite"></p>
      <div class="draw-buttons">
        <button class="btn btn-primary" id="drawBtn" data-i18n="draw_btn"></button>
        <button class="btn btn-teal" id="shuffleBtn" data-i18n="shuffle_btn"></button>
        <button class="btn btn-amber" id="nextBtn" data-i18n="next_btn"></button>
      </div>
      <div class="fav-row">
        <button class="btn btn-ghost" id="favBtn" type="button" aria-pressed="false" data-i18n="fav_add"></button>
        <button class="btn btn-ghost" id="favDl" type="button" data-i18n="fav_dl"></button>
        <span class="fav-count" id="favCount" role="status" aria-live="polite"></span>
        <label class="timer-wrap"><span data-i18n="timer_label"></span>
          <select id="timerSel"><option value="0" data-i18n="timer_off"></option><option value="30">30 s</option><option value="60">60 s</option><option value="120">120 s</option></select></label>
        <span class="timer-line" id="timerLine" role="timer"></span>
      </div>
    <div class="players">
          <label for="playersInput" data-i18n="players_label">Jucători (opțional)</label>
          <input id="playersInput" type="text" maxlength="200" autocomplete="off" data-i18n-ph="players_ph" placeholder="Ana, Mihai, Ioana…" aria-describedby="playersHint">
          <p class="players-hint" id="playersHint" data-i18n="players_hint"></p>

angé ! Appuie sur « Carte suivante ».", "players_label": "Joueurs (facultatif)", "players_ph": "Anne, Marc, Jeanne…", "players_hint": "Saisissez des prénoms séparés par des virgules ; chaque carte tirée indique qui répond. Rien n'est enregistré.", "turn": "Répond :", "fav_add": "♡ Garder la carte", "fav_del": "♥ Retirer des favoris", "fav_count": "Favoris : {n}", "fav_dl": "Télécharger les favoris (texte)", "fav_none": "Tire d'abord une carte.", "fav_head": "Cartes favorites", "fav_empty": "Tu n'as pas encore de carte favorite.", "timer_label": "Minuteur", "timer_off": "Sans", "timer_end": "Le temps est écoulé.", "timer_sec": "{n} s", "kb_hint": "Touches : Espace ou → = carte suivante · R = carte au hasard · S = mélanger", "deck_done": "Tu as parcouru tout le paquet 🎉 Mélange à nouveau.", "offline_eyebrow": "Jouer hors ligne", "offline_h2": "Imprime les <em>cartes</em> toi-même", "offline_lead": "Génère les 150 cartes sur une feuille prête à imprimer (ou enregistre en PDF), puis découpe-les et range-les dans une boîte. Ou télécharge les questions en fichier texte.", "offline_print": "🖨️ Imprimer les cartes (PDF)", "offline_txt": "📄 Télécharger les questions (texte)", "off_b1h": "Le jeu de cartes de base", "off_b1p": "Appuie sur « Imprimer », choisis « Enregistrer en PDF » dans la boîte de dialogue et tu obtiendras les 150 questions, 3 par ligne, prêtes à découper.", "off_b2h": "Façons de jouer &amp; boîte", "off_b2p": "Utilise les 4 façons de jouer ci-dessus. Rassemble les cartes découpées dans une petite boîte et tu auras le jeu complet, sans-échange, où que tu ailles.", "contact_eyebrow": "Contribue", "contact_h2": "Contact", "contact_lead": "Tu as une bonne question qui manque au jeu, des suggestions, ou tu veux traduire ce jeu dans ta langue ? Écris-nous avec plaisir 🙂", "f_name": "Ton nom (obligatoire)", "f_email": "Ton e-mail (obligatoire)", "f_subject": "Sujet", "f_message": "Ton message", "f_submit": "Envoyer le message", "f_sent": "Merci ! Ton message est p "Si pesca una carta; la persona A decide se vuole rispondere alla domanda. Se non vuole, fino a 3 persone possono proporre azioni alternative da compiere. La persona sceglie un'azione. In alternativa, le azioni possono essere stabilite in anticipo. Poi pesca la persona successiva…", "play_eyebrow": "Gioca online", "play_h2": "Pesca una carta e <em>comincia</em>", "play_lead": "Ecco le domande per giocare online, divise in blocchi da 10 domande ciascuno. Tocca una carta per girarla.", "draw_tag": "premi un pulsante", "draw_text": "Pesca una carta a caso oppure mescola tutto il mazzo e lascia scorrere la conversazione…", "draw_btn": "🎴 Carta a caso", "shuffle_btn": "🔀 Mescola il mazzo", "next_btn": "⏭️ Carta successiva", "deck_shuffled": "Mazzo mescolato! Premi «Carta successiva».", "players_label": "Giocatori (facoltativo)", "players_ph": "Anna, Marco, Giulia…", "players_hint": "Scrivi i nomi separati da virgole; ogni carta pescata mostra chi risponde. Non viene salvato nulla.", "turn": "Risponde:", "fav_add": "♡ Tieni questa carta", "fav_del": "♥ Rimuovi dai preferiti", "fav_count": "Preferiti: {n}", "fav_dl": "Scarica i preferiti (testo)", "fav_none": "Pesca prima una carta.", "fav_head": "Carte preferite", "fav_empty": "Non hai ancora nessuna carta preferita.", "timer_label": "Timer", "timer_off": "Disattivato", "timer_end": "Tempo scaduto.", "timer_sec": "{n} s", "kb_hint": "Tasti: Spazio o → = carta successiva · R = carta a caso · S = mescola", "deck_done": "Hai finito tutto il mazzo 🎉 Mescola di nuovo.", "offline_eyebrow": "Gioca offline", "offline_h2": "Stampa le <em>carte</em> da solo", "offline_lead": "Genera tutte le 150 carte su un foglio pronto per la stampa (o salvalo in PDF), poi ritagliale e mettile in una scatola. Oppure scarica le domande come file di testo.", "offline_print": "🖨️ Stampa le carte (PDF)", "offline_txt": "📄 Scarica le domande (testo)", "off_b1h": "Il set di carte base", "off_b1p": "Premi «Stampa», scegli «Salva come PDF» nella finestra s://deepcards.org/\" target=\"_blank\" rel=\"noopener\">deepcards.org</a> (attribuzione). <strong>Il consenso dei titolari dei diritti non è stato confermato — da chiarire a cura dell’autore.</strong> L’app non afferma che tale consenso esista; fino al chiarimento resta pubblicata con l’attribuzione sopra. Richieste di correzione o ritiro: <a href=\"mailto:alexio@trom.tf\">alexio@trom.tf</a>."}, "es": {"ver_label": "Versión", "title": "Profundo – encendemos conversaciones con sentido", "brand": "Pro<em>fundo</em>", "tagline": "encendemos conversaciones con sentido", "hashtag": "#SinPalabrasVacías", "cta_play": "Juega en línea →", "cta_about": "¿Qué es Profundo?", "scroll": "desplázate hacia abajo", "intro_eyebrow": "Hablemos de verdad", "intro_h2": "¡Tengamos conversaciones <em>con sentido</em> en todo el mundo!", "intro_lead": "¿Conoces de verdad a las personas que te rodean? Conoceos mejor con este juego de preguntas trade-free.", "p1h": "Un puente entre las personas", "p1p": "Acerca a la gente y crea conexiones reales más allá de la charla superficial.", "p2h": "Un punto de partida para conversar", "p2p": "Una buena pregunta abre puertas que no sabías que tenías. Lo demás viene solo.", "p3h": "Un juego trade-free", "p3p": "No tienes que dar nada a cambio por jugar. Ni dinero, ni datos, nada. Es totalmente trade-free 🙂", "might_eyebrow": "Lo que podría pasar", "might_h2": "Podrías…", "m1": "llegar a conocer de verdad a las personas con las que pasas el tiempo", "m2": "desarrollar más profundidad en tu interior", "m3": "enamorarte de alguien que te gusta", "m4": "hablar de temas e ideas realmente interesantes", "ways_eyebrow": "Reglas sencillas, posibilidades infinitas", "ways_h2": "Formas de <em>jugar</em>", "w1h": "Toma &amp; Responde", "w1who": "ideal para 2–6 personas", "w1p": "Una persona toma una carta, la lee en voz alta y responde a la pregunta. Cualquier otra persona que quiera también puede responder. Las conversaciones pueden durar todo lo que queráis. Después toma una carta la siguiente persona, y así sucesivamente.", "w2h": "Adivina", "w2who": "ideal para 2–6 personas", "w2p": "Una persona toma una carta, la lee en voz alta y las demás intentan adivinar cuál sería su respuesta a la pregunta. Las conversaciones pueden durar todo lo que queráis. Después toma una carta la siguiente persona, y así sucesivamente.", "w3h": "Rompehielos", "w3who": "ideal para 4–20 personas", "w3p": "Cuando os reunís en grupo, cada persona nueva que llega puede tomar una carta y responder a la pregunta. Quienes ya estaban pueden añadir más preguntas.", "w4h": "SinRespuesta – PasaALaAcción", "w4who": "ideal para 2–10 personas", "w4p": "Se toma una carta; la persona A decide si quiere responder a la pregunta. Si no, hasta 3 personas pueden proponer acciones alternativas que tendrá que hacer. Elige una de ellas. También se pueden fijar las acciones de antemano. Después toma carta la siguiente persona…", "play_eyebrow": "Juega en línea", "play_h2": "Saca una carta y <em>empieza</em>", "play_lead": "Aquí tienes las preguntas para jugar en línea, organizadas en bloques de 10 preguntas cada uno. Toca cualquier carta para darle la vuelta.", "draw_tag": "pulsa un botón", "draw_text": "Saca una carta al azar o baraja todo el mazo y deja que la conversación fluya…", "draw_btn": "🎴 Carta al azar", "shuffle_btn": "🔀 Barajar el mazo", "next_btn": "⏭️ Siguiente carta", "deck_shuffled": "¡Mazo barajado! Pulsa «Siguiente carta».", "players_label": "Jugadores (opcional)", "players_ph": "Ana, Miguel, Laura…", "players_hint": "Escribe los nombres separados por comas; cada carta que salga mostrará quién responde. No se guarda nada.", "turn": "Responde:", "fav_add": "♡ Guardar esta carta", "fav_del": "♥ Quitar de favoritas", "fav_count": "Favoritas: {n}", "fav_dl": "Descargar favoritas (texto)", "fav_none": "Primero saca una carta.", "fav_head": "Cartas favoritas", "fav_empty": "Todavía no tienes ninguna carta favorita.", "timer_label": "Temporizador", "timer ncek letöltése (szöveg)", "fav_none": "Előbb húzz egy kártyát.", "fav_head": "Kedvenc kártyák", "fav_empty": "Még nincs kedvenc kártyád.", "timer_label": "Időzítő", "timer_off": "Ki", "timer_end": "Lejárt az idő.", "timer_sec": "{n} mp", "kb_hint": "Billentyűk: Szóköz vagy → = következő kártya · R = véletlen kártya · S = keverés", "deck_done": "Végigmentél az egész paklin 🎉 Keverd meg újra.", "offline_eyebrow": "Játssz offline", "offline_h2": "Nyomtasd ki magad a <em>kártyákat</em>", "offline_lead": "Készítsd el mind a 150 kártyát egy nyomtatásra kész lapon (vagy mentsd PDF-ként), aztán vágd ki őket, és tedd egy dobozba. Vagy töltsd le a kérdéseket szöveges fájlként.", "offline_print": "🖨️ Kártyák nyomtatása (PDF)", "offline_txt": "📄 Kérdések letöltése (szöveg)", "off_b1h": "Az alap kártyakészlet", "off_b1p": "Nyomd meg a „Nyomtatás” gombot, válaszd a „Mentés PDF-ként” lehetőséget a nyomtatási ablakban, és megkapod mind a 150 kérdést, soronként 3-at, kivágásra készen.", "off_b2h": "Játékmódok &amp; doboz", "off_b2p": "Használd a fent leírt 4 játékmódot. Gyűjtsd a kivágott kártyákat egy kis dobozba, és kész a teljes, trade-free játék, bárhová mész.", "contact_eyebrow": "Közreműködés", "contact_h2": "Kapcsolat", "contact_lead": "Van egy jó kérdésed, ami hiányzik a játékból, javaslatod, vagy le szeretnéd fordítani a játékot a saját nyelvedre? Keress bátran 🙂", "f_name": "A neved (kötelező)", "f_email": "Az e-mail-címed (kötelező)", "f_subject": "Tárgy", "f_message": "Az üzeneted", "f_submit": "Üzenet küldése", "f_sent": "Köszönjük! Az üzeneted elő van készítve. 🙂", "f_about": "Rólunk", "f_play": "Játssz online", "f_offline": "Játssz offline", "f_contact": "Kapcsolat", "f_fine": "Ez egy <strong>trade-free</strong> kérdezős játék.<br>Román / angol / francia adaptáció a <a href=\"https://deepcards.org/\" target=\"_blank\" rel=\"noopener\">deepcards.org</a> alapján · a <a href=\"https://www.tiotrom.com/\" target=\"_blank\" rel=\"noopener\">TROM</a> ökoszisztéma része.", "f "fr": "Quelle est la première chose que tu fais en te réveillant ?", "it": "Qual è la prima cosa che fai quando ti svegli?", "es": "¿Qué es lo primero que haces al despertarte?", "pt": "Qual é a primeira coisa que fazes quando acordas?", "de": "Was ist das Erste, was du nach dem Aufwachen tust?", "hu": "Mi az első dolog, amit felkeléskor csinálsz?"}, {"ro": "Ai un interes/o trăsătură la care nimeni nu s-ar aștepta de la tine?", "en": "Do you have an interest or trait that no one would expect from you?", "fr": "As-tu un intérêt ou un trait auquel personne ne s'attendrait de ta part ?", "it": "Hai un interesse o un tratto che nessuno si aspetterebbe da te?", "es": "¿Tienes algún interés o rasgo que nadie esperaría de ti?", "pt": "Tens algum interesse ou traço que ninguém esperaria de ti?", "de": "Hast du ein Interesse oder eine Eigenschaft, die niemand von dir erwarten würde?", "hu": "Van olyan érdeklődési köröd vagy tulajdonságod, amit senki sem várna tőled?"}, {"ro": "Dacă ai fi blocat(ă) un an pe o insulă, pe cine ai vrea să ai acolo cu tine?", "en": "If you were stuck on an island for a year, who would you want there with you?", "fr": "Si tu étais bloqué(e) un an sur une île, qui voudrais-tu avoir là avec toi ?", "it": "Se fossi bloccato/a su un'isola per un anno, chi vorresti avere con te?", "es": "Si te quedaras atrapado/a en una isla durante un año, ¿a quién querrías tener contigo?", "pt": "Se ficasses preso/a numa ilha durante um ano, quem gostarias de ter contigo?", "de": "Wenn du ein Jahr lang auf einer Insel festsäßest, wen würdest du gern bei dir haben?", "hu": "Ha egy évig egy szigeten ragadnál, kit szeretnél magad mellett tudni?"}, {"ro": "Casa ta cu toate lucrurile tale e în flăcări – ce două lucruri ai salva?", "en": "Your house with all your stuff is on fire – which two things would you save?", "fr": "Ta maison avec toutes tes affaires est en flammes – quelles deux choses sauverais-tu ?", "it": "La tua casa con tutte le tue cose va a fuoco: quali due cose salveresti?", "es": "Tu casa con todas tus cosas se está quemando: ¿qué dos cosas salvarías?", "pt": "A tua casa com todas as tuas coisas está a arder — que duas coisas salvarias?", "de": "Dein Haus mit all deinen Sachen brennt – welche zwei Dinge würdest du retten?", "hu": "Ég a házad az összes holmiddal – melyik két dolgot mentenéd ki?"}, {"ro": "Când ești foarte leneș(ă) și demotivat(ă), care e trucul tău ca să te împingi de la spate și să te apuci iar de treabă?", "en": "When you are really lazy and unmotivated, what is your trick to push yourself and start doing something again?", "fr": "Quand tu es très paresseux(se) et démotivé(e), quelle est ton astuce pour te pousser et te remettre au travail ?", "it": "Quando sei davvero pigro/a e senza motivazione, qual è il tuo trucco per darti una spinta e rimetterti a fare qualcosa?", "es": "Cuando estás muy perezoso/a y sin motivación, ¿cuál es tu truco para darte un empujón y volver a ponerte en marcha?", "pt": "Quando estás mesmo preguiçoso/a e sem motivação, qual é o teu truque para te dares um impulso e voltares a fazer alguma coisa?", "de": "Wenn du richtig faul und unmotiviert bist, was ist dein Trick, um dich aufzuraffen und wieder etwas anzufangen?", "hu": "Ha igazán lusta vagy és motiválatlan, mi a trükköd, hogy összeszedd magad, és újra belekezdj valamibe?"}, {"ro": "Dacă ai fi sigur(ă) că ți s-ar vinde cartea de 100.000 de ori – despre ce ai scrie?", "en": "If you were sure that your book would be sold 100,000 times – what would you write about?", "fr": "Si tu étais sûr(e) que ton livre se vendrait à 100 000 exemplaires – sur quoi écrirais-tu ?", "it": "Se fossi sicuro/a che il tuo libro venderà 100.000 copie, di cosa scriveresti?", "es": "Si tuvieras la certeza de que tu libro se vendería 100.000 veces, ¿sobre qué escribirías?", "pt": "Se tivesses a certeza de que o teu livro iria vender 100 000 exemplares — sobre o que escreverias?", "de": "Wenn du sicher wüsstest, dass sich dein Buch 100.000-mal verkaufen würde – worüber würdest du schreiben?", "hu": "Ha biztosan tudnád, hogy a könyved 100 000 példányban fogy – miről írnál?"}, {"ro": "Ce ai face dacă ai fi președinte?", "en": "What would you do if you were president?", "fr": "Que ferais-tu si tu étais président(e) ?", "it": "Cosa faresti se fossi presidente?", "es": "¿Qué harías si fueras presidente/a?", "pt": "O que farias se fosses presidente?", "de": "Was würdest du tun, wenn du Präsident(in) wärst?", "hu": "Mit tennél, ha te lennél az elnök?"}, {"ro": "Dacă ai putea schimba ceva la felul în care ai fost crescut(ă) – ce ar fi?", "en": "If you could change something about the way you were raised – what would it be?", "fr": "Si tu pouvais changer quelque chose à la façon dont tu as été élevé(e) – qu'est-ce que ce serait ?", "it": "Se potessi cambiare qualcosa del modo in cui sei stato/a educato/a, cosa sarebbe?", "es": "Si pudieras cambiar algo de la forma en que te criaron, ¿qué sería?", "pt": "Se pudesses mudar alguma coisa na forma como foste educado/a — o que seria?", "de": "Wenn du etwas an deiner Erziehung ändern könntest – was wäre das?", "hu": "Ha megváltoztathatnál valamit abban, ahogyan felneveltek – mi lenne az?"}, {"ro": "Dacă te-ai trezi mâine cu o nouă abilitate – care ar fi?", "en": "If you could wake up with a new skill tomorrow – what would it be?", "fr": "Si tu pouvais te réveiller demain avec une nouvelle compétence – laquelle serait-ce ?", "it": "Se domani potessi svegliarti con una nuova abilità, quale sarebbe?", "es": "Si mañana pudieras despertarte con una nueva habilidad, ¿cuál sería?", "pt": "Se amanhã pudesses acordar com uma nova competência — qual seria?", "de": "Wenn du morgen mit einer neuen Fähigkeit aufwachen könntest – welche wäre es?", "hu": "Ha holnap egy új képességgel ébredhetnél – mi lenne az?"}, {"ro": "Dacă ai muri diseară fără șansa de a mai vorbi cu cineva înainte – ce ai regreta că nu i-ai spus cuiva? De ce nu i-ai spus deja?", "en": "If you died this evening without the chance to speak to anyone first – what would you regret not having told someone? Why haven't you told them already?", "fr": "Si tu mourais ce soir sans avoir la chance de parler à quiconque avant – que regretterais-tu de ne pas avoir dit à quelqu'un ? Pourquoi ne le lui as-tu pas déjà dit ?", "it": "Se morissi stasera senza avere la possibilità di parlare prima con qualcuno, cosa rimpiangeresti di non aver detto a qualcuno? Perché non glielo hai già detto?", "es": "Si murieras esta noche sin poder hablar antes con nadie, ¿qué lamentarías no haberle dicho a alguien? ¿Por qué no se lo has dicho ya?", "pt": "Se morresses esta noite sem hipótese de falar antes com ninguém — o que lamentarias não ter dito a alguém? Porque é que ainda não o disseste?", "de": "Wenn du heute Abend sterben würdest, ohne vorher noch mit jemandem sprechen zu können – was würdest du bereuen, jemandem nicht gesagt zu haben? Warum hast du es ihm oder ihr nicht schon längst gesagt?", "hu": "Ha ma este meghalnál úgy, hogy előtte már senkivel sem beszélhetnél – mit bánnál, hogy nem mondtál el valakinek? Miért nem mondtad el már eddig?"}]}, {"title": {"ro": "Blocul 3 · profund", "en": "Block 3 · deep", "fr": "Bloc 3 · profond", "it": "Blocco 3 · profondo", "es": "Bloque 3 · profundo", "pt": "Bloco 3 · profundo", "de": "Block 3 · tiefgründig", "hu": "3. blokk · mély"}, "tag": {"ro": "profund", "en": "deep", "fr": "profond", "it": "profondo", "es": "profundo", "pt": "profundo", "de": "tiefgründig", "hu": "mély"}, "q": [{"ro": "Cine ești tu?", "en": "Who are you?", "fr": "Qui es-tu ?", "it": "Chi sei?", "es": "¿Quién eres?", "pt": "Quem és tu?", "de": "Wer bist du?", "hu": "Ki vagy te?"}, {"ro": "Ce mai faci… cu adevărat?", "en": "How are you… really?", "fr": "Comment vas-tu… vraiment ?", "it": "Come stai… davvero?", "es": "¿Cómo estás… de verdad?", "pt": "Como estás… mesmo?", "de": "Wie geht es dir… wirklich?", "hu": "Hogy vagy… igazából?"}, {"ro": "Ce vrei să realizezi în viață?", "en": "What do you want to achieve in life?", "fr": "Que veux-tu accomplir dans la vie ?", "it": "Cosa vuoi realizzare nella vita?", "es": "¿Qué quieres lograr en la vida?", "pt": "O que queres alcançar na vida?", "de": "Was willst du im Leben erreichen?", "hu": "Mit szeretnél elérni az életben?"}, {"ro": "Cum faci față anxietății?", "en": "How do you deal with anxiety?", "fr": "Comment gères-tu l'anxiété ?", "it": "Come affronti l'ansia?", "es": "¿Cómo afrontas la ansiedad?", "pt": "Como lidas com a ansiedade?", "de": "Wie gehst du mit Angst um?", "hu": "Hogyan birkózol meg a szorongással?"}, {"ro": "Povestește-ți viața în 4 minute, cât mai detaliat posibil.", "en": "Share your life story in 4 minutes, as detailed as possible.", "fr": "Raconte l'histoire de ta vie en 4 minutes, le plus en détail possible.", "it": "Racconta la storia della tua vita in 4 minuti, con più dettagli possibile.", "es": "Cuenta la historia de tu vida en 4 minutos, con el mayor detalle posible.", "pt": "Conta a história da tua vida em 4 minutos, o mais pormenorizada possível.", "de": "Erzähle deine Lebensgeschichte in 4 Minuten, so ausführlich wie möglich.", "hu": "Mesélj az élettörténetedről 4 percben, a lehető legrészletesebben."}, {"ro": "Care e cea mai mare realizare a ta?", "en": "What is your biggest achievement?", "fr": "Quelle est ta plus grande réussite ?", "it": "Qual è il tuo più grande traguardo?", "es": "¿Cuál es tu mayor logro?", "pt": "Qual é a tua maior conquista?", "de": "Was ist deine größte Leistung?", "hu": "Mi a legnagyobb eredményed?"}, {"ro": "Care e pasiunea ta?", "en": "What is your passion?", "fr": "Quelle est ta passion ?", "it": "Qual è la tua passione?", "es": "¿Cuál es tu pasión?", "pt": "Qual é a tua paixão?", "de": "Was ist deine Leidenschaft?", "hu": "Mi a szenvedélyed?"}, {"ro": "Pe o scară de la 1 la 10, cât de împlinit(ă) ești?", "en": "On a scale from 1 to 10, how content are you?", "fr": "Sur une échelle de 1 à 10, à quel point es-tu épanoui(e) ?", "it": "Su una scala da 1 a 10, quanto sei soddisfatto/a?", "es": "En una escala del 1 al 10, ¿cuán satisfecho/a estás?", "pt": "Numa escala de 1 a 10, quão satisfeito/a estás?", "de": "Wie zufrieden bist du auf einer Skala von 1 bis 10?", "hu": "Egy 1-től 10-ig terjedő skálán mennyire vagy elégedett?"}, {"ro": "Ce trăsătură de personalitate îți place la tine?", "en": "What personality trait do you like about yourself?", "fr": "Quel trait de personnalité aimes-tu chez toi ?", "it": "Quale tratto della tua personalità ti piace di te?", "es": "¿Qué rasgo de tu personalidad te gusta de ti?", "pt": "Que traço da tua personalidade gostas em ti?", "de": "Welche Persönlichkeitseigenschaft magst du an dir?", "hu": "Melyik személyiségjegyedet szereted magadban?"}, {"ro": "Ce trăsătură de caracter apreciezi cel mai mult la tine?", "en": "What character trait do you value most in yourself?", "fr": "Quel trait de caractère apprécies-tu le plus chez toi ?", "it": "Quale qualità del tuo carattere apprezzi di più in te?", "es": "¿Qué rasgo de carácter valoras más en ti?", "pt": "Que traço de carácter mais valorizas em ti?", "de": "Welche Charaktereigenschaft schätzt du an dir am meisten?", "hu": "Melyik jellemvonásodat becsülöd magadban a legtöbbre?"}]}, {"title": {"ro": "Blocul 4 · despre conceptul fără-troc", "en": "Block 4 · about the trade-free concept", "fr": "Bloc 4 · le concept sans-échange", "it": "Blocco 4 · il concetto trade-free", "es": "Bloque 4 · el concepto trade-free", "pt": "Bloco 4 · o conceito trade-free", "de": "Block 4 · das Trade-free-Konzept", "hu": "4. blokk · a trade-free koncepció"}, "tag": {"ro": "fără-troc", "en": "trade-free", "fr": "sans-échange", "it": "trade-free", "es": "trade-free", "pt": "trade-free", "de": "trade-free", "hu": "trade-free"}, "q": [{"ro": "Dacă ai avea tot ce vrei și îți trebuie fără să dai nimic în schimb (adică fără-troc), ce ți-ar plăcea să faci?", "en": "If you had everything you want and need without giving anything in return for it (thus trade-free), what would you love to do?", "fr": "Si tu avais tout ce que tu veux et dont tu as besoin sans rien donner en retour (donc sans-échange), qu'aimerais-tu faire ?", "it": "Se avessi tutto ciò che vuoi e di cui hai bisogno senza dare nulla in cambio (cioè trade-free), cosa ameresti fare?", "es": "Si tuvieras todo lo que quieres y necesitas sin dar nada a cambio (es decir, trade-free), ¿qué te encantaría hacer?", "pt": "Se tivesses tudo o que queres e de que precisas sem dares nada em troca (ou seja, trade-free), o que gostarias de fazer?", "de": "Wenn du alles hättest, was du willst und brauchst, ohne etwas dafür zu geben (also trade-free), was würdest du gern tun?", "hu": "Ha mindened meglenne, amit akarsz és amire szükséged van, anélkül, hogy bármit adnál érte cserébe (vagyis trade-free), mit szeretnél csinálni?"}, {"ro": "Ai pus vreodată sub semnul întrebării conceptul de troc/schimb?", "en": "Have you ever questioned the concept of trade?", "fr": "As-tu déjà remis en question le concept d'échange ?", "it": "Hai mai messo in discussione il concetto di commercio?", "es": "¿Alguna vez has cuestionado el concepto de comercio?", "pt": "Alguma vez questionaste o conceito de comércio?", "de": "Hast du jemals das Konzept des Handels infrage gestellt?", "hu": "Megkérdőjelezted már valaha a kereskedelem fogalmát?"}, {"ro": "Ce lucru sau activitate fără-troc îți place?", "en": "What trade-free thing or activity do you like?", "fr": "Quelle chose ou activité sans-échange aimes-tu ?", "it": "Quale cosa o attività trade-free ti piace?", "es": "¿Qué cosa o actividad trade-free te gusta?", "pt": "Que coisa ou atividade trade-free te agrada?", "de": "Welche trade-free Sache oder Aktivität magst du?", "hu": "Melyik trade-free dolgot vagy tevékenységet szereted?"}, {"ro": "Te-ai gândit vreodată la troc ca la originea majorității problemelor, ca o forță care îi poate împinge pe oameni să creeze probleme?", "en": "Have you ever thought about trade as the origin of most problems, acting as a force that can push people to create problems?", "fr": "As-tu déjà pensé à l'échange comme à l'origine de la plupart des problèmes, telle une force qui peut pousser les gens à en créer ?", "it": "Hai mai pensato al commercio come all'origine della maggior parte dei problemi, una forza che può spingere le persone a crearne?", "es": "¿Alguna vez has pensado en el comercio como el origen de la mayoría de los problemas, una fuerza que puede empujar a las personas a crearlos?", "pt": "Já pensaste no comércio como a origem da maior parte dos problemas, uma força que pode levar as pessoas a criá-los?", "de": "Hast du schon einmal darüber nachgedacht, dass der Handel der Ursprung der meisten Probleme sein könnte – eine Kraft, die Menschen dazu bringen kann, Probleme zu schaffen?", "hu": "Gondoltál már arra, hogy a kereskedelem a legtöbb probléma forrása, olyan erő, amely problémák teremtésére késztetheti az embereket?"}, {"ro": "Prieteniile tale sunt fără-troc?", "en": "Are your friendships trade-free?", "fr": "Tes amitiés sont-elles sans-échange ?", "it": "Le tue amicizie sono trade-free?", "es": "¿Tus amistades son trade-free?", "pt": "As tuas amizades são trade-free?", "de": "Sind deine Freundschaften trade-free?", "hu": "Trade-free a barátságaid?"}, {"ro": "Care troc e cel mai rău pentru tine?", "en": "Which trade is the worst for you?", "fr": "Quel échange est le pire pour toi ?", "it": "Quale tipo di scambio commerciale è il peggiore per te?", "es": "¿Qué intercambio comercial es el peor para ti?", "pt": "Qual é, para ti, a pior troca comercial?", "de": "Welcher Handel ist für dich der schlimmste?", "hu": "Melyik csere a legrosszabb számodra?"}, {"ro": "Îți poți imagina o lume plină de voluntari, proiecte open-source și bunuri/servicii fără-troc?", "en": "Can you imagine a world full of volunteers, open-source projects and trade-free goods and services?", "fr": "Peux-tu imaginer un monde plein de bénévoles, de projets open-source et de biens/services sans-échange ?", "it": "Riesci a immaginare un mondo pieno di volontari, progetti open source e beni e servizi trade-free?", "es": "¿Puedes imaginar un mundo lleno de voluntarios, proyectos de código abierto y bienes y servicios trade-free?", "pt": "Consegues imaginar um mundo cheio de voluntários, projetos de código aberto e bens e serviços trade-free?", "de": "Kannst du dir eine Welt voller Freiwilliger, Open-Source-Projekte und trade-free Güter und Dienstleistungen vorstellen?", "hu": "El tudsz képzelni egy olyan világot, amely tele van önkéntesekkel, nyílt forráskódú projektekkel és trade-free javakkal és szolgáltatásokkal?"}, {"ro": "Care e bunul sau serviciul tău preferat fără-troc?", "en": "What is your favourite trade-free good or service?", "fr": "Quel est ton bien ou service sans-échange préféré ?", "it": "Qual è il tuo bene o servizio trade-free preferito?", "es": "¿Cuál es tu bien o servicio trade-free favorito?", "pt": "Qual é o teu bem ou serviço trade-free preferido?", "de": "Was ist dein liebstes trade-free Gut oder deine liebste trade-free Dienstleistung?", "hu": "Mi a kedvenc trade-free javad vagy szolgáltatásod?"}, {"ro": "Ce ai putea face ca să susții sau să promovezi ideea fără-troc?", "en": "What could you do to support or promote the trade-free idea?", "fr": "Que pourrais-tu faire pour soutenir ou promouvoir l'idée du sans-échange ?", "it": "Cosa potresti fare per sostenere o promuovere l'idea trade-free?", "es": "¿Qué podrías hacer para apoyar o promover la idea trade-free?", "pt": "O que poderias fazer para apoiar ou promover a ideia trade-free?", "de": "Was könntest du tun, um die Trade-free-Idee zu unterstützen oder zu verbreiten?", "hu": "Mit tehetnél a trade-free eszme támogatásáért vagy terjesztéséért?"}, {"ro": "Ce lucru ai vrea să-l vezi mai întâi devenind fără-troc?", "en": "What would you love to see become trade-free first?", "fr": "Quelle chose aimerais-tu voir devenir sans-échange en premier ?", "it": "Cosa ameresti vedere diventare trade-free per prima?", "es": "¿Qué te encantaría ver convertirse primero en trade-free?", "pt": "O que gostarias de ver tornar-se trade-free em primeiro lugar?", "de": "Was würdest du am liebsten als Erstes trade-free sehen?", "hu": "Mit szeretnél először trade-free-vé válni látni?"}]}, {"title": {"ro": "Blocul 5 · aleatoriu", "en": "Block 5 · random", "fr": "Bloc 5 · aléatoire", "it": "Blocco 5 · a caso", "es": "Bloque 5 · al azar", "pt": "Bloco 5 · ao acaso", "de": "Block 5 · Zufall", "hu": "5. blokk · véletlen"}, "tag": {"ro": "aleatoriu", "en": "random", "fr": "aléatoire", "it": "a caso", "es": "al azar", "pt": "ao acaso", "de": "Zufall", "hu": "véletlen"}, "q": [{"ro": "Ce faci ca să te calmezi?", "en": "What do you do to calm down?", "fr": "Que fais-tu pour te calmer ?", "it": "Cosa fai per calmarti?", "es": "¿Qué haces para calmarte?", "pt": "O que fazes para te acalmares?", "de": "Was tust du, um dich zu beruhigen?", "hu": "Mit csinálsz, hogy megnyugodj?"}, {"ro": "Ce înveți în prezent în viață?", "en": "What are you currently learning in life?", "fr": "Qu'apprends-tu en ce moment dans la vie ?", "it": "Cosa stai imparando in questo momento della tua vita?", "es": "¿Qué estás aprendiendo actualmente en la vida?", "pt": "O que estás a aprender neste momento na vida?", "de": "Was lernst du gerade im Leben?", "hu": "Mit tanulsz éppen az életben?"}, {"ro": "Descrie-te în trei cuvinte.", "en": "Describe yourself in three words.", "fr": "Décris-toi en trois mots.", "it": "Descriviti con tre parole.", "es": "Descríbete con tres palabras.", "pt": "Descreve-te em três palavras.", "de": "Beschreibe dich in drei Worten.", "hu": "Jellemezd magad három szóval."}, {"ro": "Dacă ai putea întâlni orice persoană care a trăit vreodată, pe cine ai vrea să întâlnești?", "en": "If you could meet any person who ever lived, who would you want to meet?", "fr": "Si tu pouvais rencontrer n'importe quelle personne ayant vécu, qui voudrais-tu rencontrer ?", "it": "Se potessi incontrare una qualsiasi persona vissuta nella storia, chi vorresti incontrare?", "es": "Si pudieras conocer a cualquier persona que haya vivido jamás, ¿a quién te gustaría conocer?", "pt": "Se pudesses conhecer qualquer pessoa que alguma vez tenha vivido, quem gostarias de conhecer?", "de": "Wenn du einen beliebigen Menschen treffen könntest, der je gelebt hat, wen würdest du gern treffen?", "hu": "Ha találkozhatnál bárkivel, aki valaha élt, kivel szeretnél találkozni?"}, {"ro": "Ce faci când o decizie e dificilă pentru tine?", "en": "What do you do when a decision is difficult for you?", "fr": "Que fais-tu quand une décision est difficile pour toi ?", "it": "Cosa fai quando una decisione è difficile per te?", "es": "¿Qué haces cuando una decisión te resulta difícil?", "pt": "O que fazes quando uma decisão é difícil para ti?", "de": "Was tust du, wenn dir eine Entscheidung schwerfällt?", "hu": "Mit teszel, ha nehéz döntés előtt állsz?"}, {"ro": "Îți place să faci voluntariat? Dacă da, pentru ce?", "en": "Do you like to volunteer? If yes, for what?", "fr": "Aimes-tu faire du bénévolat ? Si oui, pour quoi ?", "it": "Ti piace fare volontariato? Se sì, per cosa?", "es": "¿Te gusta hacer voluntariado? Si es así, ¿en qué?", "pt": "Gostas de fazer voluntariado? Se sim, em quê?", "de": "Engagierst du dich gern ehrenamtlich? Wenn ja, wofür?", "hu": "Szeretsz önkénteskedni? Ha igen, mire?"}, {"ro": "Unde te vezi peste 10 ani?", "en": "Where do you see yourself in 10 years?", "fr": "Où te vois-tu dans 10 ans ?", "it": "Dove ti vedi tra 10 anni?", "es": "¿Dónde te ves dentro de 10 años?", "pt": "Onde te vês daqui a 10 anos?", "de": "Wo siehst du dich in 10 Jahren?", "hu": "Hol látod magad 10 év múlva?"}, {"ro": "Numește 3 persoane pe care le consideri modele.", "en": "Name 3 people you consider role models.", "fr": "Nomme 3 personnes que tu considères comme des modèles.", "it": "Nomina 3 persone che consideri modelli di riferimento.", "es": "Nombra 3 personas que consideres modelos a seguir.", "pt": "Indica 3 pessoas que consideres modelos a seguir.", "de": "Nenne 3 Menschen, die du als Vorbilder ansiehst.", "hu": "Nevezz meg 3 embert, akit példaképnek tartasz."}, {"ro": "Cum te descriu prietenii tăi?", "en": "How do your friends describe you?", "fr": "Comment tes amis te décrivent-ils ?", "it": "Come ti descrivono i tuoi amici?", "es": "¿Cómo te describen tus amigos?", "pt": "Como te descrevem os teus amigos?", "de": "Wie beschreiben dich deine Freunde?", "hu": "Hogyan jellemeznek a barátaid?"}, {"ro": "Există ceva fără de care nu ai putea trăi?", "en": "Is there something you couldn't live without?", "fr": "Y a-t-il quelque chose dont tu ne pourrais pas te passer ?", "it": "C'è qualcosa senza cui non potresti vivere?", "es": "¿Hay algo sin lo que no podrías vivir?", "pt": "Há alguma coisa sem a qual não conseguirias viver?", "de": "Gibt es etwas, ohne das du nicht leben könntest?", "hu": "Van valami, nélkül nem tudnál élni?"}]}, {"title": {"ro": "Blocul 6 · extra profund", "en": "Block 6 · extra deep", "fr": "Bloc 6 · extra profond", "it": "Blocco 6 · extra profondo", "es": "Bloque 6 · extra profundo", "pt": "Bloco 6 · extra profundo", "de": "Block 6 · extra tiefgründig", "hu": "6. blokk · extra mély"}, "tag": {"ro": "extra profund", "en": "extra deep", "fr": "extra profond", "it": "extra profondo", "es": "extra profundo", "pt": "extra profundo", "de": "extra tiefgründig", "hu": "extra mély"}, "q": [{"ro": "Povestește un moment de cotitură din viața ta.", "en": "Share a turning point in your life.", "fr": "Raconte un tournant de ta vie.", "it": "Racconta una svolta nella tua vita.", "es": "Comparte un punto de inflexión en tu vida.", "pt": "Partilha um ponto de viragem na tua vida.", "de": "Erzähle von einem Wendepunkt in deinem Leben.", "hu": "Mesélj az életed egy fordulópontjáról."}, {"ro": "Care e cel mai nebunesc sau curajos lucru pe care l-ai făcut?", "en": "What is the craziest or bravest thing you have done?", "fr": "Quelle est la chose la plus folle ou la plus courageuse que tu aies faite ?", "it": "Qual è la cosa più folle o più coraggiosa che tu abbia mai fatto?", "es": "¿Qué es lo más loco o lo más valiente que has hecho?", "pt": "Qual é a coisa mais louca ou mais corajosa que já fizeste?", "de": "Was ist das Verrückteste oder Mutigste, das du je getan hast?", "hu": "Mi a legőrültebb vagy legbátrabb dolog, amit valaha tettél?"}, {"ro": "Povestește un moment extrem de jenant din viața ta.", "en": "Share an extremely embarrassing moment of your life.", "fr": "Raconte un moment extrêmement embarrassant de ta vie.", "it": "Racconta un momento estremamente imbarazzante della tua vita.", "es": "Comparte un momento sumamente embarazoso de tu vida.", "pt": "Partilha um momento extremamente embaraçoso da tua vida.", "de": "Erzähle von einem extrem peinlichen Moment in deinem Leben.", "hu": "Mesélj az életed egy rendkívül kínos pillanatáról."}, {"ro": "Există ceva pentru care ești deosebit de recunoscător(oare)?", "en": "Is there something you are especially thankful for?", "fr": "Y a-t-il quelque chose pour lequel tu es particulièrement reconnaissant(e) ?", "it": "C'è qualcosa per cui sei particolarmente grato/a?", "es": "¿Hay algo por lo que estés especialmente agradecido/a?", "pt": "Há alguma coisa pela qual estejas especialmente grato/a?", "de": "Gibt es etwas, wofür du besonders dankbar bist?", "hu": "Van valami, amiért különösen hálás vagy?"}, {"ro": "Ce activități și interese sunt foarte importante pentru tine?", "en": "Which activities and interests are very important to you?", "fr": "Quelles activités et quels intérêts sont très importants pour toi ?", "it": "Quali attività e interessi sono molto importanti per te?", "es": "¿Qué actividades e intereses son muy importantes para ti?", "pt": "Que atividades e interesses são muito importantes para ti?", "de": "Welche Aktivitäten und Interessen sind dir sehr wichtig?", "hu": "Mely tevékenységek és érdeklődési körök nagyon fontosak számodra?"}, {"ro": "A s of an awesome friendship for you?", "fr": "Quelles sont, pour toi, les parties essentielles d'une amitié formidable ?", "it": "Quali sono per te gli elementi fondamentali di un'amicizia bellissima?", "es": "¿Cuáles son para ti los elementos cruciales de una gran amistad?", "pt": "Quais são, para ti, os elementos cruciais de uma grande amizade?", "de": "Was sind für dich die entscheidenden Bestandteile einer großartigen Freundschaft?", "hu": "Mik számodra egy csodálatos barátság kulcsfontosságú elemei?"}, {"ro": "Dacă vrei să povestești despre o pasiune sau iubire din trecut, cum v-ați cunoscut?", "en": "If you want to share a story of a past crush or love, how did you meet?", "fr": "Si tu veux raconter l'histoire d'un coup de cœur ou d'un amour passé, comment vous êtes-vous rencontrés ?", "it": "Se vuoi raccontare una storia di una cotta o di un amore passato, come vi siete conosciuti?", "es": "Si quieres compartir una historia de un amor o un flechazo pasado, ¿cómo os conocisteis?", "pt": "Se quiseres partilhar uma história de uma paixão ou de um amor passado, como se conheceram?", "de": "Wenn du eine Geschichte über eine frühere Schwärmerei oder Liebe teilen möchtest: Wie habt ihr euch kennengelernt?", "hu": "Ha szeretnél megosztani egy történetet egy régi szerelemről vagy fellángolásról: hogyan ismerkedtetek meg?"}]}, {"title": {"ro": "Blocul 8 · aici și acum", "en": "Block 8 · here and now", "fr": "Bloc 8 · ici et maintenant", "it": "Blocco 8 · qui e ora", "es": "Bloque 8 · aquí y ahora", "pt": "Bloco 8 · aqui e agora", "de": "Block 8 · Hier und jetzt", "hu": "8. blokk · itt és most"}, "tag": {"ro": "aici și acum", "en": "here and now", "fr": "ici et maintenant", "it": "qui e ora", "es": "aquí y ahora", "pt": "aqui e agora", "de": "Hier und jetzt", "hu": "itt és most"}, "q": [{"ro": "Ce te fascinează la cineva care stă aici, lângă tine?", "en": "What fascinates you about someone sitting here?", "fr": "Qu'est-ce qui te fascine chez quelqu'un assis ici ?", "it": "Cosa ti affascina di una persona seduta qui?", "es": "¿Qué te fascina de alguien que está sentado aquí?", "pt": "O que te fascina em alguém que está sentado aqui?", "de": "Was fasziniert dich an jemandem, der hier sitzt?", "hu": "Mi nyűgöz le valakiben, aki itt ül?"}, {"ro": "Dacă ai putea călători în timp și ai privi înapoi la viața ta de la 80 de ani, ce sfat ți-ai da pentru situația ta actuală?", "en": "If you could travel in time and look back on your life at 80, what advice would you give yourself for your current situation?", "fr": "Si tu pouvais voyager dans le temps et regarder ta vie depuis tes 80 ans, quel conseil te donnerais-tu pour ta situation actuelle ?", "it": "Se potessi viaggiare nel tempo e guardare la tua vita a 80 anni, quale consiglio daresti a te stesso/a per la tua situazione attuale?", "es": "Si pudieras viajar en el tiempo y mirar tu vida a los 80 años, ¿qué consejo te darías para tu situación actual?", "pt": "Se pudesses viajar no tempo e olhar para a tua vida aos 80 anos, que conselho darias a ti próprio/a para a tua situação atual?", "de": "Wenn du in der Zeit reisen und mit 80 auf dein Leben zurückblicken könntest, welchen Rat würdest du dir für deine jetzige Situation geben?", "hu": "Ha időutazással visszatekinthetnél az életedre 80 évesen, milyen tanácsot adnál magadnak a mostani helyzetedre?"}, {"ro": "Dacă ai muri mâine, ce ai face azi?", "en": "If you would die tomorrow, what would you do today?", "fr": "Si tu devais mourir demain, que ferais-tu aujourd'hui ?", "it": "Se domani dovessi morire, cosa faresti oggi?", "es": "Si murieras mañana, ¿qué harías hoy?", "pt": "Se morresses amanhã, o que farias hoje?", "de": "Wenn du morgen sterben würdest, was würdest du heute tun?", "hu": "Ha holnap meghalnál, mit tennél ma?"}, {"ro": "La ce te gândești în acest moment?", "en": "What's on your mind at the moment?", "fr": "À quoi penses-tu en ce moment ?", "it": "Cosa hai in mente in questo momento?", "es": "¿Qué tienes en la cabeza en este
